---
repository: https://github.com/RazerTexz/aninspector.git
updates: releases
versions:
  - tag: v1.1.1
    apks:
      - apk_pattern: AnInspector.*\.apk
        apk_url: https://github.com/RazerTexz/aninspector/releases/download/v1.1.1/AnInspector-1.1.1.apk
        build:
          - sed -ri '/signingConfigs.getBy/d ; /signingConfigs \{/,/^    \}/d' app/build.gradle.kts
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '22.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
            sha256: 4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583
          extra_packages: []
          image: ubuntu:noble
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
  - tag: v1.1.2
    apks:
      - apk_pattern: AnInspector.*\.apk
