---
repository: https://github.com/DP-Hridayan/Driftly.git
updates: releases
versions:
  - tag: v1.8.2
    apks:
      - apk_pattern: Driftly.*release\.apk
        apk_url: https://github.com/DP-Hridayan/Driftly/releases/download/v1.8.2/Driftly-v1.8.2-release.apk
        build:
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/app-release.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
  - tag: v1.8.3
    apks:
      - apk_pattern: Driftly.*release\.apk
        apk_url: https://github.com/DP-Hridayan/Driftly/releases/download/v1.8.3/Driftly-v1.8.3-release.apk
        build:
          - chmod +x gradlew
          - ./gradlew assembleRelease
