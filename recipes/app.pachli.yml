        build:
          - PROF_FILE=app/build/intermediates/binary_art_profile/blueGithubRelease/compileBlueGithubReleaseArtProfile/baseline.prof
          - PROF_SHA1=54e92666c5e96bd24c5bd4baa0b1ac00cf6a0a00
          - for _ in {1..10}; do
          - ./gradlew clean assembleBlueGithubRelease --no-build-cache --no-configuration-cache --no-daemon
          - find . -name 'baseline.prof'
          - test -f "$PROF_FILE"
          - if [ "$( sha1sum "$PROF_FILE" | cut -d' ' -f1 )" = "$PROF_SHA1" ]; then
          - break
          - fi
          - done
          - find . -name '*.apk'
          - mv app/build/outputs/apk/blueGithub/release/Pachli_*_blueGithub_release.apk /outputs/unsigned.apk
        build_cpus:
