---
repository: https://github.com/vbresan/HealthyBatteryCharging.git
updates: releases
notes:
  - 'FIXED: early versions lacked the gradle-wrapper.jar, so gradle was injected manually to recipe'
versions:
  - tag: '5'
    apks:
      - apk_pattern: biz.binarysolutions.healthybatterycharging-.*-release\.apk
        apk_url: https://github.com/vbresan/HealthyBatteryCharging/releases/download/5/biz.binarysolutions.healthybatterycharging-2.0.3-release.apk
        build:
          - wget -q -O /tmp/gradle-8.2.1-bin.zip -- https://services.gradle.org/distributions/gradle-8.2.1-bin.zip
          - sha256sum -c <<< '03ec176d388f2aa99defcadc3ac6adf8dd2bce5145a129659537c0874dea5ad1  /tmp/gradle-8.2.1-bin.zip'
          - unzip -q -d /opt /tmp/gradle-8.2.1-bin.zip
          - export PATH="${PATH}:/opt/gradle-8.2.1/bin"
          - gradle assembleRelease
          - git clone -b v0.2.8 https://github.com/obfusk/reproducible-apk-tools.git
          - OUT=app/build/outputs/apk/release/*unsigned.apk
          - reproducible-apk-tools/inplace-fix.py --internal --page-size 16 fix-newlines $OUT 'META-INF/services/*'
          - mv $OUT /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
