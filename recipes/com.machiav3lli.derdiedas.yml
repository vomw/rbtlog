---
repository: https://github.com/machiav3lli/DerDieDas.git
updates: releases
versions:
  - tag: 3.0.0
    apks:
      - apk_pattern: DerDieDas.*\.apk
        apk_url: https://github.com/machiav3lli/DerDieDas/releases/download/3.0.0/DerDieDas_300_release.apk
        build:
          - git clone -b 2.2.5 https://github.com/zlib-ng/zlib-ng.git
          - pushd zlib-ng
          - _options=( -G Ninja -DCMAKE_BUILD_TYPE=None -DCMAKE_INSTALL_PREFIX=/opt -DCMAKE_INSTALL_LIBDIR=lib -Wno-dev -DWITH_GTEST=OFF -DWITH_UNALIGNED=OFF )
          - cmake -B build "${_options[@]}"
          - cmake --build build
          - cmake -B build-compat "${_options[@]}" -DZLIB_COMPAT=ON
          - cmake --build build-compat
          - cmake --install build
          - cmake --install build-compat
          - popd
          - export LD_LIBRARY_PATH=/opt/lib
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/DerDieDas*.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '20.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
            sha256: 04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7
          extra_packages:
            - build-essential
            - cmake
            - ninja-build
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
