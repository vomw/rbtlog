---
repository: https://github.com/wizdom13/WizeStream.git
updates: releases
versions:
  - tag: v0.28.8-m12
    apks:
      - apk_pattern: NewPipeMaterial_.*\.apk
        apk_url: https://github.com/wizdom13/NewPipe_Material/releases/download/v0.28.8-m12/NewPipeMaterial_v0.28.8-m12.apk
        build:
          - ./gradlew assembleRelease --stacktrace -DskipFormatKtlint
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '20.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
            sha256: 04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7
          extra_packages: []
          image: ubuntu:jammy
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
