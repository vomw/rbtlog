---
repository: https://github.com/Myzel394/NumberHub.git
updates: releases
notes:
  - builds use initWith(debug) and thus are signed with debug key. Removing init results in huge differences – removing CERT.* works.
versions:
  - tag: v0.1.3
    apks:
      - apk_pattern: NumberHub\.apk
        apk_url: https://github.com/Myzel394/NumberHub/releases/download/v0.1.3/NumberHub.apk
        build:
          - sed -r '/signingConfigs.getByName/d' -i app/build.gradle.kts
          - echo "storeFile=/dev/null" > key.properties
          - echo "storePassword=pass" >> key.properties
          - echo "keyPassword=pass" >> key.properties
          - echo "keyAlias=alias" >> key.properties
          - chmod +x gradlew
          - ./gradlew assembleFdroidRelease
          - zip -d app/build/outputs/apk/fdroid/release/app-fdroid-release*.apk "META-INF/CERT.*"
          - mv app/build/outputs/apk/fdroid/release/app-fdroid-release*.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - zip
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
  - tag: v0.2.0
    apks:
      - apk_pattern: NumberHub\.apk
        apk_url: https://github.com/Myzel394/NumberHub/releases/download/v0.2.0/NumberHub.apk
