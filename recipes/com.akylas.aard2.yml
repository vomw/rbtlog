---
repository: https://github.com/farfromrefug/OSS-Dict.git
updates: releases
notes:
  - 'FIXME: since v1.0.8, slobj is a submodule, so we can remove the cloning step'
versions:
  - tag: v1.0.7/65
    apks:
      - apk_pattern: OSS-Dict-release\.apk
        apk_url: https://github.com/farfromrefug/OSS-Dict/releases/download/v1.0.7%2F65/OSS-Dict-release.apk
        build:
          - pushd /build
          - git clone -b v1.0.0 https://github.com/farfromrefug/slobj.git
          - popd
          - ./gradlew assembleRelease
          - mv build/outputs/apk/release/repo-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: ubuntu:jammy
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
  - tag: v1.0.8/66
    apks:
      - apk_pattern: OSS-Dict-release\.apk
        apk_url: https://github.com/farfromrefug/OSS-Dict/releases/download/v1.0.8/66/OSS-Dict-release.apk
        build:
          - pushd /build
          - git clone -b v1.0.0 https://github.com/farfromrefug/slobj.git
          - popd
          - ./gradlew assembleRelease
          - mv build/outputs/apk/release/repo-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: ubuntu:jammy
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
