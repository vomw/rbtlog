          - export PATH="${PATH}:/opt/gradle-7.6.4/bin"
          - JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64 gradle assembleEnglishWithAdBlockRelease
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
          - OUT=WebMonkey/build/outputs/apk/englishWithAdBlock/release/WebMonkey-*-english-withAdBlock-release-unsigned.apk
          - reproducible-apk-tools/inplace-fix.py --internal --zipalign fix-newlines $OUT 'res/1C' 'res/2K*' 'res/3B' 'res/HU' 'res/Pr' 'res/oQ' 'res/un*' 'res/*.txt'
          - mv $OUT /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
