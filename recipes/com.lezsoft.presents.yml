---
repository: https://codeberg.org/LezSoft/Presents.git
updates: releases
versions:
  - tag: v3.0.1+23
    apks:
      - apk_pattern: Presents.*arm64-v8a\.apk
        apk_url: https://codeberg.org/LezSoft/Presents/releases/download/v3.0.1+23/Presents_v3.0.1+23_arm64-v8a.apk
        build:
          - sed -r '/signingConfigs.findByName/d' -i android/app/build.gradle.kts
          - FLUTTER_VERSION="$(sed -rn 's/\s*flutter:\s\^?([0-9.]+)\s*$/\1/p' pubspec.yaml)"
          - git clone -b $FLUTTER_VERSION https://github.com/flutter/flutter
          - export PUB_CACHE=$(pwd)/.pub-cache
          - flutter/bin/flutter config --no-analytics
          - flutter/bin/flutter pub get
          - flutter/bin/flutter build apk --release --split-per-abi --target-platform="android-arm64"
          - find . -name '*.apk'
          - mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/lez
        build_repo_dir: /home/lez/Documents/Dev/Presents
        build_timeout:
        build_user: lez
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages:
            - curl
          image: debian:trixie-slim
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
