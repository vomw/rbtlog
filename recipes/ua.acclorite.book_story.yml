---
repository: https://github.com/Acclorite/book-story.git
updates: releases
notes:
  - 'FIXED: v1.1.1 needed soft-reset to embedded commit hash'
versions:
  - tag: v1.1.1
    apks:
      - apk_pattern: book-story\.apk
        apk_url: https://github.com/Acclorite/book-story/releases/download/v1.1.1/book-story.apk
        build:
          - git reset --soft 0e5c4a13e878790300647324fa535b9454875e60
          - sed -r '/signingConfigs.getByName/d' -i app/build.gradle.kts
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - git clone -b v0.2.8 https://github.com/obfusk/reproducible-apk-tools.git
          - OUT=app/build/outputs/apk/release/app-release-unsigned.apk
          - reproducible-apk-tools/inplace-fix.py --internal --page-size 16 fix-newlines "$OUT" 'META-INF/services/*' 'res/M7.json'
          - mv "$OUT" /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
