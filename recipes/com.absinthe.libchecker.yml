---
repository: https://github.com/LibChecker/LibChecker.git
updates: releases
notes:
  - 'FIXNEEDED: upstream inserts build timestamp (we can find the used one via dex diff), see https://github.com/LibChecker/LibChecker/issues/1409#issuecomment-2519779456'
  - FIXME 2.5.1 failed due to differences in M7.json (unpinned dependencies) and versionName not matching (commit hash appended, but lenght differs). Timestamp was removed, so that sed can go with the next release.
versions:
  - tag: 2.5.0
    apks:
      - apk_pattern: LibChecker-.*-foss-release\.apk
        apk_url: https://github.com/LibChecker/LibChecker/releases/download/2.5.0/LibChecker-2.5.0.89b31e95-2159-foss-release.apk
        build:
          - sed -r 's/Instant.now\(\).toString\(\)/"2024-09-04T12:30:42.417658Z"/' -i build-logic/src/main/kotlin/Projects.kt
          - chmod +x gradlew
          - ./gradlew :app:assembleFossRelease
          - mv app/build/outputs/apk/foss/release/LibChecker-*-foss-release.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: ubuntu:jammy
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
