---
repository: https://github.com/The-First-King/Auto-Sleep.git
updates: releases
notes:
  - gradle 5.1.1?
versions:
  - tag: '1.3'
    apks:
      - apk_pattern: auto-sleep.*\.apk
        apk_url: https://github.com/The-First-King/Auto-Sleep/releases/download/1.3/auto-sleep-13.apk
        build:
          - chmod +x gradlew
          - JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64 ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/com.mine.autosleep-release.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages:
            - openjdk-11-jdk-headless
          image: debian:bullseye-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
  - tag: '2.0'
    apks:
      - apk_pattern: auto-sleep.*\.apk
        apk_url: https://github.com/The-First-King/Auto-Sleep/releases/download/2.0/auto-sleep-20.apk
