versions:
  - tag: v0.6.4
    apks:
      - apk_pattern: kelani-sbd-tracker.*\.apk
        apk_url: https://github.com/mburgosfr-star/kelani-sbd-tracker/releases/download/v0.6.4/kelani-sbd-tracker-v0.6.4.apk
        build:
          - wget -q -O /tmp/nodejs-lts.zip -- https://nodejs.org/dist/v24.14.0/node-v24.14.0-linux-x64.tar.xz
          - sha256sum -c <<< '41cd79bb7877c81605a9e68ec4c91547774f46a40c67a17e34d7179ef11729df  /tmp/nodejs-lts.zip'
          - tar xf /tmp/nodejs-lts.zip -C /opt
          - export PATH="${PATH}:/opt/node-v24.14.0-linux-x64/bin:${HOME}/.node/bin"
          - export GRADLE_USER_HOME=/opt/gradle
          - npm install
          - npm run build
          - npx cap sync android
          - cd android
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/app-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '20.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
            sha256: 04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7
          extra_packages:
            - xz-utils
          image: ubuntu:jammy
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
