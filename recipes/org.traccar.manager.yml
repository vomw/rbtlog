---
repository: https://github.com/traccar/traccar-manager-android.git
updates: releases
notes:
  - 'FIXME: gradle wrapper verification fails, see https://github.com/traccar/traccar-manager-android/issues/112 '
versions:
  - tag: v4.2
    apks:
      - apk_pattern: app-regular-release\.apk
        apk_url: https://github.com/traccar/traccar-manager-android/releases/download/v4.2/app-regular-release.apk
        build:
          - chmod +x gradlew
          - ./gradlew assembleRegularRelease
          - mv app/build/outputs/apk/regular/release/app-regular-release-unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
