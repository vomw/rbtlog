---
repository: https://github.com/nktnet1/middor.git
updates: releases
notes:
  - 'FIXME: native library stripping has been disabled for future releases (https://github.com/nktnet1/middor/pull/8), remove ndk then'
versions:
  - tag: v0.1.4
    apks:
      - apk_pattern: middor.*\.apk
        apk_url: https://github.com/nktnet1/middor/releases/download/v0.1.4/middor_v0.1.4.apk
        build:
          - sed -r '/signingConfigs.getByName/d ; /signingConfigs \{/,/^    \}/d' -i app/build.gradle.kts
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk: 29.0.14206865
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
