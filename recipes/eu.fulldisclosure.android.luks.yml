---
repository: https://github.com/full-disclosure/android-luks.git
updates: releases
notes:
  - 'FIXME: built from commit following the tag, where versioning was updated'
versions:
  - tag: v.1.1
    apks:
      - apk_pattern: android_luks_.*\.apk
        apk_url: https://github.com/full-disclosure/android-luks/releases/download/v.1.1/android_luks_v1.1.apk
        build:
          - git checkout 98ae87295b55f8b2db77bb09ea07958a362ffbb6
          - cd android_luks
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
