---
repository: https://codeberg.org/bg443/rbtlui.git
updates: releases
versions:
  - tag: v1.0.0
    apks:
      - apk_pattern: rbtlui-universal-release\.apk
        apk_url: https://codeberg.org/bg443/rbtlui/releases/download/v1.0.0/rbtlui-universal-release.apk
        build:
          - PROF_FILE=composeApp/build/intermediates/binary_art_profile/release/compileReleaseArtProfile/baseline.prof
          - PROF_SHA1=e945ccfdc59d8f85f4c1aa1a0250493d291226f4
          - for _ in {1..10}; do
          - ./gradlew clean assembleRelease --no-build-cache --no-configuration-cache --no-daemon
          - if [ "$( sha1sum "$PROF_FILE" | cut -d' ' -f1 )" = "$PROF_SHA1" ]; then
          - break
          - fi
          - done
          - mv composeApp/build/outputs/apk/release/composeApp-universal-release-unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
