---
repository: https://github.com/shiftrot/caps2ctrl.git
updates: disabled
notes:
  - disabled updates 2025-10-07 as repo and account disappeared
versions:
  - tag: v1.8
    apks:
      - apk_pattern: jpkcm-tcen-release\.apk
        apk_url: https://github.com/shiftrot/caps2ctrl/releases/download/v1.8/jpkcm-tcen-release.apk
        build:
          - chmod +x gradlew
          - ./gradlew assembleTcenRelease
          - git clone -b v0.2.7 https://github.com/obfusk/reproducible-apk-tools.git
          - OUT=jpkcm/build/outputs/apk/tcen/release/jpkcm-tcen-release-unsigned.apk
          - reproducible-apk-tools/inplace-fix.py --internal --page-size 16 fix-newlines "$OUT" 'META-INF/services/*'
          - mv "$OUT" /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
