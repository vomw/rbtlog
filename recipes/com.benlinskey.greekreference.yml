---
repository: https://github.com/blinskey/greek-reference.git
updates: releases
notes:
  - 'TODO: JARs & ZIPs: ./db-creator/bin/sqlite-jdbc-3.7.2.jar / ./db-creator/lib/sqlite-jdbc-3.7.2.jar / ./db-creator/lib/transcoder-1.2-SNAPSHOT.jar (all in sub-module, linked repo archived)'
versions:
  - tag: v1.13.0
    apks:
      - apk_pattern: GreekReference.*release.*\.apk
        apk_url: https://github.com/blinskey/greek-reference/releases/download/v1.13.0/GreekReference-release-v1.13.0.apk
        build:
          - ./gradlew assembleRelease
          - mv GreekReference/build/outputs/apk/release/GreekReference-release-unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
  - tag: v1.14.0
    apks:
