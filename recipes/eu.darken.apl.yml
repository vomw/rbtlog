---
repository: https://github.com/d4rken/airplanes-live-app.git
updates: releases
versions:
  - tag: v0.2.1-rc0
    apks:
      - apk_pattern: eu.darken.apl.*FOSS-RELEASE\.apk
        apk_url: https://github.com/d4rken/airplanes-live-app/releases/download/v0.2.1-rc0/eu.darken.apl-v0.2.1-rc0-201000-FOSS-RELEASE.apk
        build:
          - sed -r '/signingConfigs\[/d' -i app/build.gradle.kts
          - ./gradlew assembleFossRelease
          - mv app/build/outputs/apk/foss/release/eu.darken.apl-*-FOSS-RELEASE.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
