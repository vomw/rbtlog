---
repository: https://github.com/pedrolcl/vmpk-android.git
updates: releases
versions:
  - tag: v1.5.1
    apks:
      - apk_pattern: io.github.pedrolcl.vmpk.*release\.apk
        apk_url: https://github.com/pedrolcl/vmpk-android/releases/download/v1.5.1/io.github.pedrolcl.vmpk-v1.5.1-release.apk
        build:
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages:
            - make
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
