---
repository: https://github.com/barbeau/gpstest.git
updates: releases
versions:
  - tag: v3.10.5
    apks:
      - apk_pattern: osmdroidRelease.*\.apk
        apk_url: https://github.com/barbeau/gpstest/releases/download/v3.10.5/osmdroidRelease-v3.10.5.apk
        build:
          - sed -r '/signingConfigs.release/d' -i GPSTest/build.gradle
          - chmod +x gradlew
          - ./gradlew assembleOsmdroidRelease
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
          - OUT="GPSTest/build/outputs/apk/osmdroid/release/osmdroidRelease*.apk"
          - reproducible-apk-tools/inplace-fix.py --internal --zipalign fix-newlines $OUT 'META-INF/services/*'
          - mv $OUT /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
