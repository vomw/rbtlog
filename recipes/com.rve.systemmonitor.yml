---
repository: https://github.com/Rve27/RvSystem-Monitor.git
updates: releases
versions:
  - tag: 0.7.1-alpha
    apks:
      - apk_pattern: app-fdroid-release\.apk
        apk_url: https://github.com/Rve27/RvSystem-Monitor/releases/download/0.7.1-alpha/app-fdroid-release.apk
        build:
          - git reset --soft 05e982b8bfeac18b7dc7a74613d14df62ae751ec
          - RUST_VERSION=$(sed -n 's/channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          - git clone https://github.com/rust-lang/rustup.git -b 1.29.0
          - export ANDROID_NDK_HOME=/opt/sdk/ndk/${PROVISIONING_NDK}
          - ${BUILD_REPO_DIR}/rustup/rustup-init.sh -y --default-toolchain $RUST_VERSION --target aarch64-linux-android --target armv7-linux-androideabi
          - source $HOME/.cargo/env
          - cargo install cargo-ndk
          - ./gradlew assembleFdroidRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/fdroid/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/Rve
        build_repo_dir: /home/Rve/RvSystem-Monitor
        build_timeout:
        build_user: Rve
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '20.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
            sha256: 04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7
          extra_packages:
            - build-essential
          image: debian:trixie-slim
          jdk: openjdk-21-jdk-headless
          ndk: 30.0.14904198
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
  - tag: 0.8-beta
    apks:
      - apk_pattern: app-fdroid-release\.apk
        apk_url: https://github.com/Rve27/RvSystem-Monitor/releases/download/0.8-beta/app-fdroid-release.apk
