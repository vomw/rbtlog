          - ${BUILD_REPO_DIR}/rustup/rustup-init.sh -y --default-toolchain $RUST_VERSION --target aarch64-linux-android --target armv7-linux-androideabi
          - source $HOME/.cargo/env
          - cargo install cargo-ndk
          - ./gradlew assembleFdroidRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/fdroid/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/Rve
        build_repo_dir: /home/Rve/RvSystem-Monitor
        build_timeout:
        build_user: Rve
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '20.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
            sha256: 04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7
