---
repository: https://github.com/stevep99/keyboard-layout-companion.git
updates: releases
notes:
  - 'build crashes with "R8:\ java.lang.OutOfMemoryError: Java heap space", so we add -Dorg.gradle.jvmargs=-Xmx2048m to give it more space'
  - upstream uses gradle with unknown hash, so we better pull our own
  - some of the keyboard layout definitions use DOS line-breaks, others Unix line-breaks
  - 'FIXME change gradle options to -Xmx3g -Dkotlin.daemon.jvm.options=-Xmx2g'
versions:
  - tag: '1.08'
    apks:
      - apk_pattern: companion-.*-release\.apk
        apk_url: https://github.com/stevep99/keyboard-layout-companion/releases/download/1.08/companion-1.08-release.apk
        build:
          - sed -r '/signingConfigs.release/d' -i app/build.gradle
          - echo "storeFile=/dev/null" > keystore.properties
          - echo "storePassword=pass" >> keystore.properties
          - echo "keyAlias=alias" >> keystore.properties
          - echo "keyPassword=pass" >> keystore.properties
          - GRADLE_VER="$(sed -rn 's/distributionUrl.*gradle-([0-9.]+).*\.zip/\1/p' gradle/wrapper/gradle-wrapper.properties)"
          - git clone https://github.com/obfusk/gradlew.py.git
          - gradlew.py/gradlew.py --version $GRADLE_VER -v assembleRelease -Dorg.gradle.jvmargs=-Xmx2048m
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
          - OUT=app/build/outputs/apk/release/companion-*-release-unsigned.apk
          - reproducible-apk-tools/inplace-fix.py --internal --page-size 4 fix-newlines $OUT 'assets/layout/asset.keyb' 'assets/layout/colemak.keyb' 'assets/layout/dvorak.keyb' 'assets/layout/minimak8.keyb' 'assets/layout/mtgap.keyb' 'assets/layout/norman.keyb' 'assets/layout/qgmlwyfub.keyb' 'assets/layout/qwerty.keyb' 'assets/layout/qwpr.keyb' 'assets/layout/workman.keyb'
          - mv $OUT /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
  - tag: '1.10'
    apks:
      - apk_pattern: companion-.*-release\.apk
        apk_url: https://github.com/stevep99/keyboard-layout-companion/releases/download/1.10/companion-1.10-release.apk
        build:
          - git reset --soft ab8c060d89cbed9409904de61f81c7cd5370e614
          - sed -r '/signingConfigs.release/d' -i app/build.gradle
          - echo "storeFile=/dev/null" > keystore.properties
          - echo "storePassword=pass" >> keystore.properties
          - echo "keyAlias=alias" >> keystore.properties
          - echo "keyPassword=pass" >> keystore.properties
          - GRADLE_VER="$(sed -rn 's/distributionUrl.*gradle-([0-9.]+).*\.zip/\1/p' gradle/wrapper/gradle-wrapper.properties)"
          - git clone https://github.com/obfusk/gradlew.py.git
          - gradlew.py/gradlew.py --version $GRADLE_VER -v assembleRelease -Dorg.gradle.jvmargs=-Xmx2048m
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
          - OUT=app/build/outputs/apk/release/companion-*-release-unsigned.apk
          - reproducible-apk-tools/inplace-fix.py --internal --page-size 4 fix-newlines $OUT 'assets/layout/asset.keyb' 'assets/layout/colemak.keyb' 'assets/layout/dvorak.keyb' 'assets/layout/minimak8.keyb' 'assets/layout/mtgap.keyb' 'assets/layout/norman.keyb' 'assets/layout/qgmlwyfub.keyb' 'assets/layout/qwerty.keyb' 'assets/layout/qwpr.keyb' 'assets/layout/workman.keyb'
          - mv $OUT /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
