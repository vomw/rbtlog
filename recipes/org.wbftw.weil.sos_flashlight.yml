---
repository: https://github.com/WeilJimmer/SOSFlashlightApp.git
updates: releases
versions:
  - tag: v1.0.1
    apks:
      - apk_pattern: org.wbftw.weil.sos_flashlight_release.*\.apk
        apk_url: https://github.com/WeilJimmer/SOSFlashlightApp/releases/download/v1.0.1/org.wbftw.weil.sos_flashlight_release_1.0.1.apk
        build:
          - git clone https://codeberg.org/IzzyOnDroid/gradlew.py.git
          - gradlew.py/gradlew.py -v assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/org.wbftw.weil.sos_flashlight_release*.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
