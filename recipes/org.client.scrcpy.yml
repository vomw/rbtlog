---
repository: https://github.com/zwc456baby/ScrcpyForAndroid.git
updates: releases
versions:
  - tag: v1.4.1
    apks:
      - apk_pattern: scrcpy.*\.apk
        apk_url: https://github.com/zwc456baby/ScrcpyForAndroid/releases/download/v1.4.1/scrcpy-scrcpy-release.apk
        build:
          - ./gradlew assembleScrcpyRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/scrcpy/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '20.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
            sha256: 04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
  - tag: v1.5.1
    apks:
      - apk_pattern: scrcpy.*\.apk
        apk_url: https://github.com/zwc456baby/ScrcpyForAndroid/releases/download/v1.5.1/scrcpy-26-07-29.apk
        build:
          - ./gradlew assembleScrcpyRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/scrcpy/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '22.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
            sha256: 4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
