---
repository: https://github.com/adeekshith/watomatic.git
updates: releases
versions:
  - tag: v1.29
    apks:
      - apk_pattern: Watomatic-.*\.apk
        apk_url: https://github.com/adeekshith/watomatic/releases/download/v1.29/Watomatic-1_29.apk
        build:
          - chmod +x gradlew
          - ./gradlew assembleDefaultRelease
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
          - OUT=app/build/outputs/apk/Default/release/app-Default-release-unsigned.apk
          - reproducible-apk-tools/inplace-fix.py --internal --page-size 4 fix-newlines "$OUT" 'META-INF/services/*'
          - mv "$OUT" /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
