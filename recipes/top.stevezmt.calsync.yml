  - tag: v0.1.7
    apks:
      - apk_pattern: calsync.*foss-arm64-v8a\.apk
        apk_url: https://github.com/SteveZMTstudios/calsync/releases/download/v0.1.7/calsync-0.1.7-foss-arm64-v8a.apk
        build:
          - export GRADLE_OPTS="-Xmx3g"
          - chmod +x gradlew
          - ./gradlew assembleFossRelease -PabiFilter=arm64-v8a
          - find . -name '*.apk'
          - mv app/build/outputs/apk/foss/release/*foss-arm64-v8a*.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/runner
        build_repo_dir: /home/runner/work/calsync/calsync
        build_timeout:
        build_user: build
        provisioning:
