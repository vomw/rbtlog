---
repository: https://github.com/boxlabss/HexDroid.git
updates: releases
versions:
  - tag: v1.5.3
    apks:
      - apk_pattern: app-release\.apk
        apk_url: https://github.com/boxlabss/HexDroid/releases/download/v1.5.3/app-release.apk
        build:
          - chmod +x gradlew
          - ./gradlew :app:assembleRelease --no-daemon --no-build-cache
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/app-release.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '20.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
            sha256: 04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
