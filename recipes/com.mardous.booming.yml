---
repository: https://github.com/mardous/BoomingMusic.git
updates: releases
versions:
  - tag: v1.0.2
    apks:
      - apk_pattern: BoomingMusic.*fdroid-release\.apk
        apk_url: https://github.com/mardous/BoomingMusic/releases/download/v1.0.2/BoomingMusic-1.0.2-fdroid-release.apk
        build:
          - sed -r '/signingConfigs.releaseSigning/d' -i app/build.gradle.kts
          - chmod +x gradlew
          - ./gradlew assembleFdroidRelease
          - mv app/build/outputs/apk/fdroid/release/BoomingMusic-*-fdroid-release.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: ubuntu:jammy
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
