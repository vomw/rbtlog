---
repository: https://github.com/sidhant947/Path.git
updates: releases
versions:
  - tag: V1.0.0
    apks:
      - apk_pattern: app-arm64-v8a-release\.apk
        apk_url: https://github.com/sidhant947/Path/releases/download/V1.0.0/app-arm64-v8a-release.apk
        build:
          - base64 -d > yaml2json <<< IyEvdXNyL2Jpbi9lbnYgcHl0aG9uMwppbXBvcnQganNvbgppbXBvcnQgc3lzCmZyb20gcnVhbWVsLnlhbWwgaW1wb3J0IFlBTUwKanNvbi5kdW1wKFlBTUwodHlwPSJzYWZlIikubG9hZChzeXMuc3RkaW4pLCBzeXMuc3Rkb3V0LCBpbmRlbnQ9MikKcHJpbnQoKQo=
          - chmod +x yaml2json
          - FLUTTER_VERSION="$(./yaml2json < .github/workflows/release.yml | jq -r '.on.workflow_dispatch.inputs.flutter_version.default')"
          - sed -r '/signingConfigs.getByName/d ; /signingConfigs \{/,/^    \}/d' -i android/app/build.gradle.kts
          - git clone -b $FLUTTER_VERSION https://github.com/flutter/flutter
          - export PUB_CACHE=$(pwd)/.pub-cache
          - flutter/bin/flutter config --no-analytics
          - flutter/bin/flutter pub get
          - flutter/bin/flutter build apk --release --split-per-abi --target-platform="android-arm64"
          - find . -name '*.apk'
          - mv build/app/outputs/apk/release/app-arm64-v8a-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/runner
        build_repo_dir: /home/runner/work/Path/Path
        build_timeout:
        build_user: runner
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages:
            - curl
            - python3
            - python3-ruamel.yaml
            - jq
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
