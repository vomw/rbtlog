---
repository: https://github.com/Tommy-Geenexus/exif-eraser.git
updates: releases
notes:
  - 'FIXED: up to v6.1.0 we needed to adjust commit as FOSS build comes from different branch'
  - v6.2.0 needed some adjustments, see https://github.com/Tommy-Geenexus/exif-eraser/issues/86
versions:
  - tag: v6.1.0
    apks:
      - apk_pattern: app-release\.apk
        apk_url: https://github.com/Tommy-Geenexus/exif-eraser/releases/download/v6.1.0/app-foss-release.apk
        build:
          - git checkout a5efe25ed6cf32a6b0f5933177c79bf5b75a8c1b
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
  - tag: v6.2.0
    apks:
      - apk_pattern: app-release\.apk
        apk_url: https://github.com/Tommy-Geenexus/exif-eraser/releases/download/v6.2.0/app-release.apk
        build:
          - sed -r '/signingConfigs.getByName/d' -i app/build.gradle.kts
          - chmod +x gradlew
          - ./gradlew --dependency-verification lenient assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
