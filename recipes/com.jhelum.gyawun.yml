---
repository: https://github.com/jhelumcorp/gyawun.git
updates: disabled
notes:
  - asked upstream for adding Flutter version to their pubspec.yaml etc, see https://github.com/sheikhhaziq/gyawun/issues/242
  - Flutter version will be in .fvmrc starting with the release following 2.0.15
  - build for v2.0.16 fails entirely, see https://github.com/sheikhhaziq/gyawun_music/issues/242#issuecomment-3782027992
  - 'FIXME: remove sed for pubspec.yaml with next release'
  - all updates disabled for now, as dev does not respond (neither to the NonFreeComp introduced with v2.0.18)
versions:
  - tag: 2.0.15
    apks:
      - apk_pattern: app-arm64-v8a-release\.apk
        apk_url: https://github.com/sheikhhaziq/gyawun/releases/download/2.0.15/app-arm64-v8a-release.apk
        build:
          - git checkout 6f1ca2037f2bbf96bac9b3468e4267fbe890257d
          - sed -r '/signingConfigs.(debug|release)/d ; /signingConfigs \{/,/^   \}/d' -i android/app/build.gradle
          - FLUTTER_VERSION="3.35.6"
          - git clone -b $FLUTTER_VERSION https://github.com/flutter/flutter
          - export PUB_CACHE=$(pwd)/.pub-cache
          - flutter/bin/flutter config --no-analytics
          - flutter/bin/flutter pub get
          - flutter/bin/flutter build apk --release --split-per-abi --target-platform android-arm64
          - find . -name '*.apk'
          - mv build/app/outputs/apk/release/app-arm64-v8a-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/sheikhhaziq
        build_repo_dir: /home/sheikhhaziq/Work/gyawun
        build_timeout: 30
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages:
            - curl
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
  - tag: v2.0.16
    apks:
      - apk_pattern: gyawun.*arm64-v8a\.apk
        apk_url: https://github.com/sheikhhaziq/gyawun_music/releases/download/v2.0.16/gyawun-v2.0.16-arm64-v8a.apk
        build:
          - sed -r '/signingConfigs.(debug|release)/d ; /signingConfigs \{/,/^    \}/d' -i android/app/build.gradle
          - FLUTTER_VERSION="$(sed -rn 's/.*"flutter":\ "(.+)"/\1/p' .fvmrc)"
          - git clone -b $FLUTTER_VERSION https://github.com/flutter/flutter
          - export PUB_CACHE=$(pwd)/.pub-cache
          - flutter/bin/flutter config --no-analytics
          - flutter/bin/flutter pub get
          - flutter/bin/flutter build apk --release --split-per-abi --target-platform android-arm64 --flavor production
          - find . -name '*.apk'
          - mv build/app/outputs/apk/production/release/app-production-arm64-v8a-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/sheikhhaziq
        build_repo_dir: /home/sheikhhaziq/Work/gyawun
        build_timeout: 30
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages:
            - curl
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
  - tag: v2.0.17
    apks:
      - apk_pattern: gyawun.*arm64-v8a\.apk
        apk_url: https://github.com/sheikhhaziq/gyawun_music/releases/download/v2.0.17/gyawun-v2.0.17-arm64-v8a.apk
        build:
          - sed -r '/signingConfigs.getByName/d ; /signingConfigs \{/,/^    \}/d' -i android/app/build.gradle.kts
          - sed -r 's/2.0.17\+0/2.0.17+115/' -i pubspec.yaml
          - FLUTTER_VERSION="$(sed -rn 's/.*"flutter":\ "(.+)"/\1/p' .fvmrc)"
          - git clone -b $FLUTTER_VERSION https://github.com/flutter/flutter
          - export PUB_CACHE=$(pwd)/.pub-cache
          - flutter/bin/flutter config --no-analytics
          - flutter/bin/flutter pub get
          - flutter/bin/flutter build apk --release --split-per-abi --target-platform android-arm64 --flavor production
          - find . -name '*.apk'
          - mv build/app/outputs/apk/production/release/app-production-arm64-v8a-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/runner
        build_repo_dir: /home/runner/work/gyawun_music/gyawun_music
        build_timeout: 30
        build_user: runner
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages:
            - curl
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
