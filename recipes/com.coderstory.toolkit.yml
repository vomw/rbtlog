---
repository: https://github.com/LSPosed/CorePatch.git
updates: disabled
notes:
  - package name changed to org.lsposed.corepatch, see https://github.com/LSPosed/CorePatch/issues/155
versions:
  - tag: '4.5'
    apks:
      - apk_pattern: core-patch-.*\.apk
        apk_url: https://github.com/LSPosed/CorePatch/releases/download/4.5/core-patch-4.5.apk
        build:
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/app-release.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
