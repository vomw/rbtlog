---
repository: https://github.com/vbresan/Image_Converter.git
updates: releases
versions:
  - tag: '8'
    apks:
      - apk_pattern: biz.binarysolutions.imageconverter.*free-release\.apk
        apk_url: https://github.com/vbresan/Image_Converter/releases/download/8/biz.binarysolutions.imageconverter-1.0.6-free-release.apk
        build:
          - git clone https://codeberg.org/IzzyOnDroid/gradlew.py
          - gradlew.py/gradlew.py -v assembleFreeRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/free/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
