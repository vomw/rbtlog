---
repository: https://github.com/sweakpl/qralarm-android.git
updates: releases
versions:
  - tag: 2.11.4
    apks:
      - apk_pattern: qralarm-.*\.apk
        apk_url: https://github.com/sweakpl/qralarm-android/releases/download/2.11.4/qralarm-2.11.4.apk
        build:
          - rm -rf .git
          - touch .git
          - sed -ri '/org.gradle.toolchains.foojay-resolver-convention/d' settings.gradle.kts
          - sed -ri '/foojay/d ; /toolchainVendor/d' gradle/gradle-daemon-jvm.properties
          - sed -ri '/signingConfigs.getBy/d ; /signingConfigs \{/,/^    \}/d' app/build.gradle.kts
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - OUT=app/build/outputs/apk/release/app-release-unsigned.apk
          - reproducible-apk-tools/inplace-fix.py --internal --page-size 16 fix-newlines "$OUT" 'res/rF.xml'
          - mv "$OUT" /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        modules:
          - name: repro-apk
            commit: b1a0f2c58acd070f7d9afaa2c948ef99a272cc47
            version: v0.3.2
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '22.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
            sha256: 4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583
          extra_packages:
            - python3
          image: ubuntu:noble
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
