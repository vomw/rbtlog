---
repository: https://github.com/MaintainTeam/Hypatia.git
updates: releases
notes:
  - unclear what commit this was built from, but next release should come from CI; see https://github.com/MaintainTeam/Hypatia/issues/9
versions:
  - tag: v3.14
    apks:
      - apk_pattern: hypatia_.*\.apk
        apk_url: https://github.com/MaintainTeam/Hypatia/releases/download/$$TAG$$/hypatia_$$TAG$$.apk
        build:
          - git checkout f126aeeefe0eb574c8fadbf8976c36673c24ac59
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
  - tag: v3.15
    apks:
      - apk_pattern: hypatia_.*\.apk
        apk_url: https://github.com/MaintainTeam/Hypatia/releases/download/$$TAG$$/hypatia_$$TAG$$.apk
        build:
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
