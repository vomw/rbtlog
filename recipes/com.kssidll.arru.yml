---
repository: https://github.com/KSSidll/Arru.git
updates: releases
notes:
  - v2.4.8 failed RB, see https://github.com/KSSidll/Arru/issues/6#issuecomment-2286854953
versions:
  - tag: v2.4.6
    apks:
      - apk_pattern: Arru-.*\.apk
        apk_url: https://github.com/KSSidll/Arru/releases/download/v2.4.6/Arru-2.4.6.apk
        build:
          - sed -r '/signingConfigs.getByName/d' -i app/build.gradle.kts
          - chmod +x gradlew
          - echo "storeFilePath=/dev/null" > signing.properties
          - echo "storePassword=storePassword" >> signing.properties
          - echo "keyPassword=keyPassword" >> signing.properties
          - echo "keyAlias=keyAlias" >> signing.properties
          - ./gradlew assembleRelease
          - git clone -b v0.2.8 https://github.com/obfusk/reproducible-apk-tools.git
          - OUT=app/build/outputs/apk/release/app-release-unsigned.apk
          - reproducible-apk-tools/inplace-fix.py --internal --page-size 16 fix-newlines "$OUT" 'META-INF/services/*'
          - mv "$OUT" /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
