---
repository: https://github.com/juandjara/wafrn-rn.git
updates: releases
notes:
  - "sed -r '/signingConfigs.(debug|release)/d' -i android/app/build.gradle # unfortunately does not work out, versionCode then isn't handled correctly"
labels:
  - expo
versions:
  - tag: v1.4.8
    apks:
      - apk_pattern: app-arm64-v8a-foss\.apk
        apk_url: https://github.com/juandjara/wafrn-rn/releases/download/v1.4.8/app-arm64-v8a-foss.apk
        build:
          - sed -r '/signingConfigs.(debug|release)/d' -i android/app/build.gradle
          - wget -q -O /tmp/nodejs-lts.zip -- https://nodejs.org/dist/v22.14.0/node-v22.14.0-linux-x64.tar.xz
          - sha256sum -c <<< '69b09dba5c8dcb05c4e4273a4340db1005abeafe3927efda2bc5b249e80437ec  /tmp/nodejs-lts.zip'
          - tar xf /tmp/nodejs-lts.zip -C /opt
          - export PATH="${PATH}:/opt/node-v22.14.0-linux-x64/bin:${HOME}/.node/bin"
          - export UNSIGNED_APK=1
          - export NODE_OPTIONS="--openssl-legacy-provider --max_old_space_size=4096"
          - npm config set prefix "${HOME}/.node"
          - npm install
          - npm ci && npm rebuild lightningcss
          - bash ./scripts/android_build.sh prod-foss
          - find . -name '*.apk'
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
          - reproducible-apk-tools/zipalign.py --page-align --pad-like-apksigner --replace android/app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/runner
        build_repo_dir: /home/runner/work/wafrn-rn/wafrn-rn
        build_timeout: 30
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - xz-utils
            - python3
          image: ubuntu:jammy
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
