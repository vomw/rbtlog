---
repository: https://github.com/mona-hrt/mona.git
updates: releases
versions:
  - tag: v1.10.0
    apks:
      - apk_pattern: mona-store-arm64-v8a\.apk
        apk_url: https://github.com/mona-hrt/mona/releases/download/v1.10.0/mona-store-arm64-v8a.apk
        build:
          - FLUTTER_VERSION="$(jq -r '.flutter' .fvmrc)"
          - git clone -b $FLUTTER_VERSION https://github.com/flutter/flutter
          - export PUB_CACHE=$(pwd)/.pub-cache NO_SIGNING=true
          - flutter/bin/flutter config --no-analytics
          - flutter/bin/flutter pub get
          - flutter/bin/flutter build apk --release --split-per-abi --flavor store
          - find . -name '*.apk'
          - mv build/app/outputs/apk/store/release/app-store-arm64-v8a-release.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/runner
        build_repo_dir: /home/runner/work/mona/mona
        build_timeout:
        build_user: runner
        provisioning:
          android_home: /usr/local/lib/android/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '20.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
            sha256: 04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7
          extra_packages:
            - curl
            - jq
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
  - tag: v1.10.1
    apks:
      - apk_pattern: mona-store-arm64-v8a\.apk
        apk_url: https://github.com/mona-hrt/mona/releases/download/v1.10.1/mona-store-arm64-v8a.apk
        build:
          - FLUTTER_VERSION="$(jq -r '.flutter' .fvmrc)"
          - git clone -b $FLUTTER_VERSION https://github.com/flutter/flutter
          - export PUB_CACHE=$(pwd)/.pub-cache NO_SIGNING=true
          - flutter/bin/flutter config --no-analytics
          - flutter/bin/flutter pub get
          - flutter/bin/flutter build apk --release --split-per-abi --flavor store
          - find . -name '*.apk'
          - mv build/app/outputs/apk/store/release/app-store-arm64-v8a-release.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/runner
        build_repo_dir: /home/runner/work/mona/mona
        build_timeout: 30
        build_user: runner
        provisioning:
          android_home: /usr/local/lib/android/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '20.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
            sha256: 04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7
          extra_packages:
            - curl
            - jq
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
