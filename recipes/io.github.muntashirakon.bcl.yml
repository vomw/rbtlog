---
repository: https://github.com/MuntashirAkon/BatteryChargeLimiter.git
updates: releases
notes:
  - 'FIXED: embedded commit hash mismatch for v1.1.0-bcl'
versions:
  - tag: v1.1.0-bcl
    apks:
      - apk_pattern: BCL_.*\.apk
        apk_url: https://github.com/MuntashirAkon/BatteryChargeLimiter/releases/download/v1.1.0-bcl/BCL_v1.1.0.apk
        build:
          - git reset --soft 932fedb2b41b6b112d32e73f552e8f8a72580595
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
