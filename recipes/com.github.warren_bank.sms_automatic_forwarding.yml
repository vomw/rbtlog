---
repository: https://github.com/warren-bank/Android-SMS-Automatic-Forwarding.git
updates: releases
versions:
  - tag: v2.3.1
    apks:
      - apk_pattern: SMS-Forwarding.*withAllLanguageTranslations-withContactName-release\.apk
        apk_url: https://github.com/warren-bank/Android-SMS-Automatic-Forwarding/releases/download/v2.3.1/SMS-Forwarding-002.03.01-11API-withAllLanguageTranslations-withContactName-release.apk
        build:
          - cd android-studio-project
          - chmod +x gradlew
          - ./gradlew assembleWithAllLanguageTranslationsWithContactNameRelease
          - find . -name '*.apk'
          - mv SMS-Forwarding/build/outputs/apk/withAllLanguageTranslationsWithContactName/release/SMS-Forwarding-*-withAllLanguageTranslations-withContactName-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
