---
repository: https://github.com/afaneca/myfin-android.git
updates: releases
versions:
  - tag: 2.2.0
    apks:
      - apk_pattern: app-prod-release\.apk
        apk_url: https://github.com/afaneca/myfin-android/releases/download/2.2.0/app-prod-release.apk
        build:
          - cd android
          - echo "keyAlias=alias" > keystore.properties
          - echo "keyPassword=pass" >> keystore.properties
          - echo "storeFile=/dev/null" >> keystore.properties
          - echo "storePassword=pass" >> keystore.properties
          - sed -r '/signingConfigs.release/d' -i app/build.gradle
          - chmod +x gradlew
          - ./gradlew assembleProdRelease
          - git clone -b v0.2.7 https://github.com/obfusk/reproducible-apk-tools.git
          - OUT=app/build/outputs/apk/prod/release/app-prod-release-unsigned.apk
          - reproducible-apk-tools/inplace-fix.py --internal --page-size 4 fix-newlines "$OUT" 'META-INF/services/*'
          - mv "$OUT" /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
