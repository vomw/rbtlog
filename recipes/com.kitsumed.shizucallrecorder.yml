---
repository: https://github.com/kitsumed/ShizuCallRecorder.git
updates: releases
versions:
  - tag: v1.2.0
    apks:
      - apk_pattern: ShizuCallRecorder-.*\.apk
        apk_url: https://github.com/kitsumed/ShizuCallRecorder/releases/download/v1.2.0/ShizuCallRecorder-1.2.0.apk
        build:
          - export SKIP_SIGNING=true
          - git clone https://codeberg.org/IzzyOnDroid/gradlew.py
          - gradlew.py/gradlew.py -v assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '22.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
            sha256: 4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
