---
repository: https://github.com/Trase1/SimplestNotes-app.git
updates: releases
versions:
  - tag: v1.0.3
    apks:
      - apk_pattern: (S|s)implest[Nn]otes.*release\.apk
        apk_url: https://github.com/Trase1/SimplestNotes-app/releases/download/v1.0.3/simplestNotes_v1.0.3_release.apk
        build:
          - git reset --soft caef17ec6150061c067418bd205ada01b6f9c60a
          - sed -r '/signingConfigs.getByName/d ; /create\("release"\) \{/,/^        \}/d' -i app/build.gradle.kts
          - echo "android.useAndroidX=true" >> gradle.properties
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
          - OUT=app/build/outputs/apk/release/simplestNotes_*_release.apk
          - reproducible-apk-tools/inplace-fix.py --internal --zipalign fix-newlines $OUT 'META-INF/services/*'
          - mv $OUT /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
