---
repository: https://github.com/zacharee/LockscreenWidgets.git
updates: releases
notes:
  - https://github.com/zacharee/LockscreenWidgets/issues/75 (RB now, waiting for release)
versions:
  - tag: 3.0.0-alpha01
    apks:
      - apk_pattern: LockscreenWidgets.*\.apk
        apk_url: https://github.com/zacharee/LockscreenWidgets/releases/download/3.0.0-alpha01/LockscreenWidgets_3.0.0-alpha01-release.apk
        build:
          - mkdir -p ${ANDROID_HOME}/platforms/android-36
          - wget https://github.com/Reginer/aosp-android-jar/raw/refs/heads/main/android-36/android.jar -qO "${ANDROID_HOME}"/platforms/android-36/android.jar
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
          - reproducible-apk-tools/zipalign.py --page-size 16 --pad-like-apksigner --replace app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/runner
        build_repo_dir: /home/runner/work/LockscreenWidgets/LockscreenWidgets
        build_timeout:
        build_user: build
        provisioning:
          android_home: /usr/local/lib/android/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages:
            - python3
          image: debian:trixie-slim
          jdk: openjdk-21-jdk-headless
          ndk:
          platform: android-36
          platform_tools:
          tools:
          verify_gradle_wrapper: true
