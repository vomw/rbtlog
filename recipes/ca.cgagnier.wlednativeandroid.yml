---
repository: https://github.com/Moustachauve/WLED-Native-Android.git
updates: releases
notes:
  - sometimes flaky (1 out of 4 builds)
versions:
  - tag: v5.0.0
    apks:
      - apk_pattern: wled-native-.*\.apk
        apk_url: https://github.com/Moustachauve/WLED-Native-Android/releases/download/v5.0.0/wled-native-5.0.0.apk
        build:
          - chmod +x gradlew
          - PROF_FILE=app/build/intermediates/binary_art_profile/release/compileReleaseArtProfile/baseline.prof
          - PROF_SHA1=a32d411fc089923717c62c9e8e0b6d22011537ae
          - for _ in {1..10}; do
          - ./gradlew clean assembleRelease --no-build-cache --no-configuration-cache --no-daemon
          - test -f "$PROF_FILE"
          - if [ "$( sha1sum "$PROF_FILE" | cut -d' ' -f1 )" = "$PROF_SHA1" ]; then
          - break
          - fi
          - done
          - OUT=app/build/outputs/apk/release/app-release-unsigned.apk
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
          - reproducible-apk-tools/inplace-fix.py --internal --page-size 16 --zipalign fix-newlines "$OUT" 'META-INF/services/*'
          - mv "$OUT" /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
