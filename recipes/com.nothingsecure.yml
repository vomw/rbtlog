---
repository: https://github.com/cuadratico/NothingK.git
updates: releases
versions:
  - tag: V0.0.4
    apks:
      - apk_pattern: NothingK\.apk
        apk_url: https://github.com/cuadratico/NothingK/releases/download/V0.0.4/NothingK.apk
        build:
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
  - tag: V0.0.5
    apks:
      - apk_pattern: NothingK\.apk
        apk_url: https://github.com/cuadratico/NothingK/releases/download/V0.0.5/NothingK.apk
        build:
          - git checkout ac6cb48e6f32b8b83218dd698f38e35a45c4ac88
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
          - OUT=app/build/outputs/apk/release/*unsigned.apk
          - reproducible-apk-tools/inplace-fix.py --internal --zipalign fix-files $OUT 'sed s/ac6cb48e6f32b8b83218dd698f38e35a45c4ac88/cd104fcdde0dbaf564129316cd3d64ad49c0f4c4/' 'META-INF/version-control-info.textproto'
          - mv $OUT /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
