---
repository: https://github.com/Giuig/auraninja.git
updates: releases
versions:
  - tag: 1.5.10
    apks:
      - apk_pattern: auraninja-.*-arm64-v8a\.apk
        apk_url: https://github.com/Giuig/auraninja/releases/download/1.5.10/auraninja-1.5.10-arm64-v8a.apk
        build:
          - FLUTTER_VERSION="(cat .flutter-version)"
          - FLUTTER_VERSION="3.41.5"
          - git clone -b $FLUTTER_VERSION https://github.com/flutter/flutter
          - export PUB_CACHE=$(pwd)/.pub-cache
          - flutter/bin/flutter config --no-analytics
          - flutter/bin/flutter pub get
          - flutter/bin/flutter build apk --release --split-per-abi --no-tree-shake-icons --split-debug-info=build/debug-info --target-platform="android-arm64"
          - find . -name '*.apk'
          - mv build/app/outputs/flutter-apk/*arm64-v8a*.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/runner
        build_repo_dir: /home/runner/work/auraninja/auraninja
        build_timeout:
        build_user: runner
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '20.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
            sha256: 04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7
          extra_packages:
            - curl
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
