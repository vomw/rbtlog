---
repository: https://github.com/leekleak/traffic-light.git
updates: releases
versions:
  - tag: v3.4.3
    apks:
      - apk_pattern: com.leekleak.trafficlight-.*-lite-release\.apk
        apk_url: https://github.com/leekleak/traffic-light/releases/download/v3.4.3/com.leekleak.trafficlight-3.4.3-lite-release.apk
        build:
          - sed -ri '/signingConfigs.getBy/d' app/build.gradle.kts
          - sed -ri '/playIntegration/d' settings.gradle.kts app/build.gradle.kts
          - rm -rf playIntegration
          - ./gradlew assembleLiteRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/lite/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '22.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
            sha256: 4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583
          extra_packages: []
          image: ubuntu:noble
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
