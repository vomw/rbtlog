---
repository: https://github.com/d4rken-org/sdmaid-se.git
updates: releases
labels:
  - update-hashes
notes:
  - v1.2.2 not RB due to baseline.prof – seems to be a "flaky build", see https://github.com/d4rken-org/sdmaid-se/issues/1232#issuecomment-2258213434
  - v1.2.3 + v1.2.4 built without issues, so probably a one-time event
  - v1.2.5 needed a second run as well, so finally implementing flaky work-around
versions:
  - tag: v1.1.2-rc0
    apks:
      - apk_pattern: eu.darken.sdmse-.*\.apk
        apk_url: https://github.com/d4rken-org/sdmaid-se/releases/download/v1.1.2-rc0/eu.darken.sdmse-v1.1.2-rc0-10102000-FOSS-RELEASE.apk
        build:
          - sed -r '/signingConfigs\[/d' -i app/build.gradle.kts
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/foss/release/eu.darken.sdmse-*-FOSS-RELEASE.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
