---
repository: https://github.com/SecUSo/Aktivpause.git
updates: releases
versions:
  - tag: v1.2.6
    apks:
      - apk_pattern: pfa-aktivpause-to-go-release.*\.apk
        apk_url: https://github.com/SecUSo/Aktivpause/releases/download/v1.2.6/pfa-aktivpause-to-go-release-v1.2.6.apk
        build:
          - git reset --soft 1917800db5e8067b2d46abb8db95a28b5687c994
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '20.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
            sha256: 04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
