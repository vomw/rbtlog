---
repository: https://github.com/jerryhcooke/smouldering_durtles.git
updates: releases
versions:
  - tag: v1.2.8
    apks:
      - apk_pattern: smouldering_durtles_.*_arm64_signed\.apk
        apk_url: https://github.com/jerryhcooke/smouldering_durtles/releases/download/v1.2.8/smouldering_durtles_1.2.8_arm64_signed.apk
        build:
          - git reset --soft e0d220bbfdbcf7d7151a1327283bc2d2c8548153
          - sed -ri '/org.gradle.toolchains.foojay-resolver-convention/d' settings.gradle
          - sed -ri '/signingConfigs.(debug|release)/d' app/build.gradle
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '22.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
            sha256: 4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
