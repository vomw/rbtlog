---
repository: https://github.com/PGAxis/YTCnv.git
updates: releases
versions:
  - tag: v3.4.2
    apks:
      - apk_pattern: youtubeConverter-.*-fdroid\.apk
        apk_url: https://github.com/PGAxis/YTCnv/releases/download/v3.4.2/youtubeConverter-3.4.2-fdroid.apk
        build:
          - git reset --soft 0be98d0ae3d302b510ab5b02c311dad20becfcbe
          - ./gradlew assembleFdroidRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/fdroid/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '20.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
            sha256: 04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
