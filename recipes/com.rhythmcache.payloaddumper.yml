---
repository: https://github.com/rhythmcache/payload-dumper-gui.git
updates: releases
notes:
  - integrated update checker, see https://gitlab.com/IzzyOnDroid/repo/-/issues/926#note_2978671607
versions:
  - tag: v0.1.2
    apks:
      - apk_pattern: payload-dumper-android-arm64-v8a.*\.apk
        apk_url: https://github.com/rhythmcache/payload-dumper-gui/releases/download/v0.1.2/payload-dumper-android-arm64-v8a-0.1.2.apk
        build:
          - sed -r '/signingConfigs.getByName/d' -i app/build.gradle.kts
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/app-arm64-v8a*.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages: []
          image: debian:trixie-slim
          jdk: openjdk-25-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
