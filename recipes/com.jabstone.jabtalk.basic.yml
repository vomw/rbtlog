---
repository: https://github.com/jabstone/JABtalk.git
updates: releases
notes:
  - 'FIXED: embedded commit hash mismatch for 5.3.1 (manually adjusted)'
  - 'FIXME: update recipe on next release following 5.3.2 as gradle-wrapper was fixed now upstream'
versions:
  - tag: 5.3.1
    apks:
      - apk_pattern: jabtalk.*\.apk
        apk_url: https://github.com/jabstone/JABtalk/releases/download/5.3.1/jabtalk_v5.3.1.apk
        build:
          - git reset --soft 80e4176255990f66f8de0a7812863e5f5f9d4eec
          - chmod +x gradlew
          - wget -q -O /tmp/gradle-8.4-bin.zip -- https://services.gradle.org/distributions/gradle-8.4-bin.zip
          - sha256sum -c <<< '3e1af3ae886920c3ac87f7a91f816c0c7c436f276a6eefdb3da152100fef72ae  /tmp/gradle-8.4-bin.zip'
          - unzip -q -d /opt /tmp/gradle-8.4-bin.zip
          - export PATH="${PATH}:/opt/gradle-8.4/bin"
          - gradle assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
  - tag: 5.3.2
    apks:
      - apk_pattern: jabtalk.*\.apk
        apk_url: https://github.com/jabstone/JABtalk/releases/download/5.3.2/jabtalk_v5.3.2.apk
        build:
          - git reset --soft 6b9a1f572224c8970e8be8396125abe23b9eda77
          - wget -q -O /tmp/gradle-8.7-bin.zip -- https://services.gradle.org/distributions/gradle-8.7-bin.zip
          - sha256sum -c <<< '544c35d6bd849ae8a5ed0bcea39ba677dc40f49df7d1835561582da2009b961d  /tmp/gradle-8.7-bin.zip'
          - unzip -q -d /opt /tmp/gradle-8.7-bin.zip
          - export PATH="${PATH}:/opt/gradle-8.7/bin"
          - gradle assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
