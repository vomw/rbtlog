---
repository: https://github.com/d4rken-org/capod.git
updates: releases
notes:
  - opened https://github.com/d4rken-org/capod/issues/223 on How to build unsigned foss APK
versions:
  - tag: v2.14.1-rc0
    apks:
      - apk_pattern: eu.darken.capod-v.*FOSS-RELEASE\.apk
        apk_url: https://github.com/d4rken-org/capod/releases/download/v2.14.1-rc0/eu.darken.capod-v2.14.1-rc0-21401000-FOSS-RELEASE.apk
        build:
          - sed -r '/signingConfigs\[/d;/setupCredentials/d' -i app/build.gradle.kts
          - chmod +x gradlew
          - ./gradlew :app:assembleFossRelease
          - mv app/build/outputs/apk/foss/release/*.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
