---
repository: https://github.com/Smooth-E/monet-color-previewer.git
updates: releases
notes:
  - 'FIXME: needed to inject gradle-8.0 with v1.2 as the included gradle wrapper (7.5) failed verification.'
versions:
  - tag: v1.2
    apks:
      - apk_pattern: Material-You-Color-Previewer-.*\.apk
        apk_url: https://github.com/Smooth-E/monet-color-previewer/releases/download/v1.2/Material-You-Color-Previewer-v1.2.apk
        build:
          - wget -q -O /tmp/gradle-8.0-bin.zip -- https://services.gradle.org/distributions/gradle-8.0-bin.zip
          - sha256sum -c <<< '4159b938ec734a8388ce03f52aa8f3c7ed0d31f5438622545de4f83a89b79788  /tmp/gradle-8.0-bin.zip'
          - unzip -q -d /opt /tmp/gradle-8.0-bin.zip
          - export PATH="${PATH}:/opt/gradle-8.0/bin"
          - gradle assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
