---
repository: https://github.com/ammargitham/WallFlow.git
updates: releases
versions:
  - tag: v2.5.0
    apks:
      - apk_pattern: app-plus-arm64-v8a-release-signed\.apk
        apk_url: https://github.com/ammargitham/WallFlow/releases/download/v2.5.0/app-plus-arm64-v8a-release-signed.apk
        build:
          - chmod +x gradlew
          - ./gradlew assemblePlusRelease -Pfdroid -Pabi=arm64-v8a
          - mv app/build/outputs/apk/plus/release/*unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
      - apk_pattern: app-plus-armeabi-v7a-release-signed\.apk
        apk_url: https://github.com/ammargitham/WallFlow/releases/download/v2.5.0/app-plus-armeabi-v7a-release-signed.apk
        build:
          - chmod +x gradlew
          - ./gradlew assemblePlusRelease -Pfdroid -Pabi=armeabi-v7a
          - mv app/build/outputs/apk/plus/release/*unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
