---
repository: https://github.com/shalenMathew/MovieFlix_App.git
updates: releases
versions:
  - tag: v1.3
    apks:
      - apk_pattern: MovieFlix.*\.apk
        apk_url: https://github.com/shalenMathew/MovieFlix_App/releases/download/v1.3/MovieFlix-v1.3.apk
        build:
          - base64 -d > local.properties <<< bW92aWVBcGlLZXk9ImVkYzc4YjA0NDJiYjZkOWY1ZWRkOTBlYjYyM2ZhOWMwIgo=
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
          - OUT=app/build/outputs/apk/release/app-release-unsigned.apk
          - reproducible-apk-tools/inplace-fix.py --internal --page-size 16 fix-newlines "$OUT" 'res/-g.json'
          - mv "$OUT" /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
