  - tag: 5.1.3
    apks:
      - apk_pattern: XryptoMail-release\.apk
        apk_url: https://github.com/cmeng-git/xmail/releases/download/5.1.3/XryptoMail-release.apk
        build:
          - chmod +x gradlew
