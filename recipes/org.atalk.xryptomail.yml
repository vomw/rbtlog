---
repository: https://github.com/cmeng-git/xmail.git
updates: releases
notes:
  - 5.1.3 needed patch for local uncommitted changes, removed again with 5.2.0
  - 5.2.0 was built outside the git tree, so we had to rm -rf .git
versions:
  - tag: 5.1.0
    apks:
      - apk_pattern: XryptoMail-release\.apk
        apk_url: https://github.com/cmeng-git/xmail/releases/download/5.1.0/XryptoMail-release.apk
        build:
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - mv XryptoMail/build/outputs/apk/release/XryptoMail-release-unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
