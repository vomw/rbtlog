---
repository: https://github.com/d4rken-org/octi.git
updates: releases
versions:
  - tag: v0.16.0-rc0
    apks:
      - apk_pattern: eu.darken.octi-.*-FOSS-RELEASE\.apk
        apk_url: https://github.com/d4rken-org/octi/releases/download/v0.16.0-rc0/eu.darken.octi-v0.16.0-rc0-1600000-FOSS-RELEASE.apk
        build:
          - sed -r '/signingConfigs\[/d ; /signingConfigs \{/,/^    \}/d' -i app/build.gradle.kts
          - ./gradlew assembleFossRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/foss/release/eu.darken.octi*.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '20.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
            sha256: 04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
