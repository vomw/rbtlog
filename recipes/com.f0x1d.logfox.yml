---
repository: https://github.com/F0x1d/LogFox.git
updates: releases
notes:
  - embedded commit hash needed in-place fix for v2.0.0 (fixed meanwhile)
versions:
  - tag: v2.0.0
    apks:
      - apk_pattern: logfox-.*\.apk
        apk_url: https://github.com/F0x1d/LogFox/releases/download/v2.0.0/logfox-2.0.0.apk
        build:
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - git clone -b v0.2.7 https://github.com/obfusk/reproducible-apk-tools.git
          - OUT=app/build/outputs/apk/release/app-release-unsigned.apk
          - reproducible-apk-tools/inplace-fix.py --zipalign --page-size 4 fix-files "$OUT" 'sed s/034cf37e1c14454dc72ebd856341f18e0162e792/c9e41a8cb055f1fba0789a5d7d183a224a9ca3cd/' 'META-INF/version-control-info.textproto'
          - mv "$OUT" /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
