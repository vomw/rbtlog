  - tag: 2.3.0
    apks:
      - apk_pattern: UP-Example-main\.apk
        apk_url: https://codeberg.org/UnifiedPush/android-example/releases/download/$$TAG$$/UP-Example-main.apk
        build:
          - sed -ri 's@app/build/outputs/bundle/release/app-release.aab@app/build/outputs/bundle/mainFlavorRelease/app-mainFlavor-release.aab@' app/build.gradle.kts
          - ./gradlew reproduceUniversal
          - unzip -p universal.apks universal.apk > /outputs/unsigned.apk
