---
repository: https://github.com/frknkrc44/HMA-OSS.git
updates: releases
versions:
  - tag: oss-137
    apks:
      - apk_pattern: HMA-OSS-oss.*release\.apk
        apk_url: https://github.com/frknkrc44/HMA-OSS/releases/download/oss-137/HMA-OSS-oss-137-release.apk
        build:
          - echo "officialBuild=true" >> local.properties
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/HMA-OSS-oss-*-release.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages: []
          image: debian:trixie-slim
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
