---
repository: https://github.com/nikhilmwarrier/anthology.git
updates: releases
notes:
  - pnpm version in android_build.yml
versions:
  - tag: v1.0.4
    apks:
      - apk_pattern: Anthology.*\.apk
        apk_url: https://github.com/nikhilmwarrier/anthology/releases/download/v1.0.4/Anthology-1.0.4.apk
        build:
          - sed -r '/signingConfigs.release/d' -i android/app/build.gradle
          - wget -q -O /tmp/nodejs-lts.zip -- https://nodejs.org/dist/v22.20.0/node-v22.20.0-linux-x64.tar.xz
          - sha256sum -c <<< '00bbd05e306ea68b6e13e17360d0e2f680b493ef95f2fea1c4296ff7437530bc  /tmp/nodejs-lts.zip'
          - tar xf /tmp/nodejs-lts.zip -C /opt
          - export PATH="${PATH}:/opt/node-v22.20.0-linux-x64/bin:${HOME}/.node/bin"
          - npm install --global corepack@latest
          - corepack enable pnpm
          - corepack use pnpm@latest-9
          - pnpm install
          - pnpm run build
          - pnpm cap sync
          - pushd android
          - chmod +x gradlew
          - ./gradlew clean assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/runner
        build_repo_dir: /home/runner/work/anthology/anthology
        build_timeout:
        build_user: runner
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages:
            - xz-utils
          image: ubuntu:jammy
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
