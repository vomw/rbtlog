---
repository: https://github.com/fast4x/RiPlay.git
updates: releases
notes:
  - maybe limit to 6 CPUs
versions:
  - tag: 0.0.60
    apks:
      - apk_pattern: RiPlay-foss-release.*\.apk
        apk_url: https://github.com/fast4x/RiPlay/releases/download/0.0.60/RiPlay-foss-release-0.0.60.apk
        build:
          - sed -r '/signingConfigs.getByName/d' -i composeApp/build.gradle.kts
          - ./gradlew assembleFossRelease
          - find . -name '*.apk'
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
          - OUT=composeApp/build/outputs/apk/foss/release/RiPlay-foss-release-*.apk
          - reproducible-apk-tools/inplace-fix.py --internal --page-size 16 fix-newlines $OUT 'res/*.html' 'assets/composeResources/riplay.composeapp.generated.resources/drawable/*.xml' 'res/Xy.json' 'res/lM.json'
          - mv $OUT /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages:
            - python3
          image: debian:trixie-slim
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
