---
repository: https://github.com/abdallahmehiz/mpvKt.git
updates: releases
versions:
  - tag: v0.1.1
    apks:
      - apk_pattern: mpvKt-arm64-v8a.*\.apk
        apk_url: https://github.com/abdallahmehiz/mpvKt/releases/download/v0.1.1/mpvKt-arm64-v8a-v0.1.1.apk
        build:
          - sed -r '/abi \{/,/}/ { s/include\(.*\)/include("arm64-v8a")/ ; s/isUniversalApk = true/isUniversalApk = false/ }' -i app/build.gradle.kts
          - timestamp="$(curl -sL https://github.com/abdallahmehiz/mpvKt/releases/download/${APP_TAG}/build-metadata.json | jq -r '.timestamp' | tr -cd 0-9)"
          - echo -e "\ntimestamp=$timestamp" >> gradle.properties
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - jq
            - curl
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
