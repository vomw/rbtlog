---
repository: https://github.com/dn0ne/lotus.git
updates: releases
notes:
  - with "-PABI_FILTERS=arm64-v8a -PnoSplits" OUTFILE is "lotus-<version>-release.apk", without "-PnoSplits" it is "lotus-<version>-<abi>-release.apk" but all ABIs are built (incl. universal)
versions:
  - tag: v1.0.0
    apks:
      - apk_pattern: lotus-.*-arm64-v8a-release\.apk
        apk_url: https://github.com/dn0ne/lotus/releases/download/v1.0.0/lotus-1.0.0-arm64-v8a-release.apk
        build:
          - sed -r '/signingConfigs.getByName/d' -i app/build.gradle.kts
          - ./gradlew assembleRelease -PABI_FILTERS=arm64-v8a -PnoSplits
          - mv app/build/outputs/apk/release/lotus-*-release.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
  - tag: v1.1.0
    apks:
      - apk_pattern: lotus-.*-arm64-v8a-release\.apk
        apk_url: https://github.com/dn0ne/lotus/releases/download/v1.1.0/lotus-1.1.0-arm64-v8a-release.apk
        build:
          - sed -r '/signingConfigs.getByName/d' -i app/build.gradle.kts
          - ./gradlew assembleRelease -PABI_FILTERS=arm64-v8a -PnoSplits
          - mv app/build/outputs/apk/release/lotus-*-release.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
