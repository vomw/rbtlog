---
repository: https://github.com/The-First-King/Auto-Light.git
updates: releases
versions:
  - tag: '2.1'
    apks:
      - apk_pattern: auto-light.*\.apk
        apk_url: https://github.com/The-First-King/Auto-Light/releases/download/2.1/auto-light-21.apk
        build:
          - git checkout 5dea876cf79c0e9030d7cb04efdcf730d2a1b9ea
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
