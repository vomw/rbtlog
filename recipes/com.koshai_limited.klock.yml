---
repository: https://codeberg.org/rootminusone8004/Klock.git
updates: releases
versions:
  - tag: v1.1.3
    apks:
      - apk_pattern: app-release\.apk
        apk_url: https://codeberg.org/rootminusone8004/Klock/releases/download/v1.1.3/Klock_1.1.3.apk
        build:
          - wget -q -O /tmp/gradle-8.9-bin.zip -- https://services.gradle.org/distributions/gradle-8.9-bin.zip
          - sha256sum -c <<< 'd725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab  /tmp/gradle-8.9-bin.zip'
          - unzip -q -d /opt /tmp/gradle-8.9-bin.zip
          - export PATH="${PATH}:/opt/gradle-8.9/bin"
          - gradle assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
