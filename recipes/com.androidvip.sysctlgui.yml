---
repository: https://github.com/Lennoard/SysctlGUI.git
updates: releases
notes:
  - 2.2.2 not RB due to Missing classes detected while running R8
  - 2.2.3 the same, 'Missing classes detected while running R8.'
versions:
  - tag: 2.2.1
    apks:
      - apk_pattern: sysctl.?gui-.*\.apk
        apk_url: https://github.com/Lennoard/SysctlGUI/releases/download/2.2.1/sysctl-gui-v2.2.1.apk
        build:
          - sed -r '/signingConfigs.getByName/d' -i app/build.gradle.kts
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
