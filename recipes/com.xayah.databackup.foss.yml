  - tag: 2.0.6_1
    apks:
      - apk_pattern: DataBackup-.*armeabi-v7a-foss-release\.apk
        apk_url: https://github.com/XayahSuSuSu/Android-DataBackup/releases/download/2.0.6_1/DataBackup-2.0.6_1-armeabi-v7a-foss-release.apk
        build:
          - cd source
          - chmod +x gradlew
          - sed -r '/signingConfigs.getByName/d' -i build-logic/convention/src/main/kotlin/ApplicationCommonConventionPlugin.kt
          - PROF_FILE=app/build/intermediates/binary_art_profile/armeabi-v7aFossRelease/compileArmeabi-v7aFossReleaseArtProfile/baseline.prof
          - PROF_SHA1=5baa9504c1f1a69dbd63afb8dc9a59413e49867c
          - for _ in {1..10}; do
          - ./gradlew clean assembleArmeabi-v7aFossRelease --no-build-cache --no-configuration-cache --no-daemon
          - test -f "${PROF_FILE}"
          - if [ "$( sha1sum "$PROF_FILE" | cut -d' ' -f1 )" = "$PROF_SHA1" ]; then
          - break
          - fi
          - done
          - mv app/build/outputs/apk/armeabi-v7aFoss/release/DataBackup-*-armeabi-v7a-foss-release.apk /outputs/unsigned.apk
        build_home_dir: /build
