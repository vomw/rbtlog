---
repository: https://github.com/XayahSuSuSu/Android-DataBackup.git
updates: releases
versions:
  - tag: 2.0.3
    apks:
      - apk_pattern: DataBackup-.*armeabi-v7a-foss-release\.apk
        apk_url: https://github.com/XayahSuSuSu/Android-DataBackup/releases/download/2.0.3/DataBackup-2.0.3-armeabi-v7a-foss-release.apk
        build:
          - cd source
          - chmod +x gradlew
          - sed -r '/signingConfigs.getByName/d' -i build-logic/convention/src/main/kotlin/ApplicationCommonConventionPlugin.kt
          - ./gradlew assembleArmeabi-v7aFossRelease
          - mv app/build/outputs/apk/armeabi-v7aFoss/release/DataBackup-*-armeabi-v7a-foss-release.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
