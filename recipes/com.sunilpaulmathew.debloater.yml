---
repository: https://github.com/sunilpaulmathew/De-Bloater.git
updates: releases
notes:
  - 'FIXME: v0.27 was built from a commit not present in the repo, see https://github.com/sunilpaulmathew/De-Bloater/issues/48'
versions:
  - tag: v0.27
    apks:
      - apk_pattern: app-release\.apk
        apk_url: https://github.com/sunilpaulmathew/De-Bloater/releases/download/v0.27/app-release.apk
        build:
          - sed -r 's/2553ee0eed968bbb01b6314c78d247847258ad4a/63d9eefec3bf454b2d8a6f3c92c70f6fdc4328f7/' -i app/src/main/assets/release.json
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
          - reproducible-apk-tools/inplace-fix.py --internal --zipalign --page-size 4 fix-files app/build/outputs/apk/release/app-release-unsigned.apk 'sed s/a7a6b0364a036d44bdd69c808e7c3c1183131409/97278110704347db23633fc58cde7ee8aae00c7a/' 'META-INF/version-control-info.textproto'
          - mv app/build/outputs/apk/release/app-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
