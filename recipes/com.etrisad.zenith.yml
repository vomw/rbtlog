---
repository: https://github.com/1372Slash/Zenith.git
updates: releases
versions:
  - tag: v1.5.6
    apks:
      - apk_pattern: Zenith-store-.*\.apk
        apk_url: https://github.com/1372Slash/Zenith/releases/download/v1.5.6/Zenith-store-1.5.6.apk
        build:
          - chmod +x gradlew
          - ./gradlew assembleStoreRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/store/release/Zenith-store-*.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '20.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
            sha256: 04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7
          extra_packages: []
          image: debian:trixie-slim
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
  - tag: v1.5.7
    apks:
      - apk_pattern: Zenith-store-.*\.apk
