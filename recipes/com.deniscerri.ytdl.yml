---
repository: https://github.com/deniscerri/ytdlnis.git
updates: releases
notes:
  - RB when we build all ABIs and just pick one; not RB when we try to just build the ABI we want
versions:
  - tag: v1.7.9.2
    apks:
      - apk_pattern: YTDLnis-.*-arm64-v8a-release\.apk
        apk_url: https://github.com/deniscerri/ytdlnis/releases/download/v1.7.9.2/YTDLnis-1.7.9.2-arm64-v8a-release.apk
        build:
          - sed -r '/signingConfigs.debug/d' -i app/build.gradle
          - chmod +x gradlew
          - touch local.properties
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/YTDLnis-*-arm64-v8a-release-unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
