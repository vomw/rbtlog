---
repository: https://gitlab.com/marcomorosi.dev/wifiaudiostreaming-android.git
updates: releases
notes:
  - upstream build recipe at https://github.com/marcomorosi06/WiFiAudioStreaming-Android/blob/master/.github/workflows/reproducible-apk.yml
versions:
  - tag: v0.1.0-beta
    apks:
      - apk_pattern: WiFi-Audio_Streaming.*\.apk
        apk_url: https://gitlab.com/marcomorosi.dev/wifiaudiostreaming-android/-/raw/master/compiled/WiFi-Audio_Streaming_v0.1.0-beta.apk
        build:
          - git reset --soft 4ee301bc44854b5fba41e6001b46028c981ad2ce
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
