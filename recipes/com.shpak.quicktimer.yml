---
repository: https://github.com/ashpakouski/QuickTimer.git
updates: releases
labels:
  - flaky
versions:
  - tag: v1.0.0
    apks:
      - apk_pattern: Quick-Timer-.*\.apk
        apk_url: https://github.com/ashpakouski/QuickTimer/releases/download/v1.0.0/Quick-Timer-v1.0.0.apk
        build:
          - git checkout 7a189face01c63ddc1cd09a13f5f168195c88d5f
          - git reset --soft 5c4d60923d23383adb74a05ac01224f159de4a02
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
  - tag: v1.0.1
    apks:
      - apk_pattern: Quick-Timer-.*\.apk
        apk_url: https://github.com/ashpakouski/QuickTimer/releases/download/v1.0.1/Quick-Timer-v1.0.1.apk
        build:
          - chmod +x gradlew
          - PROF_FILE=app/build/intermediates/binary_art_profile/release/compileReleaseArtProfile/baseline.prof
          - PROF_SHA1=a6512dd0ad6836129cfc0986e3d504351da70672
          - for _ in {1..10}; do
          - ./gradlew clean assembleRelease --no-build-cache --no-configuration-cache --no-daemon
          - find . -name 'baseline.prof'
          - test -f "$PROF_FILE"
          - if [ "$( sha1sum "$PROF_FILE" | cut -d' ' -f1 )" = "$PROF_SHA1" ]; then
          - break
          - fi
          - done
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
