---
repository: https://github.com/Hamza417/Inure.git
updates: releases
versions:
  - tag: build104.0.0
    apks:
      - apk_pattern: app-github-release\.apk
        apk_url: https://github.com/Hamza417/Inure/releases/download/build104.0.0/app-github-release.apk
        build:
          - chmod +x gradlew
          - ./gradlew assembleGithubRelease
          - mv app/build/outputs/apk/github/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/runner
        build_repo_dir: /home/runner/work/Inure/Inure
        build_timeout:
        build_user: build
        provisioning:
          android_home: /usr/local/lib/android/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: ubuntu:noble
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
