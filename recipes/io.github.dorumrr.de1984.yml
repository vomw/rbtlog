---
repository: https://github.com/dorumrr/de1984.git
updates: releases
versions:
  - tag: v1.0.0
    apks:
      - apk_pattern: de1984-.*-release\.apk
        apk_url: https://github.com/dorumrr/de1984/releases/download/v1.0.0/de1984-v1.0.0-release.apk
        build:
          - sed -r '/signingConfigs.getByName/d' -i app/build.gradle.kts
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
          - reproducible-apk-tools/zipalign.py --page-size 4 --pad-like-apksigner --replace app/build/outputs/apk/release/de1984-*-release.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
