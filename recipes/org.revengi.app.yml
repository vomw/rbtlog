---
repository: https://github.com/RevEngiSquad/revengi-app.git
updates: releases
notes:
  - 'FIXME: after 1.3.0, values for RUSTUP and RUST_TOOLCHAIN can be found at the head of .github/workflows/release.yml'
versions:
  - tag: v1.0.2
    apks:
      - apk_pattern: RevEngi-Android-arm64\.apk
        apk_url: https://github.com/RevEngiSquad/revengi-app/releases/download/v1.0.2/RevEngi-Android-arm64.apk
        build:
          - sed -r '/create\("release"\) \{/,/        \}/d' -i android/app/build.gradle.kts
          - sed -r '/signingConfigs.getByName/d' -i android/app/build.gradle.kts
          - FLUTTER_VERSION="$(sed -rn 's/\s*\bFLUTTER_VERSION:\s\"\^?([0-9.]+)\"\s*$/\1/p' .github/workflows/release.yml)"
          - git clone -b $FLUTTER_VERSION https://github.com/flutter/flutter
          - export PUB_CACHE=$(pwd)/.pub-cache
          - flutter/bin/flutter config --no-analytics
          - flutter/bin/flutter pub get
          - flutter/bin/flutter build apk --release --split-per-abi --target-platform android-arm64
          - find . -name '*.apk'
          - mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/runner
        build_repo_dir: /home/runner/work/revengi-app/revengi-app
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - curl
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
