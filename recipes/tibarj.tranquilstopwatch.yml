            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
  - tag: v1.0.2
    apks:
      - apk_pattern: tranquilstopwatch-.*\.apk
        apk_url: https://github.com/tibarj/tranquilstopwatch/releases/download/v1.0.2/tranquilstopwatch-2.apk
