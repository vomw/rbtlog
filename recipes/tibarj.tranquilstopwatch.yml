---
repository: https://github.com/tibarj/tranquilstopwatch.git
updates: releases
notes:
  - 'FIXED: gradle wrapper did not verify, so gradle.8.4 was injected manually with v1.0.0'
  - 'FIXED: v1.0.1 needed soft-reset to embedded commit hash'
  - v1.0.2 has proper gradle-wrapper JAR now
versions:
  - tag: v1.0.0
    apks:
      - apk_pattern: tranquilstopwatch-.*\.apk
        apk_url: https://github.com/tibarj/tranquilstopwatch/releases/download/v1.0.0/tranquilstopwatch-1.apk
        build:
          - wget -q -O /tmp/gradle-8.4-bin.zip -- https://services.gradle.org/distributions/gradle-8.4-bin.zip
          - sha256sum -c <<< '3e1af3ae886920c3ac87f7a91f816c0c7c436f276a6eefdb3da152100fef72ae  /tmp/gradle-8.4-bin.zip'
          - unzip -q -d /opt /tmp/gradle-8.4-bin.zip
          - export PATH="${PATH}:/opt/gradle-8.4/bin"
          - gradle assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
  - tag: v1.0.1
    apks:
      - apk_pattern: tranquilstopwatch-.*\.apk
        apk_url: https://github.com/tibarj/tranquilstopwatch/releases/download/v1.0.1/tranquilstopwatch-2.apk
        build:
          - git reset --soft edbb60d9498544f1cb55a76232edcf16e1940c9a
          - wget -q -O /tmp/gradle-8.4-bin.zip -- https://services.gradle.org/distributions/gradle-8.4-bin.zip
          - sha256sum -c <<< '3e1af3ae886920c3ac87f7a91f816c0c7c436f276a6eefdb3da152100fef72ae  /tmp/gradle-8.4-bin.zip'
          - unzip -q -d /opt /tmp/gradle-8.4-bin.zip
          - export PATH="${PATH}:/opt/gradle-8.4/bin"
          - gradle assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
