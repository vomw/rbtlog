---
repository: https://github.com/privacyguides/verified-apps-android.git
updates: releases
versions:
  - tag: 26.6.8
    apks:
      - apk_pattern: VerifiedApps.*\.apk
        apk_url: https://github.com/privacyguides/verified-apps-android/releases/download/26.6.8/VerifiedApps-26.6.8.apk
        build:
          - sed -r '/org.gradle.toolchains.foojay-resolver-convention/d' -i settings.gradle.kts
          - sed -r '/(foojay|toolchainVendor)/d' -i gradle/gradle-daemon-jvm.properties
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '20.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
            sha256: 04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7
          extra_packages: []
          image: debian:trixie-slim
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
