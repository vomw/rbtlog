---
repository: https://github.com/dietrichmax/colota.git
updates: releases
labels:
  - react-native
versions:
  - tag: v1.4.0
    apks:
      - apk_pattern: app-foss-arm64-v8a-release\.apk
        apk_url: https://github.com/dietrichmax/colota/releases/download/v1.4.0/app-foss-arm64-v8a-release.apk
        build:
          - sed -r '/signingConfigs.release/d' -i apps/mobile/android/app/build.gradle
          - wget -q -O /tmp/nodejs-lts.zip -- https://nodejs.org/dist/v22.20.0/node-v22.20.0-linux-x64.tar.xz
          - sha256sum -c <<< '00bbd05e306ea68b6e13e17360d0e2f680b493ef95f2fea1c4296ff7437530bc  /tmp/nodejs-lts.zip'
          - tar xf /tmp/nodejs-lts.zip -C /opt
          - export PATH="${PATH}:/opt/node-v22.20.0-linux-x64/bin:${HOME}/.node/bin"
          - npm ci
          - npm run build -w @colota/shared
          - sed -i 's/getHostIpAddress(),/project.properties["reactNativeDevServerIp"]?.toString() ?:\ "localhost",/' node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/src/main/kotlin/com/facebook/react/utils/AgpConfiguratorUtils.kt
          - sed -i '/^project(rnscreens)/a add_link_options(-Wl,--build-id=none)' node_modules/react-native-screens/android/CMakeLists.txt
          - pushd apps/mobile/android
          - chmod +x gradlew
          - ./gradlew clean assembleFossRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/foss/release/app-foss-arm64-v8a-*.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/runner
        build_repo_dir: /home/runner/work/colota/colota
        build_timeout:
        build_user: runner
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages:
            - xz-utils
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
