---
repository: https://github.com/tfonteyn/Sshd4a.git
updates: releases
versions:
  - tag: v1.12.1
    apks:
      - apk_pattern: Sshd4a-.*\.apk
        apk_url: https://github.com/tfonteyn/Sshd4a/releases/download/v1.12.1/Sshd4a-1.12.1.apk
        build:
          - sed -r '/signingConfigs.release/d ; /signingConfigs \{/,/^    \}/d' -i app/build.gradle
          - ./build.sh
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/Sshd4a-*.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake: 4.1.2
          cmdline_tools:
            version: '20.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
            sha256: 04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7
          extra_packages: []
          image: debian:trixie-slim
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
  - tag: v1.13.0
    apks:
      - apk_pattern: Sshd4a-.*\.apk
        apk_url: https://github.com/tfonteyn/Sshd4a/releases/download/v1.13.0/Sshd4a-1.13.0.apk
        build:
          - sed -r '/signingConfigs.release/d ; /signingConfigs \{/,/^    \}/d' -i app/build.gradle
          - ./build.sh
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/Sshd4a-*.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake: 4.1.2
          cmdline_tools:
            version: '22.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
            sha256: 4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583
          extra_packages: []
          image: debian:trixie-slim
          jdk: openjdk-25-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
