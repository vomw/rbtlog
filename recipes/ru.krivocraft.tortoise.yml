---
repository: https://github.com/zelenyhleb/tortoise.git
updates: releases
notes:
  - 'FIXME: v0.5.1 needs soft-reset to embedded commit hash'
  - 'FIXME: v0.5.2 is not RB. Embedded commit hash points to an invalid commit (fatal: Could not parse object 96d8c9cbd427bac6e85cac0fd42679c17ada4742), see https://github.com/zelenyhleb/tortoise/issues/40'
versions:
  - tag: v0.5.1
    apks:
      - apk_pattern: tortoise\.apk
        apk_url: https://github.com/zelenyhleb/tortoise/releases/download/v0.5.1/tortoise.apk
        build:
          - git reset --soft f610e4f3d6b398adc462cdbfaa2a1d07c41ffaab
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
  - tag: v0.5.2
    apks:
      - apk_pattern: tortoise\.apk
        apk_url: https://github.com/zelenyhleb/tortoise/releases/download/v0.5.2/tortoise.apk
        build:
          - git reset --soft 96d8c9cbd427bac6e85cac0fd42679c17ada4742
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
