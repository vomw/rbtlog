---
repository: https://github.com/jellyfin/jellyfin-android.git
updates: releases
versions:
  - tag: v2.6.2
    apks:
      - apk_pattern: jellyfin-android-.*-libre-release\.apk
        apk_url: https://github.com/jellyfin/jellyfin-android/releases/download/v2.6.2/jellyfin-android-v2.6.2-libre-release.apk
        build:
          - sed -r '/signingConfig \= releaseSigningConfig/d' -i app/build.gradle.kts
          - echo "jellyfin.version=${APP_TAG:1}" >> gradle.properties
          - ./gradlew assembleLibreRelease
          - mv app/build/outputs/apk/libre/release/jellyfin-android-*-libre-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
