---
repository: https://github.com/spieglt/FlyingCarpet.git
updates: tags:v([\d.]+)
versions:
  - tag: v8.0.2
    apks:
      - apk_pattern: android_FlyingCarpet_.*\.apk
        apk_url: https://github.com/spieglt/FlyingCarpet/releases/download/$$TAG$$/android_FlyingCarpet_$$TAG:1$$.apk
        build:
          - cd Android/FlyingCarpet
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
