    apks:
      - apk_pattern: paperknife-lite.*\.apk
        apk_url: https://github.com/potatameister/PaperKnife/releases/download/v1.1.0/paperknife-lite-v1.1.0.apk
        build:
          - tar xf "${PROVISIONING_CACHE_NODEJS_LTS_PATH}" -C /opt
          - export PATH="${PATH}:/opt/node-${PROVISIONING_CACHE_NODEJS_LTS_VERSION}-linux-x64/bin"
          - npm ci
          - rm -rf public/tesseract/
          - rm -rf public/qpdf/
          - export VITE_DISABLE_OCR=true
          - export VITE_DISABLE_UNLOCK_WASM=true
          - npm run build
          - rm -f dist/assets/qpdf-*.wasm
          - npx cap sync android
          - cd android
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/app-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/runner
        build_repo_dir: /home/runner/work/PaperKnife/PaperKnife
        build_timeout:
        build_user: runner
        provisioning:
          android_home: /usr/local/lib/android/sdk
          build_tools:
          cached_tools:
            - name: nodejs-lts
              file_name: nodejs-lts.tar.xz
              version: v24.21.0
              url: https://nodejs.org/dist/v24.21.0/node-v24.21.0-linux-x64.tar.xz
              sha256: fd8e59d5a511510f6a298afb548f18c7d2b1be404d8b4a27d94fbe49f56cb2d6
