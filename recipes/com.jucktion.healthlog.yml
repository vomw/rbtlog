---
repository: https://github.com/jucktion/healthlog.git
updates: releases
versions:
  - tag: v0.32.0
    apks:
      - apk_pattern: Healthlog-arm64\.apk
        apk_url: https://github.com/jucktion/healthlog/releases/download/$$TAG$$/Healthlog-arm64.apk
        build:
          - sed -r '/signingConfigs.release/d' -i android/app/build.gradle
          - FLUTTER_VERSION="3.27.1"
          - git clone -b $FLUTTER_VERSION https://github.com/flutter/flutter
          - export PUB_CACHE=$(pwd)/.pub-cache
          - flutter/bin/flutter config --no-analytics
          - flutter/bin/flutter pub get
          - flutter/bin/flutter build apk --release --target-platform android-arm64
          - mv build/app/outputs/flutter-apk//app-release.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/runner
        build_repo_dir: /home/runner/work/healthlog/healthlog
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - curl
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
