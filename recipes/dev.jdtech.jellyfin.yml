---
repository: https://github.com/jarnedemeulemeester/findroid.git
updates: releases
notes:
  - 'FIXNEEDED: AARs'
  - 'FIXED: timestamps'
versions:
  - tag: v0.15.3
    apks:
      - apk_pattern: findroid-.*-libre-arm64-v8a\.apk
        apk_url: https://github.com/jarnedemeulemeester/findroid/releases/download/v0.15.3/findroid-v0.15.3-libre-arm64-v8a.apk
        build:
          - sed -r '/abi \{/,/}/ { s/include\(.*\)/include("arm64-v8a")/ }' -i app/phone/build.gradle.kts
          - ./gradlew :app:phone:assembleLibreRelease
          - OUT=app/phone/build/outputs/apk/libre/release/findroid-*-libre-arm64-v8a.apk
          - mv $OUT /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: ubuntu:jammy
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
      - apk_pattern: findroid-.*-libre-armeabi-v7a\.apk
        apk_url: https://github.com/jarnedemeulemeester/findroid/releases/download/v0.15.3/findroid-v0.15.3-libre-armeabi-v7a.apk
        build:
          - sed -r '/abi \{/,/}/ { s/include\(.*\)/include("armeabi-v7a")/ }' -i app/phone/build.gradle.kts
          - ./gradlew :app:phone:assembleLibreRelease
          - OUT=app/phone/build/outputs/apk/libre/release/findroid-*-libre-armeabi-v7a.apk
          - mv $OUT /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: ubuntu:jammy
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
