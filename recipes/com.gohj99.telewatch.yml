---
repository: https://github.com/gohj99/Telewatch.git
updates: releases
notes:
  - 'FIXED: upstream APK up to 1.2.6 contained additional file assets/config.properties which we need to adjust (timestamp) and inject here via base64, see https://github.com/gohj99/Telewatch/issues/14'
versions:
  - tag: v1.2.6
    apks:
      - apk_pattern: Telewatch-.*arm\.apk
        apk_url: https://github.com/gohj99/Telewatch/releases/download/v1.2.6/Telewatch-v1.2.6-arm.apk
        build:
          - chmod +x gradlew
          - base64 -d > app/src/main/assets/config.properties <<< YXBpX2lkPTIzMzgxNDc2CmFwaV9oYXNoPTE2YTg5MTY2MzRhMmEyOWQyYTFhNzkxYTZjNzIxYzEyCkJVSUxEX0RBVEU9MjAyNDExMDIxOQpCRVRBPWZhbHNlCg==
          - ./gradlew assembleArmRelease
          - mv app/build/outputs/apk/arm/release/app-arm-release-unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
