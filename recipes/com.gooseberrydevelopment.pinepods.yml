---
repository: https://github.com/madeofpendletonwool/PinePods.git
updates: releases
versions:
  - tag: 0.8.0
    apks:
      - apk_pattern: pinepods-arm64.*\.apk
        apk_url: https://github.com/madeofpendletonwool/PinePods/releases/download/0.8.0/pinepods-arm64-0.8.0.apk
        build:
          - sed -r '/signingConfigs.release/d' -i mobile/android/app/build.gradle
          - FLUTTER_VERSION="$(sed -rn 's/^\s*flutter-version:\ .([0-9\.]*).*?/\1/p' .github/workflows/build-android-flutter.yml | head -n 1)"
          - cd mobile
          - echo -e "keyAlias=keyAlias\nkeyPassword=keyPassword\nstorePassword=storePassword" > android/key.properties
          - git clone -b $FLUTTER_VERSION https://github.com/flutter/flutter
          - export PUB_CACHE=$(pwd)/.pub-cache
          - flutter/bin/flutter config --no-analytics
          - flutter/bin/flutter pub get
          - flutter/bin/flutter build apk --release --split-per-abi --target-platform=android-arm64
          - find . -name '*.apk'
          - mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/runner
        build_repo_dir: /home/runner/work/PinePods/PinePods
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages:
            - curl
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
