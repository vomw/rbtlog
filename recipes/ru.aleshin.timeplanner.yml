---
repository: https://github.com/v1tzor/TimePlanner.git
updates: releases
versions:
  - tag: 1.0.1
    apks:
      - apk_pattern: .*timeplanner-release\.apk
        apk_url: https://github.com/v1tzor/TimePlanner/releases/download/1.0.1/1.0.1-timeplanner-release.apk
        build:
          - sed -r '/signingConfigs.getByName/d' -i app/build.gradle.kts
          - echo "storeFile=/dev/null\nstorePassword=storePassword\nkeyAlias=keyAlias\nkeyPassword=keyPassword" > local.properties
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
  - tag: 2.0.0
    apks:
      - apk_pattern: .*timeplanner-release\.apk
        apk_url: https://github.com/v1tzor/TimePlanner/releases/download/2.0.0/2.0.0-timeplanner-release.apk
        build:
          - sed -r '/signingConfigs.getByName/d ; /signingConfigs \{/,/^    \}/d' -i app/build.gradle.kts
          - echo "storeFile=/dev/null\nstorePassword=storePassword\nkeyAlias=keyAlias\nkeyPassword=keyPassword" > local.properties
          - chmod +x gradlew
          - ./gradlew assembleFdroidRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/fdroid/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout: 30
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '22.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
            sha256: 4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
