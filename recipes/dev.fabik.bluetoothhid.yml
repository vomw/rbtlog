---
repository: https://github.com/Fabi019/hid-barcode-scanner.git
updates: releases
versions:
  - tag: v2.2.0
    apks:
      - apk_pattern: app-universal-release\.apk
        apk_url: https://github.com/Fabi019/hid-barcode-scanner/releases/download/v2.2.0/app-universal-release.apk
        build:
          - sed -r '/signingConfigs.(debug|release)/d' -i app/build.gradle
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/app-universal-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages:
            - openjdk-11-jdk-headless
          image: debian:bullseye-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
