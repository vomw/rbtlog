        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cached_tools:
            - name: android-ndk
              file_name: android-ndk.zip
              version: 28.2.13676358
              url: https://dl.google.com/android/repository/android-ndk-r28c-linux.zip
