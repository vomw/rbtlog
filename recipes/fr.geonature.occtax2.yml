---
repository: https://github.com/PnX-SI/gn_mobile_occtax.git
updates: releases
notes:
  - build.gradle sets BUILD_DATE at build time, so we need to replace that; see https://github.com/PnX-SI/gn_mobile_occtax/issues/275
versions:
  - tag: 2.7.1
    apks:
      - apk_pattern: occtax-.*\.apk
        apk_url: https://github.com/PnX-SI/gn_mobile_occtax/releases/download/2.7.1/occtax-2.7.1-release.rotate.apk
        build:
          - git reset --soft a2df18b643390014b0427bdbccfe35e101168516
          - sed -r '/signingConfigs.release/d' -i occtax/build.gradle
          - sed -r 's/new Date\(\)\.getTime\(\)/1731849775420/' -i occtax/build.gradle
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - mv occtax/build/outputs/apk/release/occtax-*-release-unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
