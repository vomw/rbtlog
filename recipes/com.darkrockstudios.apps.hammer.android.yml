---
repository: https://github.com/Wavesonics/hammer-editor.git
updates: releases
versions:
  - tag: v1.14.0
    apks:
      - apk_pattern: hammer\.apk
        apk_url: https://github.com/Wavesonics/hammer-editor/releases/download/v1.14.0/hammer.apk
        build:
          - sed -r '/signingConfigs.getByName/d' -i android/build.gradle.kts
          - export RELEASE_STORE_FILE=/dev/null RELEASE_STORE_PASSWORD=RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS=RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD=RELEASE_KEY_PASSWORD
          - ./gradlew :android:assembleRelease
          - find . -name '*.apk'
          - mv android/build/outputs/apk/release/android-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages: []
          image: ubuntu:jammy
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
