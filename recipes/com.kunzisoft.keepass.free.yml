---
repository: https://github.com/Kunzisoft/KeePassDX.git
updates: releases
notes:
  - needs verify_git false due to https://github.com/Kunzisoft/KeePassDX/issues/1333
versions:
  - tag: 4.1.2
    apks:
      - apk_pattern: KeePassDX-.*-free\.apk
        apk_url: https://github.com/Kunzisoft/KeePassDX/releases/download/$$TAG$$/KeePassDX-$$TAG$$-free.apk
        build:
          - git reset --soft 0e31890624b5d5b4d736a58e5cbfd8a05bb67097
          - chmod +x gradlew
          - ./gradlew assembleFreeRelease
          - mv app/build/outputs/apk/free/release/app-free-release-unsigned.apk /outputs/unsigned.apk
        build_home_dir: /home/joker
        build_repo_dir: /home/joker/Projects/KeePassDX
        build_user: build
        provisioning:
          android_home: /home/joker/Softwares/android-sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: ubuntu:jammy
          jdk: openjdk-17-jdk-headless
          ndk: 21.4.7075529
          platform:
          platform_tools:
          tools:
          verify_git: false
          verify_gradle_wrapper: true
