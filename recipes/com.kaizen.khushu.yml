---
repository: https://github.com/greykaizen/khushu.git
updates: releases
versions:
  - tag: v0.24.8
    apks:
      - apk_pattern: app-fdroid-release\.apk
        apk_url: https://github.com/greykaizen/khushu/releases/download/v0.24.8/app-fdroid-release.apk
        build:
          - sed -r '/foojay/d' -i gradle/gradle-daemon-jvm.properties
          - ./gradlew assembleFdroidRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/fdroid/release/app-fdroid-universal-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '20.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
            sha256: 04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7
          extra_packages: []
          image: debian:trixie-slim
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
