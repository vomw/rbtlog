---
repository: https://gitlab.com/sobuu/sobuu.git
updates: releases
notes:
  - v1.3.2 seems to be flaky (suddenly succeeded on another run)
versions:
  - tag: 1.3.1
    apks:
      - apk_pattern: Sobuu-.*\.apk
        apk_url: https://gitlab.com/sobuu/sobuu/-/releases/1.3.1/downloads/Sobuu-1.3.1.apk
        build:
          - sed -r '/signingConfigs.release/d' -i sobuu_androidApp/build.gradle
          - echo -e "KeyStoreAlias=KeyStoreAlias\nKeyStorePass=KeyStorePass\nKeyStoreUserPass=KeyStoreUserPass" > local.properties
          - chmod +x gradlew
          - ./gradlew assembleFdroidRelease
          - find . -name '*.apk'
          - mv sobuu_androidApp/build/outputs/apk/fdroid/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
