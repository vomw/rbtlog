---
repository: https://github.com/tahaak67/Farhan.git
updates: releases
notes:
  - 'FIXME: v0.2.6 needed double-reset, cleanup recipe before building next release'
versions:
  - tag: v0.2.4
    apks:
      - apk_pattern: app-release\.apk
        apk_url: https://github.com/tahaak67/Farhan/releases/download/v0.2.4/app-release.apk
        build:
          - git checkout 8fb243715c9facf8f6ea50d10374239b6ad6e5d8
          - git reset --soft b06977bfb7e01dab3b36762f60128671cab27c3b
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
