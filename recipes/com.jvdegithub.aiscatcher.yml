versions:
  - tag: v2026.06.05-9584683
    apks:
      - apk_pattern: app-release-signed\.apk
        apk_url: https://github.com/jvde-github/AIS-catcher-for-Android/releases/download/v2026.06.05-9584683/app-release-signed.apk
        build:
          - sed -r '/signingConfigs.debug/d' -i app/build.gradle
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/app-release*.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/runner
        build_repo_dir: /home/runner/work/AIS-catcher-for-Android/AIS-catcher-for-Android
        build_timeout:
        build_user: runner
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '20.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
            sha256: 04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7
          extra_packages:
            - build-essential
            - ninja-build
          image: debian:bookworm-slim
