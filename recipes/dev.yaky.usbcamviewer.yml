---
repository: https://gitlab.com/yaky/android-usb-cam-viewer.git
updates: releases
versions:
  - tag: 1.0.0
    apks:
      - apk_pattern: usb_camera_viewer_release\.apk
        apk_url: https://yaky.dev/apps/usb_camera_viewer/usb_camera_viewer_release.apk
        build:
          - git checkout f981c730ad5d929d446028b3e04768eb1e4448e3
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: ubuntu:jammy
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
