---
repository: https://github.com/OMGSoundboard/android-app.git
updates: releases
notes:
  - 'FIXED: v11.0 + v12.0 lacked gradle-wrapper.jar – https://github.com/OMGSoundboard/android-app/issues/6#issuecomment-2303055591'
  - after v12.0 flavors were introduced, switched to the FOSS flavor
versions:
  - tag: v11.0
    apks:
      - apk_pattern: OMGSoundboard_.*\.apk
        apk_url: https://github.com/OMGSoundboard/android-app/releases/download/v11.0/OMGSoundboard_11.apk
        build:
          - wget -q -O /tmp/gradle-8.0-bin.zip -- https://services.gradle.org/distributions/gradle-8.0-bin.zip
          - sha256sum -c <<< '4159b938ec734a8388ce03f52aa8f3c7ed0d31f5438622545de4f83a89b79788  /tmp/gradle-8.0-bin.zip'
          - unzip -q -d /opt /tmp/gradle-8.0-bin.zip
          - export PATH="${PATH}:/opt/gradle-8.0/bin"
          - gradle :app:assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
  - tag: v12.0
    apks:
      - apk_pattern: OMGSoundboard_.*\.apk
        apk_url: https://github.com/OMGSoundboard/android-app/releases/download/v12.0/OMGSoundboard_12.apk
        build:
          - wget -q -O /tmp/gradle-8.7-bin.zip -- https://services.gradle.org/distributions/gradle-8.7-bin.zip
          - sha256sum -c <<< '544c35d6bd849ae8a5ed0bcea39ba677dc40f49df7d1835561582da2009b961d  /tmp/gradle-8.7-bin.zip'
          - unzip -q -d /opt /tmp/gradle-8.7-bin.zip
          - export PATH="${PATH}:/opt/gradle-8.7/bin"
          - gradle :app:assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
  - tag: v15.0
    apks:
      - apk_pattern: OMGSoundboard_Foss_.*\.apk
        apk_url: https://github.com/OMGSoundboard/android-app/releases/download/v15.0/OMGSoundboard_Foss_15.apk
        build:
          - chmod +x gradlew
          - ./gradlew :app:assembleFossRelease
          - mv app/build/outputs/apk/foss/release/OMGSoundboard_Foss*.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
