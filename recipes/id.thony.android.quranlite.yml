---
repository: https://github.com/fathonyfath/quran-lite-android.git
updates: releases
notes:
  - 'FIXME: 1.5.0 was built from non-existing commit; remove the sed-fix with the next release; see https://github.com/fathonyfath/quran-lite-android/issues/8 '
versions:
  - tag: v1.4.0
    apks:
      - apk_pattern: app-release\.apk
        apk_url: https://github.com/fathonyfath/quran-lite-android/releases/download/v1.4.0/app-release.apk
        build:
          - sed -r 's/(\$\{gitSha\(\)\}) \(\$\{buildTime\(\)\}\)/\1 (2024-03-28T12:54Z)/' -i app/build.gradle
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
  - tag: v1.5.0
    apks:
      - apk_pattern: app-release\.apk
        apk_url: https://github.com/fathonyfath/quran-lite-android/releases/download/v1.5.0/app-release.apk
        build:
          - ./gradlew assembleRelease
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
          - OUT=app/build/outputs/apk/release/*unsigned.apk
          - reproducible-apk-tools/inplace-fix.py --internal --zipalign fix-files $OUT 'sed s/bc7e9e7d2b27880fd8a8a85cee7841f8be0b8486/bf034239a0f74ea773a1512ecd916183306e5342/' 'META-INF/version-control-info.textproto'
          - mv $OUT /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
