  - tag: v1.0.10
    apks:
      - apk_pattern: SMS2Email.*release\.apk
        apk_url: https://github.com/SMS2Email/SMS2Email/releases/download/v1.0.10/SMS2Email-v1.0.10-release.apk
        build:
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
