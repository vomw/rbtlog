---
repository: https://github.com/vitorpamplona/amethyst.git
updates: releases
versions:
  - tag: v1.05.1
    apks:
      - apk_pattern: amethyst-fdroid-arm64-v8a.*\.apk
        apk_url: https://github.com/vitorpamplona/amethyst/releases/download/v1.05.1/amethyst-fdroid-arm64-v8a-v1.05.1.apk
        build:
          - sed -r 's/include ".*/include "arm64-v8a"/ ; s/universalApk = true/universalApk = false/' -i amethyst/build.gradle
          - ./gradlew assembleFdroidRelease
          - find . -name '*.apk'
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
          - reproducible-apk-tools/zipalign.py --page-size 16 --pad-like-apksigner --replace amethyst/build/outputs/apk/fdroid/release/amethyst-fdroid-arm64-v8a-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages:
            - python3
          image: debian:trixie-slim
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
  - tag: v1.06.0
    apks:
      - apk_pattern: amethyst-fdroid-arm64-v8a.*\.apk
