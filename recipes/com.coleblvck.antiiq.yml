---
repository: https://codeberg.org/coleblvck/AntiiQ.git
updates: releases
versions:
  - tag: 1.7.0
    apks:
      - apk_pattern: app-arm64-v8a-release\.apk
        apk_url: https://codeberg.org/coleblvck/AntiiQ/releases/download/1.7.0/app-arm64-v8a-release.apk
        build:
          - sed -r '/signingConfigs.release/d' -i android/app/build.gradle
          - FLUTTER_VERSION="$(sed -rn 's/\s*\bflutter:\s\^?([0-9.]+)\s*$/\1/p' pubspec.yaml)"
          - git clone -b $FLUTTER_VERSION https://github.com/flutter/flutter
          - export PUB_CACHE=$(pwd)/.pub-cache
          - flutter/bin/flutter config --no-analytics
          - flutter/bin/flutter pub get
          - flutter/bin/flutter build apk --split-per-abi --target-platform android-arm64 --split-debug-info=debug_symbols
          - find . -name '*.apk'
          - mv build/app/outputs/apk/release/app-arm64-v8a-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/blvck
        build_repo_dir: /home/blvck/flutter_builds/AntiiQ
        build_timeout:
        build_user: blvck
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages:
            - curl
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
