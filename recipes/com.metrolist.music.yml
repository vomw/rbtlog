---
repository: https://github.com/mostafaalagamy/Metrolist.git
updates: releases
notes:
  - v11.6.0 failed RB, see https://github.com/mostafaalagamy/Metrolist/issues/544
  - updates are disabled temporarily also in our repo, as v13.0.0 introduces multiple offending libs (ML Kit & friends), see https://github.com/MetrolistGroup/Metrolist/issues/2774
  - not yet re-enabled, as vor v13.1.1 build fails horribly, see https://github.com/MetrolistGroup/Metrolist/issues/544#issuecomment-3926999755
  - also see https://github.com/MetrolistGroup/Metrolist/issues/2774#issuecomment-3946442608
versions:
  - tag: v10.8.0
    apks:
      - apk_pattern: Metrolist\.apk
        apk_url: https://github.com/mostafaalagamy/Metrolist/releases/download/$$TAG$$/Metrolist.apk
        build:
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
