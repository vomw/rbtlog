---
repository: https://github.com/davidtakac/bura.git
updates: releases
versions:
  - tag: 1.5.1
    apks:
      - apk_pattern: bura-.*\.apk
        apk_url: https://github.com/davidtakac/bura/releases/download/1.5.1/bura-1.5.1.apk
        build:
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
  - tag: 1.6.0
    apks:
      - apk_pattern: bura-.*\.apk
        apk_url: https://github.com/davidtakac/bura/releases/download/1.6.0/bura-1.6.0.apk
        build:
          - ./gradlew assembleRelease
          - git clone -b v0.2.8 https://github.com/obfusk/reproducible-apk-tools.git
          - reproducible-apk-tools/zipalign.py --pad-like-apksigner --replace app/build/outputs/apk/release/*unsigned.apk app/build/outputs/apk/release/app-release-realigned.apk
