---
repository: https://github.com/Turtlepaw/BlueskyRedirect.git
updates: releases
versions:
  - tag: 1.0.0
    apks:
      - apk_pattern: BlueskyRedirect_.*-release-signed\.apk
        apk_url: https://github.com/Turtlepaw/BlueskyRedirect/releases/download/1.0.0/BlueskyRedirect_1.0.0-release-signed.apk
        build:
          - git checkout 236ebfff1f041751b1950cb609a254efa21783f3
          - sed -r '/signingConfigs.getByName/d' -i app/build.gradle.kts
          - ./gradlew :app:packageRelease
          - find . -name '*.apk'
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
          - reproducible-apk-tools/zipalign.py --page-size 16 --pad-like-apksigner --replace app/build/outputs/apk/release/BlueskyRedirect_*-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
  - tag: 1.0.1
    apks:
      - apk_pattern: BlueskyRedirect_.*-release-signed\.apk
        apk_url: https://github.com/Turtlepaw/BlueskyRedirect/releases/download/1.0.1/BlueskyRedirect_1.0.1-release-signed.apk
