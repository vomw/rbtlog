---
repository: https://github.com/mlm-games/flicky.git
updates: releases
versions:
  - tag: 2.3.7
    apks:
      - apk_pattern: flicky.*universal\.apk
        apk_url: https://github.com/mlm-games/flicky/releases/download/2.3.7/flicky-2.3.7-universal.apk
        build:
          - sed -r '/signingConfigs.getByName/d ; /create\("release"\) \{/,/^        \}/d' -i app/build.gradle.kts
          - ./gradlew assembleRelease -PenableApkSplits -PtargetAbi=arm64-v8a
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/flicky-*-universal.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
