---
repository: https://github.com/Animesh-Varma/Sigil.git
updates: releases
versions:
  - tag: v0.4.1
    apks:
      - apk_pattern: Sigil.*signed\.apk
        apk_url: https://github.com/Animesh-Varma/Sigil/releases/download/v0.4.1/Sigil-v0.4.1-signed.apk
        build:
          - git reset --soft 3924962a0aa10ab0cb9bcecccb2e8803f8f31103
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
  - tag: v0.4.5
    apks:
      - apk_pattern: Sigil.*signed\.apk
