---
repository: https://github.com/anilbeesetti/nextplayer.git
updates: releases
versions:
  - tag: v0.11.1
    apks:
      - apk_pattern: nextplayer-.*-universal\.apk
        apk_url: https://github.com/anilbeesetti/nextplayer/releases/download/v0.11.1/nextplayer-v0.11.1-universal.apk
        build:
          - sed -i -e '/isEnable = true/d' app/build.gradle.kts
          - sed -i -e 's/\\\\\././g' feature/player/src/main/AndroidManifest.xml
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
