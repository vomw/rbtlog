---
repository: https://github.com/amnesica/ClearClipboard.git
updates: releases
versions:
  - tag: v1.0.4
    apks:
      - apk_pattern: com.amnesica.clearclipboard_.*-release\.apk
        apk_url: https://github.com/amnesica/ClearClipboard/releases/download/v1.0.4/com.amnesica.clearclipboard_v1.0.4-release.apk
        build:
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
  - tag: v1.0.5
    apks:
      - apk_pattern: com.amnesica.clearclipboard_.*-release\.apk
        apk_url: https://github.com/amnesica/ClearClipboard/releases/download/v1.0.5/com.amnesica.clearclipboard_v1.0.5-release.apk
        build:
          - git reset --soft bb0fb6d1962546788536141048b1c8e33e9447d3
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '22.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
            sha256: 4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
