---
repository: https://github.com/stud0709/OneMoreSecret.git
updates: releases
notes:
  - 'FIXED: v0.32 recipe needed to be adjusted to the embedded commit hash (built before release commit)'
versions:
  - tag: v0.30-alpha
    apks:
      - apk_pattern: app-foss-release\.apk
        apk_url: https://github.com/stud0709/OneMoreSecret/releases/download/v0.30-alpha/app-foss-release.apk
        build:
          - chmod +x gradlew
          - ./gradlew assembleFossRelease
          - mv app/build/outputs/apk/foss/release/app-foss-release-unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
  - tag: v0.32-alpha
    apks:
      - apk_pattern: app-foss-release\.apk
        apk_url: https://github.com/stud0709/OneMoreSecret/releases/download/v0.32-alpha/app-foss-release.apk
        build:
          - git reset --soft a585b33208ab0b8165b107992b97ac2247390fc4
          - chmod +x gradlew
          - ./gradlew assembleFossRelease
          - mv app/build/outputs/apk/foss/release/app-foss-release-unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
