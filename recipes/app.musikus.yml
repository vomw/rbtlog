---
repository: https://github.com/matthiasemde/musikus-android.git
updates: releases
versions:
  - tag: v0.11.1
    apks:
      - apk_pattern: app\.musikus-.*-release\.apk
        apk_url: https://github.com/matthiasemde/musikus-android/releases/download/$$TAG$$/app.musikus-$$TAG$$-release.apk
        build:
          - COMMIT_HASH=$(git rev-parse --short HEAD)
          - sed -i "s/commitHash=.*/commitHash=${COMMIT_HASH:0:7}/" build.properties
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/app.musikus-*-release.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
  - tag: v0.12.0
    apks:
      - apk_pattern: app\.musikus-.*-release\.apk
        apk_url: https://github.com/matthiasemde/musikus-android/releases/download/$$TAG$$/app.musikus-$$TAG$$-release.apk
        build:
          - COMMIT_HASH=$(git rev-parse --short HEAD)
          - sed -i "s/commitHash=.*/commitHash=${COMMIT_HASH:0:7}/" build.properties
          - sed -r '/signingConfigs.getByName/d ; /signingConfigs \{/,/^    \}/d' -i app/build.gradle.kts
          - export ANDROID_NDK=${ANDROID_HOME}/ndk/${PROVISIONING_NDK}
          - echo "ndk.dir=${ANDROID_NDK}" >> local.properties
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/app.musikus-*-release*.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '20.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
            sha256: 04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7
          extra_packages: []
          image: debian:bookworm
          jdk: openjdk-17-jdk-headless
          ndk: 28.2.13676358
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
