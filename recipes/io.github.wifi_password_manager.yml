---
repository: https://github.com/Khh-vu/wifi-password-manager.git
updates: releases
versions:
  - tag: v1.7
    apks:
      - apk_pattern: app-release\.apk
        apk_url: https://github.com/Khh-vu/wifi-password-manager/releases/download/v1.7/app-release.apk
        build:
          - sed -r '/signingConfigs.getByName/d ; /signingConfigs \{/,/^    \}/d' -i app/build.gradle.kts
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/runner
        build_repo_dir: /home/runner/work/wifi-password-manager/wifi-password-manager
        build_timeout:
        build_user: runner
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages: []
          image: debian:trixie-slim
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
