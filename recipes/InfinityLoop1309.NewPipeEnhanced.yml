---
repository: https://github.com/InfinityLoop1308/PipePipe.git
updates: releases
versions:
  - tag: v3.5.1
    apks:
      - apk_pattern: PipePipe_.*-arm64-v8a-release\.apk
        apk_url: https://codeberg.org/NullPointerException/PipePipe/releases/download/v3.5.1/PipePipe_3.5.1-arm64-v8a-release.apk
        build:
          - cd PipePipeClient
          - chmod +x gradlew
          - JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64 ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/PipePipe_3.5.1-arm64-v8a-release-unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - openjdk-11-jdk-headless
          image: debian:bullseye-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
      - apk_pattern: PipePipe_.*-armeabi-v7a-release\.apk
        apk_url: https://codeberg.org/NullPointerException/PipePipe/releases/download/v3.5.1/PipePipe_3.5.1-armeabi-v7a-release.apk
        build:
