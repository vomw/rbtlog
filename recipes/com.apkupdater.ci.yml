---
repository: https://github.com/rumboalla/apkupdater.git
updates: releases
versions:
  - tag: 0.0.591-ci
    apks:
      - apk_pattern: com.apkupdater.ci-release\.apk
        apk_url: https://github.com/rumboalla/apkupdater/releases/download/$$TAG$$/com.apkupdater.ci-release.apk
        build:
          - sed -r '/signingConfigs.getByName/d' -i app/build.gradle.kts
          - sed -r '/config.storeFile/d ; /config.storePassword/d ; /config.keyAlias/d ; /config.keyPassword/d' -i app/build.gradle.kts
          - echo -e "file=/dev/null\npassword=pass\nkeyalias=alias\nkeypassword=pass" >> local.properties
          - export BUILD_TAG=".ci" BUILD_NUMBER="${APP_TAG:4:3}"
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/com.apkupdater.ci-release.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '20.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
            sha256: 04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
