---
repository: https://codeberg.org/epinez/Energize.git
updates: releases
versions:
  - tag: v0.13.3
    apks:
      - apk_pattern: app-arm64-v8a-release\.apk
        apk_url: https://codeberg.org/epinez/Energize/releases/download/v0.13.3/app-arm64-v8a-release.apk
        build:
          - sed -r '/signingConfigs.getByName/d ; /create\("release"\) \{/,/^        \}/d' -i android/app/build.gradle.kts
          - export PUB_CACHE=$(pwd)/.pub-cache
          - base64 -d > .env <<< 
          - submodules/flutter/bin/flutter pub run build_runner build --delete-conflicting-outputs
          - submodules/flutter/bin/flutter build apk --split-per-abi --target-platform="android-arm64"
          - find . -name '*.apk'
          - mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/christian
        build_repo_dir: /home/christian/Development/Codeberg/Energize
        build_timeout:
        build_user: christian
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages:
            - curl
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
