  - tag: v0.13.6
    apks:
      - apk_pattern: app-arm64-v8a-release\.apk
        apk_url: https://codeberg.org/epinez/Energize/releases/download/v0.13.6/app-arm64-v8a-release.apk
        build:
          - export PUB_CACHE=$(pwd)/.pub-cache
          - base64 -d > .env <<< 
          - submodules/flutter/bin/flutter pub get
          - sed -i -e 's/-Wl,/-Wl,--build-id=none,/' ${PUB_CACHE}/hosted/*/jni-*/src/CMakeLists.txt
          - submodules/flutter/bin/dart run build_runner build
          - submodules/flutter/bin/flutter build apk --split-per-abi
          - find . -name '*.apk'
          - mkdir reproducible-apk-tools
          - tar xf "${PROVISIONING_CACHE_REPRO_APK_PATH}" --strip-components=1 -C reproducible-apk-tools/
          - reproducible-apk-tools/zipalign.py --page-size 16 --pad-like-apksigner --replace build/app/outputs/flutter-apk/app-arm64-v8a-release.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /var/runner
        build_repo_dir: /var/runner/epinez/Energize
        build_timeout:
        build_user: runner
        provisioning:
          android_home: /usr/lib/android-sdk
          build_tools:
          cached_tools:
            - name: repro-apk
              file_name: repro-apk.tar.gz
              version: v0.3.0
              url: https://api.github.com/repos/obfusk/reproducible-apk-tools/tarball/v0.3.0
              sha256: b9b595358cae8ed0a5124d452b7902a8434c4105937ba4e5284f6a2d6160b185
          cmake:
          cmdline_tools:
            version: '22.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
            sha256: 4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583
          extra_packages:
            - curl
            - python3
          image: ubuntu:jammy
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
