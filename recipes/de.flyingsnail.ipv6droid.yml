---
repository: https://codeberg.org/Flying-Snail/IPv6Droid.git
updates: tags:([\d.]+)-clone
versions:
  - tag: v3.0.2-clone
    apks:
      - apk_pattern: IPv6Droid-signed\.apk
        apk_url: https://codeberg.org/Flying-Snail/IPv6Droid/releases/download/v3.0.2-clone/IPv6Droid-signed.apk
        build:
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - OUT=IPv6Droid/build/outputs/apk/release/IPv6Droid-release-unsigned.apk
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
          - reproducible-apk-tools/zipalign.py --page-align --pad-like-apksigner --replace "$OUT" /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - python3
          image: ubuntu:jammy
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
