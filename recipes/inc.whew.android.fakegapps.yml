---
repository: https://github.com/whew-inc/FakeGApps.git
updates: releases
notes:
  - 'FIXED: gradle wrapper was broken in 5.0, fixed by upstream for 6.0'
versions:
  - tag: '5.0'
    apks:
      - apk_pattern: app-release\.apk
        apk_url: https://github.com/whew-inc/FakeGApps/releases/download/5.0/app-release.apk
        build:
          - wget -q -O /tmp/gradle-7.5-bin.zip -- https://services.gradle.org/distributions/gradle-7.5-bin.zip
          - sha256sum -c <<< 'cb87f222c5585bd46838ad4db78463a5c5f3d336e5e2b98dc7c0c586527351c2  /tmp/gradle-7.5-bin.zip'
          - unzip -q -d /opt /tmp/gradle-7.5-bin.zip
          - export PATH="${PATH}:/opt/gradle-7.5/bin"
          - gradle assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
  - tag: '6.0'
    apks:
      - apk_pattern: app-release\.apk
        apk_url: https://github.com/whew-inc/FakeGApps/releases/download/6.0/app-release.apk
        build:
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
