---
repository: https://codeberg.org/natkr/flickboard.git
updates: releases
notes:
  - flaky DEX
versions:
  - tag: v0.1.10
    apks:
      - apk_pattern: flickboard-.*\.apk
        apk_url: https://github.com/nightkr/flickboard/releases/download/v0.1.10/flickboard-v0.1.10-plain-release.apk
        build:
          - DEX_FILE=app/build/intermediates/dex/plainRelease/minifyPlainReleaseWithR8/classes.dex
          - DEX_SHA1=c104d24ad0f847aa0468d499900f934a6d025cd6
          - for _ in {1..10}; do
          - ./gradlew clean assemblePlainRelease --no-build-cache --no-configuration-cache --no-daemon
          - if [ "$( sha1sum "$DEX_FILE" | cut -d' ' -f1 )" = "$DEX_SHA1" ]; then
          - break
          - fi
          - done
          - mv app/build/outputs/apk/plain/release/flickboard-*-plain-release-unsigned.apk /outputs/unsigned.apk
        build_cpus: 8
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout: 40
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
