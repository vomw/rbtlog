---
repository: https://github.com/JB-SelfCompany/Tyr.git
updates: releases
notes:
  - contains binaries (app/libs/yggmail.aar)
versions:
  - tag: 1.4.0
    apks:
      - apk_pattern: Tyr.*arm64-v8a\.apk
        apk_url: https://github.com/JB-SelfCompany/Tyr/releases/download/1.4.0/Tyr-1.4.0-arm64-v8a.apk
        build:
          - git reset --soft 678af49f814cdc3f8423f19a700b83afc36ba0f1
          - base64 -d > mani.patch <<< 
          - patch app/src/main/AndroidManifest.xml mani.patch
          - git clone https://codeberg.org/IzzyOnDroid/gradlew.py
          - gradlew.py/gradlew.py --version 9.0-milestone-1 -v assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/Tyr-1.4.0-arm64-v8a.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages:
            - python3
            - patch
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
