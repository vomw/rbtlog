---
repository: https://github.com/bitscoper/bitscoper_cyberkit.git
updates: releases
notes:
  - pre-caching NDK 28.2 to speed up Flutter build
versions:
  - tag: v18.1.3+37
    apks:
      - apk_pattern: Bitscoper_CyberKit-ARM64_V8A-Signed\.apk
        apk_url: https://github.com/bitscoper/bitscoper_cyberkit/releases/download/v18.1.3%2B37/Bitscoper_CyberKit-ARM64_V8A-Signed.apk
        build:
          - sed -r '/signingConfigs.getByName/d ; /signingConfigs \{/,/^    \}/d' -i android/app/build.gradle.kts
          - FLUTTER_VERSION="$(sed -rn 's/^\s*flutter-version:\ \D?([0-9\.]*).*?/\1/p' .github/workflows/"Build, Release, and Deploy.yaml" | head -n 1)"
          - git clone -b $FLUTTER_VERSION https://github.com/flutter/flutter
          - export PUB_CACHE=$(pwd)/.pub-cache
          - flutter/bin/flutter config --no-analytics
          - flutter/bin/flutter pub get
          - sed -i -e 's/-Wl,/-Wl,--build-id=none,/' ${PUB_CACHE}/hosted/*/jni-*/src/CMakeLists.txt
          - flutter/bin/flutter build apk --release --split-per-abi --target-platform=android-arm64
          - find . -name '*.apk'
          - mv build/app/outputs/flutter-apk/*arm64-v8a*.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/runner
        build_repo_dir: /home/runner/work/bitscoper_cyberkit/bitscoper_cyberkit
        build_timeout:
        build_user: runner
        provisioning:
          android_home: /usr/local/lib/android/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '20.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
            sha256: 04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7
          extra_packages:
            - curl
          image: debian:trixie-slim
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
