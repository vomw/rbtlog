        apk_url: https://github.com/danielyrovas/linklater/releases/download/2.0/linklater-release.apk
        build:
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
