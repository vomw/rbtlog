---
repository: https://github.com/dmitrijkotov634/android-notes.git
updates: releases
versions:
  - tag: 1.5.1
    apks:
      - apk_pattern: app-release\.apk
        apk_url: https://github.com/dmitrijkotov634/android-notes/releases/download/$$TAG$$/app-release.apk
        build:
          - git clone https://github.com/obfusk/gradlew.py.git
          - gradlew.py/gradlew.py -v assembleRelease
          - mv app/build/outputs/apk/release/app-release-unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
