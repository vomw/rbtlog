---
repository: https://github.com/cliambrown/PillTime.git
updates: releases
notes:
  - 'FIXED: embedded commit hash mismatch for v4.0 (manually adjusted)'
  - 'FIXED: gradlew checksum error for v7.0, so we had to use our own gradle2; see https://github.com/cliambrown/PillTime/issues/8 for details'
  - 'FIXME: remove JDK-17 again with the next release following v16.0, see https://github.com/cliambrown/PillTime/issues/23#issuecomment-4410051681 '
versions:
  - tag: v4.0
    apks:
      - apk_pattern: pill_time.*\.apk
        apk_url: https://github.com/cliambrown/PillTime/releases/download/v4.0/app-release.apk
        build:
          - git reset --soft 33877e53f2b5cfd4286369ab6b90bff8d31dee57
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
