---
repository: https://github.com/warren-bank/Android-Image-Slideshow-Screensaver.git
updates: releases
versions:
  - tag: v2.1.4
    apks:
      - apk_pattern: Slideshow-Screensaver-.*-withAllLanguageTranslations-release\.apk
        apk_url: https://github.com/warren-bank/Android-Image-Slideshow-Screensaver/releases/download/v2.1.4/Slideshow-Screensaver-002.01.04-17API-withAllLanguageTranslations-release.apk
        build:
          - cd android-studio-project
          - git clone https://github.com/obfusk/gradlew.py.git
          - JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64 gradlew.py/gradlew.py --version 7.6 -v :Slideshow-Screensaver:assemblewithAllLanguageTranslationsRelease
          - mv Slideshow-Screensaver/build/outputs/apk/withAllLanguageTranslations/release/Slideshow-Screensaver-*-withAllLanguageTranslations-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - python3
            - openjdk-11-jdk-headless
          image: debian:bullseye-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
  - tag: v2.1.5
    apks:
      - apk_pattern: Slideshow-Screensaver-.*-withAllLanguageTranslations-release\.apk
        apk_url: https://github.com/warren-bank/Android-Image-Slideshow-Screensaver/releases/download/v2.1.5/Slideshow-Screensaver-002.01.05-17API-withAllLanguageTranslations-release.apk
        build:
          - cd android-studio-project
          - git clone https://github.com/obfusk/gradlew.py.git
          - gradlew.py/gradlew.py --version 8.9 -v :Slideshow-Screensaver:assemblewithAllLanguageTranslationsRelease
          - mv Slideshow-Screensaver/build/outputs/apk/withAllLanguageTranslations/release/Slideshow-Screensaver-*-withAllLanguageTranslations-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
