---
repository: https://github.com/AEFeinstein/mtg-familiar.git
updates: releases
notes:
  - v3.9.11 failed RB, see https://github.com/AEFeinstein/mtg-familiar/issues/626#issuecomment-2439694851
versions:
  - tag: v3.9.10
    apks:
      - apk_pattern: mtgfam.*\.apk
        apk_url: https://github.com/AEFeinstein/mtg-familiar/releases/download/v3.9.10/mtgfam_3.9.10.apk
        build:
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - git clone -b v0.2.8 https://github.com/obfusk/reproducible-apk-tools.git
          - OUT=mobile/build/outputs/apk/release/mobile-release-unsigned.apk
          - reproducible-apk-tools/inplace-fix.py --internal --page-size 16 fix-newlines "$OUT" 'res/_U.html' 'res/op.html'
          - mv "$OUT" /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
