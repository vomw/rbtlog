---
repository: https://github.com/StellarSand/Password-Monitor.git
updates: releases
notes:
  - 'FIXME: v1.0.2 was built from different commit, disabling versionInfo because of F-Droid'
versions:
  - tag: v1.0.1
    apks:
      - apk_pattern: PasswordMonitor_.*\.apk
        apk_url: https://github.com/StellarSand/Password-Monitor/releases/download/v1.0.1/PasswordMonitor_v1.0.1.apk
        build:
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
  - tag: v1.0.2
    apks:
      - apk_pattern: PasswordMonitor_.*\.apk
        apk_url: https://github.com/StellarSand/Password-Monitor/releases/download/v1.0.2/PasswordMonitor_v1.0.2.apk
        build:
          - git checkout ed9eedb480f38f1e6ea0e546b9196ab24921415d
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: ubuntu:jammy
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
