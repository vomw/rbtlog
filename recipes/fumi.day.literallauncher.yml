---
repository: https://github.com/256x/launcher.git
updates: releases
versions:
  - tag: v1.0.8
    apks:
      - apk_pattern: literallauncher.*\.apk
        apk_url: https://github.com/256x/launcher/releases/download/v1.0.8/literallauncher_v1.0.8.apk
        build:
          - git reset --soft 83a5750a8e5b7b4d97de617ba6895a3a540b254d
          - sed -r '/signingConfigs.getByName/d ; /signingConfigs \{/,/^    \}/d' -i app/build.gradle.kts
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '20.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
            sha256: 04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7
          extra_packages: []
          image: debian:trixie-slim
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
  - tag: v1.1.0
    apks:
      - apk_pattern: literallauncher.*\.apk
        apk_url: https://github.com/256x/launcher/releases/download/v1.1.0/literallauncher_v1.1.0.apk
