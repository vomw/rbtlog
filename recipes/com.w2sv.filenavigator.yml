---
repository: https://github.com/w2sv/FileNavigator.git
updates: releases
notes:
  - flaky build
versions:
  - tag: 0.2.3
    apks:
      - apk_pattern: .*\d+\.apk
        apk_url: https://github.com/w2sv/FileNavigator/releases/download/$$TAG$$/$$TAG$$.apk
        build:
          - sed -r '/signingConfigs.getByName/d' -i app/build.gradle.kts
          - chmod +x gradlew
          - DEX_FILE=app/build/intermediates/dex/release/minifyReleaseWithR8/classes.dex
          - DEX_SHA1=95a05dfa8ffcaa10d5e9f562e8f854b7c1049970
          - for _ in {1..10}; do
          - ./gradlew clean assembleRelease --no-build-cache --no-configuration-cache --no-daemon
          - test -f "$DEX_FILE"
          - if [ "$( sha1sum "$DEX_FILE" | cut -d' ' -f1 )" = "$DEX_SHA1" ]; then
          - break
          - fi
          - done
          - mv app/build/outputs/apk/release/*.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout: 40
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
