  - tag: v2.0.3
    apks:
      - apk_pattern: app-arm64-v8a-default-release\.apk
        apk_url: https://github.com/om1cael/Hidroly/releases/download/v2.0.3/app-arm64-v8a-default-release.apk
        build:
          - FLUTTER_VERSION="$(jq -r '.flutter' .fvmrc)"
          - git clone -b $FLUTTER_VERSION https://github.com/flutter/flutter
          - export PUB_CACHE=$(pwd)/.pub-cache
          - flutter/bin/flutter config --no-analytics
          - flutter/bin/flutter pub get
          - JNI_CMAKE=$(find $PUB_CACHE/hosted/pub.dev -path "*/jni-*/src/CMakeLists.txt" | head -n 1)
          - if [ -n "$JNI_CMAKE" ] && [ -f "$JNI_CMAKE" ]; then
          - sed -i '2i add_link_options("LINKER:--build-id=none")' "$JNI_CMAKE"
          - echo "Patched CMakeLists.txt in $JNI_CMAKE"
          - else
          - echo "Error:\ jni CMakeLists.txt not found in expected location."
          - fi
          - flutter/bin/dart run build_runner build --delete-conflicting-outputs
          - flutter/bin/flutter build apk --release --split-per-abi --target-platform="android-arm64" --flavor default
          - find . -name '*.apk'
          - mv build/app/outputs/apk/default/release/app-default-arm64-v8a-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/runner
        build_repo_dir: /home/runner/work/Hidroly/Hidroly
        build_timeout:
        build_user: runner
