---
repository: https://github.com/aghontpi/ad-silence.git
updates: releases
notes:
  - 'FIXME: remove the sed with the next release (which then hopefully will be built from a clean tree, see https://github.com/aghontpi/ad-silence/issues/163)'
versions:
  - tag: v0.6.2
    apks:
      - apk_pattern: Ad-silence-.*\.apk
        apk_url: https://github.com/aghontpi/ad-silence/releases/download/v0.6.2/Ad-silence-v0.6.2.apk
        build:
          - git checkout ed73c04857cb8d92a5b21c07010d137fea59716f
          - sed -r 's/0.6.2-dev/0.6.2-prod/' -i app/build.gradle
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
