---
repository: https://github.com/heddxh/NeoDB-You.git
updates: releases
notes:
  - first sed command matches too much since v1.0.1, but that is fine as it results in just a single APK being built, which is all we want
versions:
  - tag: v1.0
    apks:
      - apk_pattern: NeoDBYou-arm64-v8a.*\.apk
        apk_url: https://github.com/heddxh/NeoDB-You/releases/download/v1.0/NeoDBYou-arm64-v8a-v1.0.apk
        build:
          - sed -r '/signingConfigs.findByName/,/^            \}/d ; /signingConfigs \{/d' -i app/build.gradle.kts
          - echo -e "keyAlias=keyAlias\nkeyPassword=keyPassword\nstoreFile=/dev/null\nstorePassword=storePassword" > keystore.properties
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages: []
          image: ubuntu:jammy
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
