---
repository: https://github.com/warren-bank/Android-PTT-Bluetooth-Speaker.git
updates: releases
versions:
  - tag: v1.1.3
    apks:
      - apk_pattern: PTT-Bluetooth-Speaker-Sender-.*-withAllLanguageTranslations-release\.apk
        apk_url: https://github.com/warren-bank/Android-PTT-Bluetooth-Speaker/releases/download/v1.1.3/PTT-Bluetooth-Speaker-Sender-001.01.03-10API-withAllLanguageTranslations-release.apk
        build:
          - cd android-studio-project
          - git clone https://github.com/obfusk/gradlew.py.git
          - JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64 gradlew.py/gradlew.py --version 7.6 -v :PTT-Bluetooth-Speaker-Sender:assemblewithAllLanguageTranslationsRelease
          - mv PTT-Bluetooth-Speaker-Sender/build/outputs/apk/withAllLanguageTranslations/release/PTT-Bluetooth-Speaker-Sender-*-withAllLanguageTranslations-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - python3
            - openjdk-11-jdk-headless
          image: debian:bullseye-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
