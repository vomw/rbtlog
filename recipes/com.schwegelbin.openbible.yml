---
repository: https://github.com/SchweGELBin/OpenBible2.git
updates: releases
notes:
  - v0.6.0 failed (classes.dex); switch to JDK-21 as indicated by build.gradle gets same results. Not flaky either. https://github.com/SchweGELBin/OpenBible2/issues/14
versions:
  - tag: v0.1.4
    apks:
      - apk_pattern: app-release\.apk
        apk_url: https://github.com/SchweGELBin/OpenBible2/releases/download/v0.1.4/app-release.apk
        build:
          - git reset --soft 9f019463ff4c15f51f6e0885ca2197f6b8443240
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
