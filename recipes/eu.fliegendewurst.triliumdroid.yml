    apks:
      - apk_pattern: app-release\.apk
        apk_url: https://github.com/FliegendeWurst/TriliumDroid/releases/download/$$TAG$$/app-release.apk
        build:
          - git clone https://codeberg.org/IzzyOnDroid/gradlew.py.git
          - PROF_FILE=app/build/intermediates/binary_art_profile/release/compileReleaseArtProfile/baseline.prof
          - PROF_SHA1=03b5ccfdf1584adcfebedcd89f8a77ab9d7347f7
          - for _ in {1..10}; do
          - gradlew.py/gradlew.py -v clean assembleRelease --no-build-cache --no-configuration-cache --no-daemon
          - test -f "$PROF_FILE"
          - if [ "$( sha1sum "$PROF_FILE" | cut -d' ' -f1 )" = "$PROF_SHA1" ]; then
          - break
          - fi
          - done
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
          - reproducible-apk-tools/zipalign.py --pad-like-apksigner --replace app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
