---
repository: https://github.com/FliegendeWurst/TriliumDroid.git
updates: releases
versions:
  - tag: alpha1
    apks:
      - apk_pattern: app-release\.apk
        apk_url: https://github.com/FliegendeWurst/TriliumDroid/releases/download/$$TAG$$/app-release.apk
        build:
          - sed -r 's/"TIMESTAMP", System.currentTimeMillis\(\) \+ "L"/"TIMESTAMP", "1733750284644L"/' -i app/build.gradle
          - git clone https://github.com/obfusk/gradlew.py.git
          - gradlew.py/gradlew.py -v assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
