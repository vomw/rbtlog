---
repository: https://github.com/BinTianqi/OwnDroid.git
updates: releases
notes:
  - v6.3 was built using a different gradle version than specified, requiring us to manually fix kotlin-tooling-metadata.json
versions:
  - tag: v6.1
    apks:
      - apk_pattern: OwnDroid-v[\d\.]+\.apk
        apk_url: https://github.com/BinTianqi/OwnDroid/releases/download/v6.1/OwnDroid-v6.1.apk
        build:
          - sed -r '/signingConfigs.getByName/d' -i app/build.gradle.kts
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: ubuntu:jammy
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
  - tag: v6.2
    apks:
      - apk_pattern: OwnDroid-v[\d\.]+\.apk
        apk_url: https://github.com/BinTianqi/OwnDroid/releases/download/v6.2/OwnDroid-v6.2.apk
