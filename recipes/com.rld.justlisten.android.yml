---
repository: https://github.com/RLD-JL/Just-Listen.git
updates: releases
versions:
  - tag: v1.0.9-a
    apks:
      - apk_pattern: androidApp-release\.apk
        apk_url: https://github.com/RLD-JL/Just-Listen/releases/download/v1.0.9-a/androidApp-release.apk
        build:
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - git clone -b v0.2.8 https://github.com/obfusk/reproducible-apk-tools.git
          - OUT=androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk
          - reproducible-apk-tools/inplace-fix.py --internal --zipalign fix-newlines "$OUT" 'META-INF/services/*'
          - mv "$OUT" /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
  - tag: v2.0.2
    apks:
      - apk_pattern: justlisten-foss-release\.apk
        apk_url: https://github.com/RLD-JL/Just-Listen/releases/download/v2.0.2/justlisten-foss-release.apk
        build:
          - sed -r '/org.gradle.toolchains.foojay-resolver-convention/d' -i settings.gradle.kts
          - sed -r '/(foojay|toolchainVendor|toolchainVersion)/d' -i gradle/gradle-daemon-jvm.properties
          - base64 -d >> local.properties <<< QVVESVVTX0FQSV9LRVk9Mjg2ZTdhZDhmOTQ0N2QwMTEyOTUzYmRiMTY4NGE0YjQxOTJlY2I3Ngo=
          - ./gradlew :androidApp:assembleRelease -PplaystoreBuild=false
          - find . -name '*.apk'
          - mv androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '20.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
            sha256: 04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7
          extra_packages:
            - python3
          image: ubuntu:noble
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
