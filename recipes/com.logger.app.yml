---
repository: https://github.com/Sanmeet007/logger.git
updates: releases
versions:
  - tag: v3.4.2
    apks:
      - apk_pattern: logger-.*\.apk
        apk_url: https://github.com/Sanmeet007/logger/releases/download/v3.4.2/logger-v3.4.2.apk
        build:
          - sed -r '/signingConfigs.release/d ; /signingConfigs \{/,/^    \}/d' -i android/app/build.gradle
          - FLUTTER_VERSION="$(sed -rn 's/^\s*flutter:\s\^?([0-9.]+)\s*$/\1/p' pubspec.yaml)"
          - git clone -b $FLUTTER_VERSION https://github.com/flutter/flutter
          - export PUB_CACHE=$(pwd)/.pub-cache
          - flutter/bin/flutter config --no-analytics
          - flutter/bin/flutter pub get
          - flutter/bin/flutter build apk --release
          - find . -name '*.apk'
          - mv build/app/outputs/flutter-apk/app-release.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /mnt/d/sanmeet007
        build_repo_dir: /mnt/d/sanmeet007/dart/logger-linux-build
        build_timeout:
        build_user: sanmeet007
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages:
            - curl
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
