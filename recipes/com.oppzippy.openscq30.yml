          - RUSTUP_VER="$(grep rustup .build-tool-versions | awk '{print $2}')"
          - RUST_TOOLCHAIN="$(grep -E 'rust\b' .build-tool-versions | awk '{print $2}')"
          - CARGO_VER="$(grep cargo-ndk .build-tool-versions | awk '{print $2}')"
