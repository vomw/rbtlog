---
repository: https://github.com/Oppzippy/OpenSCQ30.git
updates: releases
notes:
  - look for ndkVersion in android/app/build.gradle.kts, JDK in .github/workflows/build.yml, Rust … well, latest tag at time of release
  - since v1.14.1, all relevant versions can be found in .build-tool-versions; rustup, rust toolchain and cargo are auto-picked from there by the build recipe now.
versions:
  - tag: v1.14.0
    apks:
      - apk_pattern: openscq30_android\.apk
        apk_url: https://github.com/Oppzippy/OpenSCQ30/releases/download/v1.14.0/openscq30_android.apk
        build:
          - git clone https://github.com/rust-lang/rustup.git -b 1.27.1
          - export ANDROID_NDK=/opt/sdk/ndk/${PROVISIONING_NDK}
          - ${BUILD_REPO_DIR}/rustup/rustup-init.sh -y --default-toolchain=1.82.0 --target armv7-linux-androideabi --target aarch64-linux-android --target i686-linux-android --target x86_64-linux-android
          - source $HOME/.cargo/env
          - cargo install cargo-ndk
          - cd android
          - ./gradlew assembleBluetoothRelease
          - mv app/build/outputs/apk/bluetooth/release/app-bluetooth-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/runner
        build_repo_dir: /home/runner/work/OpenSCQ30/OpenSCQ30
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - make
            - g++
            - cmake
            - protobuf-compiler
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk: 27.2.12479018
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
  - tag: v1.14.1
