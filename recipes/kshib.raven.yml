---
repository: https://github.com/ksh-b/raven.git
updates: releases
versions:
  - tag: v0.14.0
    apks:
      - apk_pattern: app-arm64-v8a-release\.apk
        apk_url: https://github.com/ksh-b/raven/releases/download/v0.14.0/app-arm64-v8a-release.apk
        build:
          - sed -r '/signingConfigs.release/d' -i android/app/build.gradle
          - export PUB_CACHE=${PWD}/.pub-cache
          - submodules/flutter/bin/flutter config --no-analytics
          - submodules/flutter/bin/flutter pub get
          - submodules/flutter/bin/flutter build apk --split-per-abi --target-platform=android-arm64
          - mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk /outputs/unsigned.apk
        build_home_dir: /home/kshib
        build_repo_dir: /home/kshib/build/raven
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - curl
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
