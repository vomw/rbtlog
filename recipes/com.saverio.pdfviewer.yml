---
repository: https://github.com/Sav22999/sav-pdf-viewer-pro.git
updates: releases
versions:
  - tag: '2.0'
    apks:
      - apk_pattern: SavPDFViewer.*\.apk
        apk_url: https://github.com/Sav22999/sav-pdf-viewer-pro/releases/download/2.0/SavPDFViewer-2.0.apk
        build:
          - git reset --soft f55065b868bd63a4ff084e10abe5f84156dbc546
          - sed -r '/org.gradle.java.home=/d' -i gradle.properties
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '20.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
            sha256: 04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
