---
repository: https://github.com/alesimula/Murine-launcher.git
updates: releases
versions:
  - tag: v0.9
    apks:
      - apk_pattern: Murine-launcher\.apk
        apk_url: https://github.com/alesimula/Murine-launcher/releases/download/v0.9/Murine-launcher.apk
        build:
          - git clone https://codeberg.org/IzzyOnDroid/gradlew.py
          - gradlew.py/gradlew.py -v assembleAospWithoutQuickstepRelease
          - find . -name '*.apk'
          - mv build/outputs/apk/aospWithoutQuickstep/release/app_murinelauncher-aosp-withoutQuickstep-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/build/app_murinelauncher
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '20.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
            sha256: 04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7
          extra_packages:
            - python3
          image: debian:trixie-slim
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
