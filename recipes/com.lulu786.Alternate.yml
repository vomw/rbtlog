---
repository: https://github.com/BioHazard786/Alternate.git
updates: releases
labels:
  - expo
notes:
  - https://gitlab.com/IzzyOnDroid/repo/-/issues/782
versions:
  - tag: v1.1.0
    apks:
      - apk_pattern: alternate-arm64-v8a-.*\.apk
        apk_url: https://github.com/BioHazard786/Alternate/releases/download/v1.1.0/alternate-arm64-v8a-v1.1.0.apk
        build:
          - sed -r '/signingConfigs.(debug|release)/d ; s/include ".*/include "arm64-v8a"/' -i android/app/build.gradle
          - wget -q -O /tmp/nodejs-lts.zip -- https://nodejs.org/dist/v22.14.0/node-v22.14.0-linux-x64.tar.xz
          - sha256sum -c <<< '69b09dba5c8dcb05c4e4273a4340db1005abeafe3927efda2bc5b249e80437ec  /tmp/nodejs-lts.zip'
          - tar xf /tmp/nodejs-lts.zip -C /opt
          - export PATH="${PATH}:/opt/node-v22.14.0-linux-x64/bin:${HOME}/.node/bin"
          - npm config set prefix "${HOME}/.node"
          - npm ci
          - sed -r '/signingConfigs.debug/d' -i android/app/build.gradle
          - sed -r '/version/ { s/"[0-9.]+"/"'"${APP_TAG:1}"'"/ }' -i package.json
          - cd android && chmod +x gradlew && ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/runner
        build_repo_dir: /home/runner/work/Alternate/Alternate
        build_timeout: 40
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - xz-utils
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
