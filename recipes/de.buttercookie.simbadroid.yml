---
repository: https://github.com/buttercookie42/SimbaDroid.git
updates: releases
notes:
  - build is flaky
versions:
  - tag: '0.3'
    apks:
      - apk_pattern: de.buttercookie.simbadroid.*\.apk
        apk_url: https://github.com/buttercookie42/SimbaDroid/releases/download/0.3/de.buttercookie.simbadroid-0.3.apk
        build:
          - rm -rf .git
          - chmod +x gradlew
          - PROF_FILE=app/build/intermediates/binary_art_profile/release/compileReleaseArtProfile/baseline.prof
          - PROF_SHA1=f83f38feefdba3debc2aab3e9bd14e79ca053fdd
          - for _ in {1..10}; do
          - ./gradlew clean assembleRelease --no-build-cache --no-configuration-cache --no-daemon
          - test -f "$PROF_FILE"
          - if [ "$( sha1sum "$PROF_FILE" | cut -d' ' -f1 )" = "$PROF_SHA1" ]; then
          - break
          - fi
          - done
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
          - OUT=app/build/outputs/apk/release/de.buttercookie.simbadroid-*-release-unsigned.apk
          - reproducible-apk-tools/inplace-fix.py --internal --page-size 4 fix-newlines $OUT 'META-INF/services/*'
          - mv $OUT /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
