---
repository: https://github.com/pr3y/BruceApp.git
updates: releases
versions:
  - tag: v0.3
    apks:
      - apk_pattern: composeApp-release\.apk
        apk_url: https://github.com/pr3y/BruceApp/releases/download/v0.3/composeApp-release.apk
        build:
          - sed -r '/signingConfigs.getByName/d ; /create\("release"\) \{/,/^        \}/d' -i composeApp/build.gradle.kts
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv composeApp/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages: []
          image: ubuntu:jammy
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
