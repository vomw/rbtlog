---
repository: https://github.com/warren-bank/Android-Bonjour-WebRTC.git
updates: releases
notes:
  - the project’s gradle setup is broken, so we have to inject a proper gradle ourselves
versions:
  - tag: v01.04.00
    apks:
      - apk_pattern: Bonjour-WebRTC-.*-withAllLanguageTranslations-arm64-v8a-release\.apk
        apk_url: https://github.com/warren-bank/Android-Bonjour-WebRTC/releases/download/v01.04.00/Bonjour-WebRTC-001.04.00-21API-withAllLanguageTranslations-arm64-v8a-release.apk
        build:
          - cd android-studio-project
          - git clone https://github.com/obfusk/gradlew.py.git
          - gradlew.py/gradlew.py --version 7.6.4 -v assembleWithAllLanguageTranslationsRelease
          - mv Bonjour-WebRTC/build/outputs/apk/withAllLanguageTranslations/release/Bonjour-WebRTC-*-withAllLanguageTranslations-arm64-v8a-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
