---
repository: https://github.com/sosauce/CuteMusic.git
updates: releases
notes:
  - 'FIXED: embedded commit hash mismatch for v1.3.0 (manually adjusted)'
  - 'FIXED: embedded commit hash mismatch for v1.4.0 (manual adjustment does not help)'
  - 'FIXED: embedded commit hash mismatch for v1.4.1 (manual adjustment does not help) – https://github.com/sosauce/CuteMusic/issues/23'
  - 'FIXED: rebuild after "clean" in Android Studio solved it in v1.4.2'
versions:
  - tag: v1.3.0
    apks:
      - apk_pattern: CuteMusic_.*\.apk
        apk_url: https://github.com/sosauce/CuteMusic/releases/download/v1.3.0/CuteMusic_v1.3.0.apk
        build:
          - git reset --soft 4415338c026ce18e901be89c02fe48747a801eaf
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
