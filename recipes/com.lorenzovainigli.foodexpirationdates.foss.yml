---
repository: https://github.com/lorenzovngl/FoodExpirationDates.git
updates: releases
versions:
  - tag: v2.4.2
    apks:
      - apk_pattern: FoodExpirationDates-.*-foss\.apk
        apk_url: https://github.com/lorenzovngl/FoodExpirationDates/releases/download/v2.4.2/FoodExpirationDates-2.4.2-foss.apk
        build:
          - git reset --soft 7ee7fcc17c71aca6eb5a570ac9eb1457436fb5a8
          - chmod +x gradlew
          - PROF_FILE=app/build/intermediates/binary_art_profile/fossRelease/compileFossReleaseArtProfile/baseline.prof
          - PROF_SHA1=a0013727ca3a41fa6bb2195baddf26c0a5411456
          - for _ in {1..10}; do
          - ./gradlew clean build -PbuildFoss=true --no-build-cache --no-configuration-cache --no-daemon
          - if [ "$( sha1sum "$PROF_FILE" | cut -d' ' -f1 )" = "$PROF_SHA1" ]; then
          - break
          - fi
          - done
          - git clone -b v0.2.8 https://github.com/obfusk/reproducible-apk-tools.git
          - OUT=app/build/outputs/apk/foss/release/FoodExpirationDates-*-foss-release-unsigned.apk
          - reproducible-apk-tools/inplace-fix.py --internal --zipalign fix-newlines $OUT 'META-INF/services/*'
          - mv $OUT /outputs/unsigned.apk
        build_timeout: 50
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
