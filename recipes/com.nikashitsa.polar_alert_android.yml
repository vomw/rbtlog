---
repository: https://github.com/nikashitsa/polar-alert-android.git
updates: releases
notes:
  - 'FIXME: versionCode is set via GITHUB_RUN_NUMBER variable, which we cannot reproduce (but have to set manually), see https://github.com/nikashitsa/polar-alert-android/blob/v1.0.3/app/build.gradle#L15'
  - issue opened upstream at https://github.com/nikashitsa/polar-alert-android/issues/1 (should be solved with the next release, so we can remove the variable then)
versions:
  - tag: v1.0.3
    apks:
      - apk_pattern: app-release\.apk
        apk_url: https://github.com/nikashitsa/polar-alert-android/releases/download/v1.0.3/app-release.apk
        build:
          - export GITHUB_RUN_NUMBER=29
          - sed -r '/signingConfigs.release/d' -i app/build.gradle
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
