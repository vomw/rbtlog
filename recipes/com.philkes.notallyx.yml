---
repository: https://github.com/PhilKes/NotallyX.git
updates: releases
notes:
  - in v6.0 author put the wrong checksum into gradle-wrapper.properties, see https://github.com/PhilKes/NotallyX/issues/71
versions:
  - tag: v6.0
    apks:
      - apk_pattern: NotallyX-.*\.apk
        apk_url: https://github.com/PhilKes/NotallyX/releases/download/v6.0/NotallyX-6.0.apk
        build:
          - sed -r 's/258e722ec21e955201e31447b0aed14201765a3bfbae296a46cf60b70e66db70/d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab/' -i gradle/wrapper/gradle-wrapper.properties
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
  - tag: v6.1.1
    apks:
      - apk_pattern: NotallyX-.*\.apk
        apk_url: https://github.com/PhilKes/NotallyX/releases/download/v6.1.1/NotallyX-6.1.1.apk
        build:
          - sed -r '/signingConfigs.release/d' -i app/build.gradle
          - chmod +x gradlew
          - ./gradlew assembleRelease -PRELEASE_STORE_FILE=/dev/null -PRELEASE_STORE_PASSWORD=storePass -PRELEASE_KEY_ALIAS=keyAlias -PRELEASE_KEY_PASSWORD=keyPass
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
