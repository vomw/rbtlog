---
repository: https://github.com/Turtlepaw/nearby_settings.git
updates: releases
versions:
  - tag: v1.0.3
    apks:
      - apk_pattern: mobile\.apk
        apk_url: https://github.com/Turtlepaw/nearby_settings/releases/download/v1.0.3/mobile.apk
        build:
          - cd mobile
          - sed -r '/signingConfigs.release/d' -i android/app/build.gradle
          - FLUTTER_VERSION="3.29.3"
          - git clone -b $FLUTTER_VERSION https://github.com/flutter/flutter
          - export PUB_CACHE=$(pwd)/.pub-cache
          - flutter/bin/flutter config --no-analytics
          - flutter/bin/flutter pub get
          - flutter/bin/flutter build apk --release
          - mv build/app/outputs/flutter-apk/app-release.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/runner
        build_repo_dir: /home/runner/work/nearby_settings/nearby_settings
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - curl
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
