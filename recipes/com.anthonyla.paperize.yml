---
repository: https://github.com/Anthonyy232/Paperize.git
updates: releases
notes:
  - 'FIXED: build flaky, retry if RB fails (and only baseline.prof differs, which it should not if classes.dex does not)'
  - 'FIXED: 2.2.0 failed with differences in .so files – fixed by specifying the NDK defined in buid.gradle.kts explicilty with the recipe.'
  - v3.0.0 was built with different gradle version (8.14) than specified in the wrapper (8.14.2)
versions:
  - tag: v1.6.3
    apks:
      - apk_pattern: paperize-.*\.apk
        apk_url: https://github.com/Anthonyy232/Paperize/releases/download/v1.6.3/paperize-v1.6.3.apk
        build:
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - git clone -b v0.2.8 https://github.com/obfusk/reproducible-apk-tools.git
          - OUT=app/build/outputs/apk/release/app-release-unsigned.apk
          - reproducible-apk-tools/inplace-fix.py --internal --page-size 16 fix-newlines "$OUT" 'META-INF/services/*'
          - mv "$OUT" /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
