---
repository: https://github.com/flashsphere/private-dns-qs.git
updates: releases
versions:
  - tag: v1.39
    apks:
      - apk_pattern: PrivateDnsQS.*nolauncher-release\.apk
        apk_url: https://github.com/flashsphere/private-dns-qs/releases/download/v1.39/PrivateDnsQS-v1.39-nolauncher-release.apk
        build:
          - sed -r '/signingConfigs\[/d ; /signingConfigs \{/,/^    \}/d' -i app/build.gradle.kts
          - export ANDROID_NDK=${ANDROID_HOME}/ndk/${PROVISIONING_NDK}
          - echo "ndk.dir=${ANDROID_NDK}" >> local.properties
          - ./gradlew assembleNolauncherRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/nolauncher/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '20.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
            sha256: 04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7
          extra_packages: []
          image: debian:trixie-slim
          jdk: openjdk-21-jdk-headless
          ndk: 28.2.13676358
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
