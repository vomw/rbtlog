---
repository: https://github.com/NeatCode-Labs/fixupxer.git
updates: releases
versions:
  - tag: v1.4.6
    apks:
      - apk_pattern: FixupXer.*release\.apk
        apk_url: https://github.com/NeatCode-Labs/fixupxer/releases/download/v1.4.6/FixupXer-v1.4.6-release.apk
        build:
          - sed -r '/signingConfigs.getByName/d ; /create\("release"\) \{/,/^        \}/d' -i app/build.gradle.kts
          - sed -i -e '/org.gradle.java.home/d' gradle.properties
          - sed -i -e '/jetbrains/d' settings.gradle.kts
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
  - tag: v1.4.7
    apks:
      - apk_pattern: FixupXer.*release\.apk
        apk_url: https://github.com/NeatCode-Labs/fixupxer/releases/download/v1.4.7/FixupXer-v1.4.7-release.apk
        build:
          - sed -r '/signingConfigs.getByName/d ; /create\("release"\) \{/,/^        \}/d' -i app/build.gradle.kts
          - sed -i -e '/org.gradle.java.home/d' gradle.properties
          - sed -i -e '/jetbrains/d' settings.gradle.kts
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - OUT=app/build/outputs/apk/release/*unsigned.apk
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
          - reproducible-apk-tools/inplace-fix.py --zipalign fix-newlines $OUT 'META-INF/services/*'
          - mv $OUT /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '20.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
            sha256: 04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
