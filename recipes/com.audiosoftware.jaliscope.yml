---
repository: https://codeberg.org/CalibratedMind/Jaliscope.git
updates: releases
versions:
  - tag: release-1.0.5v
    apks:
      - apk_pattern: Jaliscope\.apk
        apk_url: https://codeberg.org/CalibratedMind/Jaliscope/releases/download/release-1.0.5v/Jaliscope.apk
        build:
          - cd Android
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provision_timeout: 15
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '22.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
            sha256: 4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
