---
repository: https://github.com/warren-bank/Android-ExoPlayer-AirPlay-Receiver.git
updates: releases
versions:
  - tag: v3.4.7
    apks:
      - apk_pattern: .*withAllLanguageTranslations-noDecoderExtensions-release\.apk
        apk_url: https://github.com/warren-bank/Android-ExoPlayer-AirPlay-Receiver/releases/download/$$TAG$$/ExoPlayer-AirPlay-Receiver-003.04.07-16API-withAllLanguageTranslations-noDecoderExtensions-release.apk
        build:
          - cd android-studio-project
          - git clone https://github.com/obfusk/gradlew.py.git
          - JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64 gradlew.py/gradlew.py --version 7.6.4 -v assembleWithAllLanguageTranslationsNoDecoderExtensionsRelease
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
          - OUT=ExoPlayer-AirPlay-Receiver/build/outputs/apk/withAllLanguageTranslationsNoDecoderExtensions/release/ExoPlayer-AirPlay-Receiver-*-withAllLanguageTranslations-noDecoderExtensions-release-unsigned.apk
          - reproducible-apk-tools/inplace-fix.py --internal --page-size 4 fix-newlines $OUT 'META-INF/services/*'
          - mv $OUT /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - openjdk-11-jdk-headless
            - python3
          image: debian:bullseye-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
