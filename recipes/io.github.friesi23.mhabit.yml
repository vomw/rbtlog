---
repository: https://github.com/FriesI23/mhabit.git
updates: releases
versions:
  - tag: v1.15.4+62
    apks:
      - apk_pattern: app-arm64-v8a-release\.apk
        apk_url: https://github.com/FriesI23/mhabit/releases/download/v1.15.4%2B62/app-arm64-v8a-release.apk
        build:
          - sed -r '/signingConfig /d' -i android/app/build.gradle
          - export PUB_CACHE=$(pwd)/.pub-cache
          - .flutter/bin/flutter config --no-analytics
          - .flutter/bin/flutter pub get
          - .flutter/bin/flutter build apk --release --split-per-abi --target-platform="android-arm64"
          - mv build/app/outputs/apk/release/app-arm64-v8a-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/runner
        build_repo_dir: /home/runner/work/mhabit/mhabit
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - curl
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
  - tag: v1.15.8+66
    apks:
      - apk_pattern: app-arm64-v8a-release\.apk
