---
repository: https://github.com/rafareborn/biometric-bypass.git
updates: releases
versions:
  - tag: v1.0.0
    apks:
      - apk_pattern: app-release\.apk
        apk_url: https://github.com/rafareborn/biometric-bypass/releases/download/v1.0.0/app-release.apk
        build:
          - git reset --soft 49808ca54035f2545b6440706640ad3928d9a115
          - pushd libxposed/api
          - ./gradlew publishToMavenLocal --no-daemon
          - popd
          - pushd libxposed/service
          - ./gradlew publishToMavenLocal --no-daemon
          - popd
          - sed -r '/signingConfigs.getByName/d' -i app/build.gradle.kts
          - sed -r '/create\("release"\) \{/,/\}/d' -i app/build.gradle.kts
          - JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64 ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/app-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - openjdk-17-jdk-headless
          image: ubuntu:jammy
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
