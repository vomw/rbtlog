          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
  - tag: v0.5.0
    apks:
      - apk_pattern: (?i:bazarnote)\.apk
        apk_url: https://codeberg.org/rootminusone8004/Bazarnote/releases/download/v0.5.0/Bazarnote.apk
        build:
          - wget -q -O /tmp/gradle-8.9-bin.zip -- https://services.gradle.org/distributions/gradle-8.9-bin.zip
