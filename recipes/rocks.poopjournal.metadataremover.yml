---
repository: https://github.com/Crazy-Marvin/MetadataRemover.git
updates: manual
notes:
  - disabling updates as app size jumped from 10 to 160 MB and thus the app was removed from IoD
versions:
  - tag: v2.0.2
    apks:
      - apk_pattern: MetadataRemover.*\.apk
        apk_url: https://github.com/Crazy-Marvin/MetadataRemover/releases/download/v2.0.2/MetadataRemover20020.apk
        build:
          - sed -r '/signingConfig = releaseSigning/d' -i app/build.gradle.kts
          - echo "keystore.password=pass" > secret/secret.properties
          - echo "keystore.alias.googleplay.name=alias" >> secret/secret.properties
          - echo "keystore.alias.googleplay.password=pass" >> secret/secret.properties
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
