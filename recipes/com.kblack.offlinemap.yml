---
repository: https://github.com/khoa083/map-offline-navigation.git
updates: releases
versions:
  - tag: v1.0.0-1000003
    apks:
      - apk_pattern: v[\d\-.]+\.apk
        apk_url: https://github.com/khoa083/map-offline-navigation/releases/download/v1.0.0-1000003/v1.0.0-1000003.apk
        build:
          - git reset --soft 8c138d49c3d83068a3f092684b23bce439b6d8ea
          - sed -r '/signingConfigs.getByName/d ; /signingConfigs \{/,/^    \}/d' -i app/build.gradle.kts
          - sed -r '/foojay/d' -i gradle/gradle-daemon-jvm.properties
          - export ANDROID_NDK=${ANDROID_HOME}/ndk/${PROVISIONING_NDK}
          - echo "ndk.dir=${ANDROID_NDK}" >> local.properties
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '20.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
            sha256: 04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7
          extra_packages: []
          image: debian:trixie-slim
          jdk: openjdk-21-jdk-headless
          ndk: 28.2.13676358
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
