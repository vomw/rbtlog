---
repository: https://github.com/mburgosfr-star/kelani-sbd-tracker.git
updates: releases
versions:
  - tag: v2.0.0
    apks:
      - apk_pattern: kelani-sbd-tracker.*\.apk
        apk_url: https://github.com/mburgosfr-star/kelani-sbd-tracker/releases/download/v2.0.0/kelani-sbd-tracker-v2.0.0.apk
        build:
          - tar xf "${PROVISIONING_CACHE_NODEJS_LTS_PATH}" -C /opt
          - export PATH="${PATH}:/opt/node-${PROVISIONING_CACHE_NODEJS_LTS_VERSION}-linux-x64/bin:${HOME}/.node/bin"
          - export GRADLE_USER_HOME=/opt/gradle
          - npm install
          - export REACT_APP_VERSION="$(node -p "require('./package.json').version")"
          - npm run build
          - npx cap sync android
          - cd android
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/app-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cached_tools:
            - name: nodejs-lts
              file_name: nodejs-lts.tar.xz
              version: v24.18.0
              url: https://nodejs.org/dist/v24.18.0/node-v24.18.0-linux-x64.tar.xz
              sha256: 55aa7153f9d88f28d765fcdad5ae6945b5c0f98a36881703817e4c450fa76742
          cmake:
          cmdline_tools:
            version: '22.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
            sha256: 4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583
          extra_packages:
            - xz-utils
          image: ubuntu:jammy
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
