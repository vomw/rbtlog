---
repository: https://github.com/scheibler/TactileClock.git
updates: releases
versions:
  - tag: v2.3.0
    apks:
      - apk_pattern: TactileClock.*\.apk
        apk_url: https://github.com/scheibler/TactileClock/releases/download/v2.3.0/TactileClock_v2.3.0.apk
        build:
          - chmod +x gradlew
          - echo "storePassword=password" > app/empty.keystore
          - echo "keyAlias=alias" >> app/empty.keystore
          - echo "keyPassword=password" >> app/empty.keystore
          - echo "storeFile=/dev/null" >> app/empty.keystore
          - sed -r '/signingConfigs.release/d' -i app/build.gradle
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
