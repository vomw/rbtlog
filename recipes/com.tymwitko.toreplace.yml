---
repository: https://github.com/tymwitko/ToReplace.git
updates: releases
notes:
  - gradle issue with wrong distributionHash should hopefully be solved with the next release, same for Foojay; https://codeberg.org/IzzyOnDroid/repodata/issues/717#issuecomment-25565498
versions:
  - tag: v1.0.1
    apks:
      - apk_pattern: app-release\.apk
        apk_url: https://github.com/tymwitko/ToReplace/releases/download/v1.0.1/app-release.apk
        build:
          - sed -ri '/org.gradle.toolchains.foojay-resolver-convention/d' settings.gradle.kts
          - sed -ri '/foojay/d ; /toolchainVendor/d' gradle/gradle-daemon-jvm.properties
          - git clone https://codeberg.org/IzzyOnDroid/gradlew.py
          - gradlew.py/gradlew.py --version 9.6.1 -v assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '22.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
            sha256: 4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583
          extra_packages:
            - python3
          image: ubuntu:noble
          jdk: openjdk-25-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
