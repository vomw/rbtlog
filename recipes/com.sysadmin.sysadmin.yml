---
repository: https://github.com/prathameshkhade/SysAdmin.git
updates: releases
notes:
  - v1.0.29 has crazy versionCode calculation which will hopefully be fixed with the next release, see https://github.com/prathameshkhade/SysAdmin/issues/12
  - 'FIXME: recipe update needed with next release, see https://github.com/prathameshkhade/SysAdmin/issues/12#issuecomment-2911074277 and compare with https://github.com/prathameshkhade/SysAdmin/blob/dev/.github/workflows/main.yml '
versions:
  - tag: v1.0.28
    apks:
      - apk_pattern: SysAdmin-.*-arm64-v8a\.apk
        apk_url: https://github.com/prathameshkhade/SysAdmin/releases/download/v1.0.28/SysAdmin-v1.0.28-arm64-v8a.apk
        build:
          - sed -r '/signingConfigs.release/d' -i android/app/build.gradle
          - FLUTTER_VERSION="$(sed -rn 's/^\s*flutter-version:\ .([0-9\.]*).*?/\1/p' .github/workflows/main.yml | head -n 1)"
          - git clone -b $FLUTTER_VERSION https://github.com/flutter/flutter
          - export PUB_CACHE=$(pwd)/.pub-cache
          - flutter/bin/flutter config --no-analytics
          - flutter/bin/flutter pub get
          - flutter/bin/flutter build apk --release --split-per-abi --target-platform=android-arm64 --build-name=${APP_TAG:1}
          - mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/runner
        build_repo_dir: /home/runner/work/SysAdmin/SysAdmin
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - curl
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
  - tag: v1.0.29
    apks:
      - apk_pattern: SysAdmin-.*-arm64-v8a\.apk
        apk_url: https://github.com/prathameshkhade/SysAdmin/releases/download/v1.0.29/SysAdmin-v1.0.29-arm64-v8a.apk
        build:
          - sed -r '/signingConfigs.release/d' -i android/app/build.gradle
          - VERSION_CODE="$(( $(echo ${APP_TAG} | sed -r 's/.*\..*\.(.*)/\1/') + 13))"
          - FLUTTER_VERSION="$(sed -rn 's/^\s*flutter-version:\ .([0-9\.]*).*?/\1/p' .github/workflows/main.yml | head -n 1)"
          - git clone -b $FLUTTER_VERSION https://github.com/flutter/flutter
          - export PUB_CACHE=$(pwd)/.pub-cache
          - flutter/bin/flutter config --no-analytics
          - flutter/bin/flutter pub get
          - flutter/bin/flutter build apk --release --split-per-abi --target-platform=android-arm64 --build-name=${APP_TAG:1} --build-number=${VERSION_CODE}
          - mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/runner
        build_repo_dir: /home/runner/work/SysAdmin/SysAdmin
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - curl
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
