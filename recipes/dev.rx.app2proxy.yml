---
repository: https://github.com/RiddlerXenon/app2proxy.git
updates: releases
versions:
  - tag: v1.0.1
    apks:
      - apk_pattern: app-release\.apk
        apk_url: https://github.com/RiddlerXenon/app2proxy/releases/download/v1.0.1/app-release.apk
        build:
          - git reset --soft 24cf04b2d400597b7f0bf2945094744f211e1208
          - sed -r '/signingConfigs.release/d' -i app/build.gradle
          - git clone https://codeberg.org/IzzyOnDroid/gradlew.py.git
          - gradlew.py/gradlew.py -v assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
  - tag: v1.0.2
