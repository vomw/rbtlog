---
repository: https://github.com/AlfaazPlus/QuranApp.git
updates: releases
versions:
  - tag: 2025.02.12.1
    apks:
      - apk_pattern: .*release\.apk
        apk_url: https://github.com/AlfaazPlus/QuranApp/releases/download/$$TAG$$/$$TAG$$-release.apk
        build:
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
          - OUT=app/build/outputs/apk/release/*release-unsigned.apk
          - reproducible-apk-tools/inplace-fix.py --internal --zipalign fix-newlines $OUT 'META-INF/services/*' 'assets/chapter_info/*' 'assets/prebuilt_translations/en_the_clear_quran/en_the_clear_quran.json' 'assets/prebuilt_translations/ur_junagarhi/ur_junagarhi.json' 'assets/quran_meta.json' 'assets/science/*.json' 'assets/science/*.js' 'assets/science/*.css' 'assets/science/topics/botany.html' 'assets/scripts/script_indopak.json' 'assets/scripts/script_noorehuda.json' 'assets/tafsir/*' 'assets/verses/type*/*' 'assets/verses/type*/*/*'
          - mv $OUT /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
