---
repository: https://github.com/Xposed-Modules-Repo/com.github.dan.nostoragerestrict.git
updates: releases
versions:
  - tag: 6-0.6.0
    apks:
      - apk_pattern: app-release\.apk
        apk_url: https://github.com/Xposed-Modules-Repo/com.github.dan.nostoragerestrict/releases/download/6-0.6.0/app-release.apk
        build:
          - git checkout e52c01deb764531cd31e568398efd8a674d5cd1b
          - git clone https://codeberg.org/IzzyOnDroid/gradlew.py
          - gradlew.py/gradlew.py -v assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '20.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
            sha256: 04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7
          extra_packages:
            - python3
          image: ubuntu:jammy
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
  - tag: 7-0.7.0
