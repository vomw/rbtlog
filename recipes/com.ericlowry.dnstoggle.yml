---
repository: https://github.com/ELowry/DNSToggle.git
updates: releases
versions:
  - tag: v1.4.1
    apks:
      - apk_pattern: dns_toggle_v.*\.apk
        apk_url: https://github.com/ELowry/DNSToggle/releases/download/v1.4.1/dns_toggle_v1.4.1.apk
        build:
          - sed -r '/foojay/d' -i gradle/gradle-daemon-jvm.properties
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '20.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
            sha256: 04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7
          extra_packages: []
          image: ubuntu:jammy
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
