---
repository: https://github.com/ReneArentz/net.forestany.mediacollection.git
updates: releases
versions:
  - tag: Media_Collection_1.0.0
    apks:
      - apk_pattern: Media_Collection.*\.apk
        apk_url: https://github.com/ReneArentz/net.forestany.mediacollection/releases/download/Media_Collection_1.0.0/Media_Collection_1.0.0.apk
        build:
          - git checkout ebab72c0f5c0544887848d2a7d10daec93183b44
          - rm -rf .git
          - sed -r '/signingConfigs.getByName/d' -i app/build.gradle.kts
          - git clone https://codeberg.org/IzzyOnDroid/gradlew.py
          - gradlew.py/gradlew.py --version 8.11.1 -v assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages:
            - python3
          image: ubuntu:jammy
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
