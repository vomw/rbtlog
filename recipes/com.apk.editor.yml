---
repository: https://github.com/apk-editor/APK-Explorer-Editor.git
updates: releases
versions:
  - tag: v0.29
    apks:
      - apk_pattern: app-full-release\.apk
        apk_url: https://github.com/apk-editor/APK-Explorer-Editor/releases/download/v0.29/app-full-release.apk
        build:
          - sed -r '/signingConfigs.releaseConfig/d' -i app/build.gradle
          - chmod +x gradlew
          - ./gradlew assembleFullRelease
          - mv app/build/outputs/apk/full/release/app-full-release-unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
