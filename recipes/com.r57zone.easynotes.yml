---
repository: https://github.com/r57zone/EasyNotes.git
updates: disabled
notes:
  - declared EOL by dev
versions:
  - tag: '1.2'
    apks:
      - apk_pattern: EasyNotes.*\.apk
        apk_url: https://github.com/r57zone/EasyNotes/releases/download/1.2/EasyNotes.1.2.apk
        build:
          - git checkout fa6712a39cce8ecb3d6e8688874ffd0e7407294b
          - cd Source/Android
          - rm app/src/main/assets/ReadMe.txt
          - cp -a ../Multi/images ../Multi/*.css ../Multi/index.html ../Multi/langs.js app/src/main/assets/
          - rm app/src/main/assets/images/flashlight.png app/src/main/assets/images/qr.png app/src/main/assets/images/share.png
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
          - OUT=app/build/outputs/apk/release/app-release-unsigned.apk
          - reproducible-apk-tools/inplace-fix.py --internal --zipalign fix-newlines "$OUT" 'assets/*.css' 'assets/*.js' 'assets/*.html'
          - mv "$OUT" /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
  - tag: '1.3'
    apks:
      - apk_pattern: EasyNotes.*\.apk
        apk_url: https://github.com/r57zone/EasyNotes/releases/download/1.3/EasyNotes.1.3.apk
        build:
          - cd Source/Android
          - rm app/src/main/assets/ReadMe.txt
          - cp -a ../Multi/images ../Multi/*.css ../Multi/index.html ../Multi/langs.js app/src/main/assets/
          - rm app/src/main/assets/windows.css
          - sed -r 's/нужна для Edge/нужна для Edg/' -i app/src/main/assets/langs.js
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
          - OUT=app/build/outputs/apk/release/app-release-unsigned.apk
          - reproducible-apk-tools/inplace-fix.py --internal --zipalign fix-newlines "$OUT" 'assets/*.css' 'assets/*.js' 'assets/*.html'
          - mv "$OUT" /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
  - tag: '1.4'
    apks:
      - apk_pattern: EasyNotes.*\.apk
        apk_url: https://github.com/r57zone/EasyNotes/releases/download/1.4/EasyNotes.1.4.apk
        build:
          - cd Source/Android
          - rm app/src/main/assets/ReadMe.txt
          - cp -a ../Multi/images ../Multi/*.css ../Multi/index.html ../Multi/langs.js app/src/main/assets/
          - rm app/src/main/assets/windows.css app/src/main/assets/ios.css
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - mkdir reproducible-apk-tools
          - tar xf "${PROVISIONING_CACHE_REPRO_APK_PATH}" --strip-components=1 -C reproducible-apk-tools/
          - OUT=app/build/outputs/apk/release/app-release-unsigned.apk
          - reproducible-apk-tools/inplace-fix.py --internal --zipalign fix-newlines "$OUT" 'assets/*.css' 'assets/*.js' 'assets/*.html'
          - mv "$OUT" /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cached_tools:
            - name: repro-apk
              file_name: repro-apk.tar.gz
              version: v0.3.0
              url: https://api.github.com/repos/obfusk/reproducible-apk-tools/tarball/v0.3.0
              sha256: b9b595358cae8ed0a5124d452b7902a8434c4105937ba4e5284f6a2d6160b185
          cmake:
          cmdline_tools:
            version: '22.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
            sha256: 4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
