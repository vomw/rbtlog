repository: https://github.com/CipherApps/cipher-notes.git
updates: releases
versions:
  - tag: v1.1.1
    apks:
      - apk_pattern: CipherNotes-release\.apk
        apk_url: https://github.com/CipherApps/cipher-notes/releases/download/v1.1.1/CipherNotes-release.apk
        build:
          - git reset --soft 90ee372a56ea253ebdeb7ee9701b8bfcb9b222d8
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv build/outputs/apk/release/CipherNotes-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '20.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
            sha256: 04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
