---
repository: https://github.com/v4lpt/PWG.git
updates: releases
notes:
  - 'FIXME: v1.0.5 has the wrong checksum in gradle-wrapper.properties – see https://github.com/v4lpt/PWG/issues/3'
versions:
  - tag: v1.0.5
    apks:
      - apk_pattern: VPT\.002\.PWG.*\.apk
        apk_url: https://github.com/v4lpt/PWG/releases/download/v1.0.5/VPT.002.PWG.1.0.5.apk
        build:
          - sed -r 's/distributionSha256Sum=ff7bf6a86f09b9b2c40bb8f48b25fc19cf2b2664fd1d220cd7ab833ec758d0d7/distributionSha256Sum=544c35d6bd849ae8a5ed0bcea39ba677dc40f49df7d1835561582da2009b961d/' -i gradle/wrapper/gradle-wrapper.properties
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
