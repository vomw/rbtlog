versions:
  - tag: 2.4.2
    apks:
      - apk_pattern: fluffy.*universal\.apk
        apk_url: https://github.com/mlm-games/Fluffy/releases/download/2.4.2/fluffy-2.4.2-universal.apk
        build:
          - sed -r '/signingConfigs.getByName/d ; /create\("release"\) \{/,/^        \}/d' -i app/build.gradle.kts
          - ./gradlew assembleRelease -PenableApkSplits -PtargetAbi=arm64-v8a
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/fluffy-*-universal.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
