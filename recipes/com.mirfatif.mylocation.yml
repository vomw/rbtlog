---
repository: https://github.com/mirfatif/MyLocation.git
updates: releases
notes:
  - 'FIXME: v1.0.7 cannot be built, see https://github.com/mirfatif/MyLocation/issues/24 => it’s not the FOSS build; adjust the `apk_pattern` to `MyLocation.*\d\.apk` to avoid picking up pro releases'
versions:
  - tag: v1.06
    apks:
      - apk_pattern: MyLocation.*\.apk
        apk_url: https://github.com/mirfatif/MyLocation/releases/download/v1.06/MyLocation_v1.06.apk
        build:
          - sed -r 's/if (\(\!names\.contains\('"'"'fdroid'"'"'\)) (..) \!names\.contains\('"'"'foss'"'"'\)\).+/if (\1 \&\& !names.contains('"'"'self'"'"')) \2 !names.contains('"'"'foss'"'"')) {/' -i app/build.gradle
          - ./gradlew --info assembleSelfFossRelease
          - mv app/build/outputs/apk/selfFoss/release/app-self-foss-release-unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
  - tag: v1.07-pro
    apks:
      - apk_pattern: MyLocation.*\.apk
        apk_url: https://github.com/mirfatif/MyLocation/releases/download/v1.07-pro/MyLocation_v1.07-map-pro.apk
        build:
          - git reset --soft a30613c48d84da40bd94e069389fb420cb9371b2
          - sed -r 's/if (\(\!names\.contains\('"'"'fdroid'"'"'\)) (..) \!names\.contains\('"'"'foss'"'"'\)\).+/if (\1 \&\& !names.contains('"'"'self'"'"')) \2 !names.contains('"'"'foss'"'"')) {/' -i app/build.gradle
          - ./gradlew --info assembleSelfFossRelease
          - mv app/build/outputs/apk/selfFoss/release/app-self-foss-release-unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
  - tag: v1.08-foss
    apks:
      - apk_pattern: MyLocation.*\.apk
        apk_url: https://github.com/mirfatif/MyLocation/releases/download/v1.08-foss/MyLocation_v1.08-foss.apk
        build:
          - ./gradlew --info assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/app-release-unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
