---
repository: https://github.com/NeoUtils/NeoRegex.git
updates: disabled
notes:
  - 'FIXME: M7.json timestamp issue, see https://github.com/NeoUtils/NeoRegex/issues/76 '
  - not yet added to our repo, waiting for fastlane, and no activity for half a year, hence disabled for now
versions:
  - tag: v3.2.0
    apks:
      - apk_pattern: NeoRegex-.*\.apk
        apk_url: https://github.com/NeoUtils/NeoRegex/releases/download/v3.2.0/NeoRegex-3.2.0.apk
        build:
          - sed -r '/signingConfigs.getByName/d' -i build-logic/src/main/kotlin/com.neoutils.neoregex.android-app.gradle.kts
          - sed -r '/create\("release"\) \{/,/^        \}/d' -i build-logic/src/main/kotlin/com.neoutils.neoregex.android-app.gradle.kts
          - base64 -d > sedo <<< c2VkIC1yICdzL2Vudmlyb25tZW50XD8uYnVnc25hZ0FuZHJvaWRBcGlLZXkvImYzYzA1NzAwZjhkMWVlZmUzMWMxOGM2ODFlMWI1ZmVjIi8nIC1pIGNvcmUvY3Jhc2hyZXBvcnQvYnVpbGQuZ3JhZGxlLmt0cwo=
          - bash sedo
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
          - reproducible-apk-tools/inplace-fix.py --internal --page-size 16 fix-files application/build/outputs/apk/release/application-release-unsigned.apk 'sed -r s/"generated":(\s)"[^"]*"/"generated":\1"2025-05-01T07:11:48.15Z"/' 'res/M7.json'
          - mv application/build/outputs/apk/release/application-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
