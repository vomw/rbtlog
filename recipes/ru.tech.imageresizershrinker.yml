---
repository: https://github.com/T8RIN/ImageResizer.git
updates: releases
notes:
  - 'WARN: since v3.1.1, uses ~25 GB RAM on build'
versions:
  - tag: 2.9.0
    apks:
      - apk_pattern: image-toolbox-.*-foss-arm64-v8a\.apk
        apk_url: https://github.com/T8RIN/ImageToolbox/releases/download/2.9.0/image-toolbox-2.9.0-foss-arm64-v8a.apk
        build:
          - sed -r '/abi \{/,/}/ { s/include\(.*\)/include("arm64-v8a")/ ; s/isUniversalApk = true/isUniversalApk = false/ }' -i app/build.gradle.kts
          - chmod +x gradlew
          - PROF_FILE=app/build/intermediates/binary_art_profile/fossRelease/compileFossReleaseArtProfile/baseline.prof
          - PROF_SHA1=6513b40920018c2b8344834c862d4fa28db1652d
          - for _ in {1..10}; do
          - ./gradlew clean assembleFossRelease --no-build-cache --no-configuration-cache --no-daemon
          - if [ "$( sha1sum "$PROF_FILE" | cut -d' ' -f1 )" = "$PROF_SHA1" ]; then
          - break
          - fi
          - done
          - mv app/build/outputs/apk/foss/release/image-toolbox-*-foss-arm64-v8a-release-unsigned.apk /outputs/unsigned.apk
        build_timeout: 60
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
