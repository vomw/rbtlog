versions:
  - tag: v2.18.1
    apks:
      - apk_pattern: min-cal-widget-.*\.apk
        apk_url: https://github.com/mvmike/min-cal-widget/releases/download/v2.18.1/min-cal-widget-v2.18.1.apk
        build:
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/min-cal-widget*.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
