---
repository: https://github.com/cromaguy/Rhythm.git
updates: releases
notes:
  - 'FIXME: switch to fdroid flavor with the next release, as the github flavor includes a self-updater not meeting our criteria'
versions:
  - tag: v2.1.100.7-beta
    apks:
      - apk_pattern: Rhythm-.*\.apk
        apk_url: https://github.com/cromaguy/Rhythm/releases/download/v2.1.100.7-beta/Rhythm-v2.1-b256.apk
        build:
          - git checkout c4cb36495b10456e9241254b44b3cd483f30bd79
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
