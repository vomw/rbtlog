---
repository: https://github.com/muhammadhaseebiqbal-dev/QuranMajeed.git
updates: releases
versions:
  - tag: v1.0.3
    apks:
      - apk_pattern: app-release\.apk
        apk_url: https://github.com/muhammadhaseebiqbal-dev/QuranMajeed/releases/download/v1.0.3/app-release.apk
        build:
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
          - OUT=app/build/outputs/apk/release/*unsigned.apk
          - reproducible-apk-tools/inplace-fix.py --internal --zipalign fix-newlines $OUT 'assets/hadiths.json'
          - mv $OUT /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '20.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
            sha256: 04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
