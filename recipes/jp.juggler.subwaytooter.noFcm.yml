---
repository: https://github.com/tateisu/SubwayTooter.git
updates: releases
notes:
  - 'FIXNEEDED: lots of JARs in _Emoji/emojiConverter/src/lib'
  - for v5.545, needed to rename the app/src/noFcm directory to app/src/nofcm (case sensitivity on Linux but not on Windows); should be fixed with the next release
versions:
  - tag: v5.545
    apks:
      - apk_pattern: SubwayTooter-main-noFcm-.*\.apk
        apk_url: https://github.com/tateisu/SubwayTooter/releases/download/v5.545/SubwayTooter-main-noFcm-545-5.545-20240107_080356.apk
        build:
          - sed -r '/signingConfigs.getByName/d' -i app/build.gradle.kts
          - echo -e "storeFile=/dev/null\nstorePassword=storePass\nkeyAlias=alias\nkeyPassword=keyPass" >> keystore.properties
          - mv app/src/noFcm app/src/nofcm
          - chmod +x gradlew
          - ./gradlew assembleNofcmRelease
          - mv app/build/outputs/apk/nofcm/release/app-nofcm-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
