---
repository: https://github.com/thevindu-w/clip_share_client.git
updates: releases
notes:
  - 'FIXME: drop the non-legacy as we do not ship it'
versions:
  - tag: v3.1.1
    apks:
      - apk_pattern: clip_share_client\.apk
        apk_url: https://github.com/thevindu-w/clip_share_client/releases/download/v3.1.1/clip_share_client.apk
        build:
          - sed -r '/signingConfigs.release/d' -i app/build.gradle
          - chmod +x gradlew
          - ./gradlew assembleRelease -PRELEASE_STORE_FILE=/dev/null -PRELEASE_STORE_PASSWORD=pass -PRELEASE_KEY_ALIAS=alias -PRELEASE_KEY_PASSWORD=pass
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
