      - apk_pattern: ColorBlendr.*\.apk
        apk_url: https://github.com/Mahmud0808/ColorBlendr/releases/download/v3.0/ColorBlendr.v3.0.apk
        build:
          - sed -ri 's/version = release\(36\)/version = release(37)/' materialcolorutilities/build.gradle.kts
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mkdir reproducible-apk-tools
          - tar xf "${PROVISIONING_CACHE_REPRO_APK_PATH}" --strip-components=1 -C reproducible-apk-tools/
          - reproducible-apk-tools/inplace-fix.py --internal --zipalign fix-newlines app/build/outputs/apk/release/ColorBlendr*.apk 'assets/contributors.json' 'assets/privacy_policy.txt' 'assets/translators.json'
          - mv app/build/outputs/apk/release/ColorBlendr*.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cached_tools:
            - name: repro-apk
              file_name: repro-apk.tar.gz
              version: v0.3.0
              url: https://api.github.com/repos/obfusk/reproducible-apk-tools/tarball/v0.3.0
