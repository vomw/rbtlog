---
repository: https://github.com/RichardLuo0/global-icon-pack-android.git
updates: releases
versions:
  - tag: 0.0.6
    apks:
      - apk_pattern: app-release\.apk
        apk_url: https://github.com/RichardLuo0/global-icon-pack-android/releases/download/0.0.6/app-release.apk
        build:
          - sed -r '/signingConfigs.release/d' -i app/build.gradle
          - echo -e "storeFile=/dev/null\nstorePassword=storePass\nkeyAlias=alias\nkeyPassword=keyPass" >> keystore.properties
          - git clone https://github.com/obfusk/gradlew.py.git
          - gradlew.py/gradlew.py --version 8.11.1 -v assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - python3
          image: ubuntu:jammy
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
