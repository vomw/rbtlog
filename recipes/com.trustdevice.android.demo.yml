---
repository: https://github.com/trustdecision/trustdevice-android.git
updates: releases
versions:
  - tag: 1.1.2
    apks:
      - apk_pattern: TrustDevice-release.*\.apk
        apk_url: https://github.com/trustdecision/trustdevice-android/releases/download/1.1.2/TrustDevice-release-1.1.2.apk
        build:
          - sed -r '/signingConfigs.release/d' -i app/build.gradle
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/TrustDevice-release-*.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/runner
        build_repo_dir: /home/runner/work/trustdevice-android/trustdevice-android
        build_timeout:
        build_user: build
        provisioning:
          android_home: /usr/local/lib/android/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - ninja-build
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
