---
repository: https://github.com/Bartuzen/qBitController.git
updates: releases
notes:
  - have to remove the entire signingConfig block as otherwise build fails. After that, still minor differences in dex
  - build seemingly flaky (same "wrong" hash in multiple subsequent runs)
versions:
  - tag: v1.1.0
    apks:
      - apk_pattern: qbitcontroller-.*\.apk
        apk_url: https://github.com/Bartuzen/qBitController/releases/download/v1.1.0/qbitcontroller-1.1.0.apk
        build:
          - sed -r '/signingConfigs.create/d ; 66,86d' -i app/build.gradle.kts
          - chmod +x gradlew
          - PROF_FILE=app/build/intermediates/binary_art_profile/freeRelease/compileFreeReleaseArtProfile/baseline.prof
          - PROF_SHA1=b1b3164f79e41e28e1cc975bd9f4f0cd68043ac6
          - for _ in {1..10}; do
          - ./gradlew clean assembleFreeRelease --no-build-cache --no-configuration-cache --no-daemon
          - test -f "$PROF_FILE"
          - if [ "$( sha1sum "$PROF_FILE" | cut -d' ' -f1 )" = "$PROF_SHA1" ]; then
          - break
          - fi
          - done
          - mv app/build/outputs/apk/free/release/*unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
  - tag: v1.1.1
    apks:
      - apk_pattern: qbitcontroller-.*\.apk
        apk_url: https://github.com/Bartuzen/qBitController/releases/download/v1.1.1/qbitcontroller-1.1.1.apk
        build:
          - sed -r '/signingConfigs.create/d ; 66,86d' -i app/build.gradle.kts
          - chmod +x gradlew
          - PROF_FILE=app/build/intermediates/binary_art_profile/freeRelease/compileFreeReleaseArtProfile/baseline.prof
          - PROF_SHA1=9f81af17a2f475f675bd81a17cfa6fe8a5600a2a
          - for _ in {1..10}; do
          - ./gradlew clean assembleFreeRelease --no-build-cache --no-configuration-cache --no-daemon
          - test -f "$PROF_FILE"
          - if [ "$( sha1sum "$PROF_FILE" | cut -d' ' -f1 )" = "$PROF_SHA1" ]; then
          - break
          - fi
          - done
          - mv app/build/outputs/apk/free/release/*unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
