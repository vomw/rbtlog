  - tag: v2.0.0
    apks:
      - apk_pattern: qbitcontroller-.*\.apk
        apk_url: https://github.com/Bartuzen/qBitController/releases/download/v2.0.0/qbitcontroller-2.0.0-android.apk
        build:
          - git reset --soft 32b622e417509d80163b23e092add84990f6ff24
          - sed -r '/create\("release"\) \{/,/^        \}/d' -i composeApp/build.gradle.kts
          - chmod +x gradlew
          - PROF_FILE=composeApp/build/intermediates/binary_art_profile/freeRelease/compileFreeReleaseArtProfile/baseline.prof
