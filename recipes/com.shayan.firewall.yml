---
repository: https://github.com/shynoiddev/FireWall-Blocks.git
updates: releases
versions:
  - tag: v1.4.1.shynoid
    apks:
      - apk_pattern: FireWall.Blocks.*shynoid\.apk
        apk_url: https://github.com/shynoiddev/FireWall-Blocks/releases/download/v1.4.1.shynoid/FireWall.Blocks.V.1.4.1.shynoid.apk
        build:
          - git checkout 4f1786480fcc78044eb6392377459694fa5d8584
          - git reset --soft 3c207731415bf8c7a2d7ee3173d09defbee9efdb
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
