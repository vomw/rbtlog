---
repository: https://github.com/newhinton/Round-Sync.git
updates: releases
notes:
  - 'FIXME: try removing the extra_packages remaining from previous tries to get the app RB'
versions:
  - tag: v2.5.6
    apks:
      - apk_pattern: roundsync_.*-oss-armeabi-v7a-release\.apk
        apk_url: https://github.com/newhinton/Round-Sync/releases/download/v2.5.6/roundsync_v2.5.6-oss-armeabi-v7a-release.apk
        build:
          - wget -q -O /tmp/go.tar.gz https://dl.google.com/go/go1.23.1.linux-amd64.tar.gz
          - sha256sum -c <<< "49bbb517cfa9eee677e1e7897f7cf9cfdbcf49e05f61984a2789136de359f9bd /tmp/go.tar.gz"
          - tar -C /opt -xzf /tmp/go.tar.gz && rm -f /tmp/go.tar.gz
          - export PATH="$PATH:/opt/go/bin" GOBIN=/opt/go/bin
          - sed -r '/signingConfigs.release/d' -i app/build.gradle
          - sed -r "s/include 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'/include 'armeabi-v7a'/ ; s/:rclone:buildAll/:rclone:buildArm/" -i app/build.gradle
          - ./gradlew assembleOssRelease
          - mv app/build/outputs/apk/oss/release/roundsync_*-oss-armeabi-v7a-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout: 30
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - gcc
            - libc-dev
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk: 25.2.9519653
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
