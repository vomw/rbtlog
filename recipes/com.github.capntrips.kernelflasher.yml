---
repository: https://github.com/capntrips/KernelFlasher.git
updates: disabled
notes:
  - upstream repo has been archived 2025-09-12, disabling updates
versions:
  - tag: v1.0.0-alpha20
    apks:
      - apk_pattern: KernelFlasher-.*\.apk
        apk_url: https://github.com/capntrips/KernelFlasher/releases/download/v1.0.0-alpha20/KernelFlasher-v1.0.0-alpha20.apk
        build:
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
