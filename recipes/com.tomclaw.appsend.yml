---
repository: https://github.com/solkin/appteka-android.git
updates: releases
versions:
  - tag: v18.2
    apks:
      - apk_pattern: appteka.*\.apk
        apk_url: https://github.com/solkin/appteka-android/releases/download/v18.2/appteka-18.2-972.apk
        build:
          - git reset --soft 86feaf9bb9b60ba37f787e33ce546f23fc8f9033
          - sed -r '/signingConfigs.release/d' -i app/build.gradle
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/appteka-*.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
