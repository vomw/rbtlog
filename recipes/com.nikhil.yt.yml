---
repository: https://github.com/nikhilvishwakarma00/Velune.git
updates: releases
versions:
  - tag: v1.0.5
    apks:
      - apk_pattern: velune-universal-release\.apk
        apk_url: https://github.com/nikhilvishwakarma00/Velune/releases/download/v1.0.5/velune-universal-release.apk
        build:
          - git reset --soft d5a5fa89dd3e568ffe44f022e4c948c628c3350f
          - chmod +x gradlew
          - ./gradlew assembleUniversalRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/universal/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '20.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
            sha256: 04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7
          extra_packages: []
          image: debian:trixie-slim
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
  - tag: v1.0.6
