---
repository: https://github.com/criticalAY/Neer.git
updates: releases
versions:
  - tag: v2.01.00
    apks:
      - apk_pattern: app-release\.apk
        apk_url: https://github.com/criticalAY/Neer/releases/download/v2.01.00/neer-2.01.00.apk
        build:
          - sed -r 's/signingConfigs.getByName\(.debug.\)/null/' -i app/build.gradle.kts
          - export ANDROID_NDK=${ANDROID_HOME}/ndk/${PROVISIONING_NDK}
          - echo "ndk.dir=${ANDROID_NDK}" >> local.properties
          - ./gradlew :app:assembleRelease -PversionCode="$(echo ${APP_TAG#v} | sed -r 's/\.//g')300" -PversionName=${APP_TAG#v}
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '22.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
            sha256: 4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk: 27.0.12077973
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
