---
repository: https://github.com/xabd/PrivacyScanner.git
updates: releases
versions:
  - tag: v1.0.0
    apks:
      - apk_pattern: PrivacyScanner\.apk
        apk_url: https://github.com/xabd/PrivacyScanner/releases/download/v1.0.0/PrivacyScanner.apk
        build:
          - git checkout 094c42f3c7dc14b7d0f74d69fd654f442db99770
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
