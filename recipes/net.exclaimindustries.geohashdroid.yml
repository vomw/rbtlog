---
repository: https://github.com/CaptainSpam/geohashdroid.git
updates: releases
notes:
  - 'FIXME: embedded buildtime, see https://github.com/CaptainSpam/geohashdroid/issues/91#issuecomment-3139196875 '
versions:
  - tag: v0.9.6.7a
    apks:
      - apk_pattern: .eohash.roid-.*\.apk
        apk_url: https://github.com/CaptainSpam/geohashdroid/releases/download/v0.9.6.7a/GeohashDroid-0.9.6.7.apk
        build:
          - git reset --soft 89bc6d0445fa276a57fd6854f8e5a832c0cbbbb4
          - base64 -d > app/src/main/res/values/private.xml <<< PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0iVVRGLTgiPz4KPHJlc291cmNlcz4KPHN0cmluZyBuYW1lPSJhcGlfbWFwX2tleV92MiI+QUl6YVN5QzN2QUhhMkMtV2lrTnV5X2FWeHlaSTV1WUJPZnBJbGo4PC9zdHJpbmc+CjwvcmVzb3VyY2VzPgo=
          - sed -r "s/\(BUILD_DATE\)/June 26, 2025/ ; s/Git version/version ${APP_TAG:1}/" -i app/src/main/res/values/strings_about.xml
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages: []
          image: ubuntu:jammy
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
