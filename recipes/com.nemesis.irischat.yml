---
repository: https://github.com/umutcamliyurt/IrisChat.git
updates: disabled
notes:
  - v1.0 was built outside the git tree, so .git had to be removed for RB, see https://github.com/umutcamliyurt/IrisChat/issues/2
  - repo disappeared in early 4/2026, and did not show up again (2026-04-17)
versions:
  - tag: v1.0
    apks:
      - apk_pattern: IrisChat\.apk
        apk_url: https://github.com/umutcamliyurt/IrisChat/releases/download/v1.0/IrisChat.apk
        build:
          - rm -rf .git
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
  - tag: v1.1
    apks:
      - apk_pattern: IrisChat\.apk
        apk_url: https://github.com/umutcamliyurt/IrisChat/releases/download/v1.1/IrisChat.apk
        build:
          - git reset --soft c3d1b96b37df42319e9f07ec7f23e0321f22c4df
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
