---
repository: https://github.com/sal0max/currencies.git
updates: releases
notes:
  - has no gradle wrapper; gradle version can be found in kotlin-tooling-metadata.json
versions:
  - tag: 1.22.5
    apks:
      - apk_pattern: de.salomax.currencies-.*-play-release\.apk
        apk_url: https://github.com/sal0max/currencies/releases/download/1.22.5/de.salomax.currencies-v12205-play-release.apk
        build:
          - sed -r '/signingConfigs.getByName/d' -i app/build.gradle.kts
          - git clone https://github.com/obfusk/gradlew.py.git
          - gradlew.py/gradlew.py --version 8.11.1 -v assemblePlayRelease
          - mv app/build/outputs/apk/play/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
