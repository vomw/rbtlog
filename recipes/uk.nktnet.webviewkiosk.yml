  - tag: v0.15.7
    apks:
      - apk_pattern: WebviewKiosk.*\.apk
        apk_url: https://github.com/nktnet1/webview-kiosk/releases/download/v0.15.7/WebviewKiosk_v0.15.7.apk
        build:
          - sed -r '/signingConfigs.getByName/d ; /create\("release"\) \{/,/^        \}/d' -i app/build.gradle.kts
          - ./gradlew assembleRelease
          - find . -name '*.apk'
