---
repository: https://github.com/codehasan/Current-Activity.git
updates: releases
versions:
  - tag: v2.0.0
    apks:
      - apk_pattern: app-global-release\.apk
        apk_url: https://github.com/codehasan/Current-Activity/releases/download/v2.0.0/app-global-release.apk
        build:
          - git checkout 9c25f7f9aeaf9b30c450b65a62750df36b125afe
          - sed -r '/signingConfigs.(debug|release)/d' -i app/build.gradle
          - chmod +x gradlew
          - ./gradlew assembleGlobalRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/global/release/app-global-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
  - tag: v2.2.0
    apks:
      - apk_pattern: curr?ent-activity_global.*\.apk
        apk_url: https://github.com/codehasan/Current-Activity/releases/download/v2.2.0/curent-activity_global_v2.2.0.apk
        build:
          - sed -r '/signingConfigs.(debug|release)/d' -i app/build.gradle
          - chmod +x gradlew
          - ./gradlew assembleGlobalRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/global/release/*activity_global_v2.2.0.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '20.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
            sha256: 04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
