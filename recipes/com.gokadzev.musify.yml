---
repository: https://github.com/gokadzev/Musify.git
updates: releases
notes:
  - 9.3.2 failed RB, see https://github.com/gokadzev/Musify/issues/564
  - 9.4.0 forgot to adjust flutter version in pubspec.yml
  - 9.6.3 did not honor flutter version, as it was not pinned in the GH action
  - 10.0.4 has BuildID in one lib, see https://github.com/gokadzev/Musify/issues/564#issuecomment-4209234282
versions:
  - tag: 9.2.5
    apks:
      - apk_pattern: Musify-arm64-v8a\.apk
        apk_url: https://github.com/gokadzev/Musify/releases/download/9.2.5/Musify-arm64-v8a.apk
        build:
          - sed -r '/signingConfigs.release/d' -i android/app/build.gradle
          - FLUTTER_VERSION="$(sed -rn 's/\s*\bflutter:\s\^?([0-9.]+)\s*$/\1/p' pubspec.yaml)"
          - git clone -b $FLUTTER_VERSION https://github.com/flutter/flutter
          - export PUB_CACHE=$(pwd)/.pub-cache
          - flutter/bin/flutter config --no-analytics
          - flutter/bin/flutter pub get
          - flutter/bin/flutter build apk --release --split-per-abi --target-platform android-arm64 --flavor github
          - mv build/app/outputs/apk/github/release/app-github-arm64-v8a-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/runner
        build_repo_dir: /home/runner/work/Musify/Musify
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - curl
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
