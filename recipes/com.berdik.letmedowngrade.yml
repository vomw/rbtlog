---
repository: https://github.com/DavidBerdik/Let-Me-Downgrade.git
updates: releases
versions:
  - tag: 1.0.5
    apks:
      - apk_pattern: Let-Me-Downgrade-.*\.apk
        apk_url: https://github.com/DavidBerdik/Let-Me-Downgrade/releases/download/1.0.5/Let-Me-Downgrade-1.0.5.apk
        build:
          - pushd libxposed/api
          - ./gradlew publishToMavenLocal
          - popd
          - pushd libxposed/service
          - ./gradlew publishToMavenLocal
          - popd
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - git clone -b v0.2.8 https://github.com/obfusk/reproducible-apk-tools.git
          - OUT=app/build/outputs/apk/release/app-release-unsigned.apk
          - reproducible-apk-tools/inplace-fix.py --internal --page-size 16 fix-newlines "$OUT" 'META-INF/services/*'
          - mv "$OUT" /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - openjdk-17-jdk-headless
            - python3
          image: ubuntu:jammy
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
  - tag: 1.0.6
    apks:
      - apk_pattern: Let-Me-Downgrade-.*\.apk
        apk_url: https://github.com/DavidBerdik/Let-Me-Downgrade/releases/download/1.0.6/Let-Me-Downgrade-1.0.6.apk
        build:
          - pushd libxposed/api
          - ./gradlew publishToMavenLocal
          - popd
          - pushd libxposed/service
          - ./gradlew publishToMavenLocal
          - popd
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
          - OUT=app/build/outputs/apk/release/app-release-unsigned.apk
          - reproducible-apk-tools/inplace-fix.py --internal --page-size 16 fix-newlines "$OUT" 'META-INF/services/*'
          - mv "$OUT" /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - openjdk-17-jdk-headless
            - python3
          image: ubuntu:jammy
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
