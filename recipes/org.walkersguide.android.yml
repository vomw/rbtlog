---
repository: https://github.com/scheibler/WalkersGuide-Android.git
updates: releases
notes:
  - all set, waiting for the next release
versions:
  - tag: v3.2.2
    apks:
      - apk_pattern: WalkersGuide-.*-release\.apk
        apk_url: https://github.com/scheibler/WalkersGuide-Android/releases/download/v3.2.2/WalkersGuide-3.2.2-release.apk
        build:
          - git reset --soft eddae9bcf84ed786ba863357d482bbde9cceee3c
          - sed -r '/signingConfigs.prod/d' -i app/build.gradle
          - ./gradlew assembleProdRelease
          - mv app/build/outputs/apk/prod/release/WalkersGuide-prod-*-release.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
