---
repository: https://github.com/JLindemann42/Atomic-Periodic-Table.Android.git
updates: disabled
notes:
  - loads of proprietary dependencies meanwhile, updates disabled in our repo as well; see https://github.com/JLindemann42/Atomic-Periodic-Table.Android/issues/138
versions:
  - tag: v4.0.1m-build150
    apks:
      - apk_pattern: atomic.*\.apk
        apk_url: https://github.com/JLindemann42/Atomic-Periodic-Table.Android/releases/download/v4.0.1m-build150/atomic-401m-build150.apk
        build:
          - git reset --soft a5d8356ba7484f4fc0257da989695ea2bea7b658
          - sed -r '/signingConfigs.config/d ; /storeFile file/d' -i app/build.gradle
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
          - OUT=app/build/outputs/apk/release/app-release-unsigned.apk
          - reproducible-apk-tools/inplace-fix.py --internal --zipalign fix-newlines "$OUT" 'assets/*.json'
          - mv $OUT /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
  - tag: v4.5.0m-build204
    apks:
      - apk_pattern: (A|a)tomic.*\.apk
        apk_url: https://github.com/JLindemann42/Atomic-Periodic-Table.Android/releases/download/v4.5.0m-build204/Atomic-v450-b204.apk
        build:
          - git reset --soft e6a2e708acdbfd96d9e351e58c1e7817e536a269
          - sed -r '/signingConfigs.config/d ; /storeFile file/d' -i app/build.gradle
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
          - OUT=app/build/outputs/apk/release/app-release-unsigned.apk
          - reproducible-apk-tools/inplace-fix.py --internal --zipalign fix-newlines "$OUT" 'assets/*.json'
          - mv $OUT /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
