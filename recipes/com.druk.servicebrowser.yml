---
repository: https://github.com/andriydruk/BonjourBrowser.git
updates: releases
notes:
  - 'FIXME: add missing -i to foojay seds'
versions:
  - tag: v3.0.3
    apks:
      - apk_pattern: BonjourBrowser.*\.apk
        apk_url: https://github.com/andriydruk/BonjourBrowser/releases/download/v3.0.3/BonjourBrowser-v3.0.3.apk
        build:
          - sed -ri '/org.gradle.toolchains.foojay-resolver-convention/d' settings.gradle
          - sed -ri '/org.gradle.java.home/d' gradle.properties
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '20.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
            sha256: 04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
