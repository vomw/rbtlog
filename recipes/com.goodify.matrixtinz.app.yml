---
repository: https://github.com/D-e-vGoodify/MatrixTinz.git
updates: releases
versions:
  - tag: v1.0.2
    apks:
      - apk_pattern: matrixtinz-release\.apk
        apk_url: https://github.com/D-e-vGoodify/MatrixTinz/releases/download/v1.0.2/matrixtinz-release.apk
        build:
          - tar xf "${PROVISIONING_CACHE_NODEJS_LTS_PATH}" -C /opt
          - export PATH="${PATH}:/opt/node-${PROVISIONING_CACHE_NODEJS_LTS_VERSION}-linux-x64/bin"
          - npm install
          - npm run build
          - npx cap sync android
          - cd android
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/app-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/runner
        build_repo_dir: /home/runner/work/MatrixTinz/MatrixTinz
        build_timeout:
        build_user: build
        provisioning:
          android_home: /usr/local/lib/android/sdk
          build_tools:
          cached_tools:
            - name: nodejs-lts
              file_name: nodejs-lts.tar.xz
              version: v24.18.1
              url: https://nodejs.org/dist/v24.18.1/node-v24.18.1-linux-x64.tar.xz
              sha256: d6c664df3f3f61458e8c277585571328522d705166723a7c7823a9253a4d15a0
          cmake:
          cmdline_tools:
            version: '22.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
            sha256: 4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583
          extra_packages:
            - xz-utils
          image: ubuntu:jammy
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
