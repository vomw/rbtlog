---
repository: https://github.com/gabeg805/NFC-Alarm-Clock.git
updates: releases
versions:
  - tag: v12.4.6
    apks:
      - apk_pattern: nfc_alarm_clock_.*-foss-release\.apk
        apk_url: https://github.com/gabeg805/NFC-Alarm-Clock/releases/download/$$TAG$$/nfc_alarm_clock_$$TAG$$-foss-release.apk
        build:
          - git reset --soft e3dded3269464c063ee7640de02f8d411ae09b83
          - ./gradlew assembleFossRelease
          - mv app/build/outputs/apk/foss/release/nfc_alarm_clock_*-foss-release-unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
