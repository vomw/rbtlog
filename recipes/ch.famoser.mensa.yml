---
repository: https://github.com/famoser/Mensa.git
updates: releases
versions:
  - tag: v1.10.0
    apks:
      - apk_pattern: app-release\.apk
        apk_url: https://github.com/famoser/Mensa/releases/download/v1.10.0/app-release.apk
        build:
          - mkdir /build/.gradle
          - base64 -d > /build/.gradle/gradle.properties <<< WkZWX0FQSV9LRVk9WTIwM01IVndhWFUwT1dGeWVYTTJNSFJzY1dVeVpuY3djVHBUUVRKUlJ5ODNlWEU1Tm1FemN6TnlSUzkxVGpoQmF5c3JZV2w0YUNzNVNHaFJVRTl4T1RrM1p6ZERhMVpwZEZWdlFrSmhLM2hITjBZeWQxbExhVE51Cg==
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
