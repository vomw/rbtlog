versions:
  - tag: 0.8.4
    apks:
      - apk_pattern: lms-material-release.*\.apk
        apk_url: https://github.com/CDrummond/lms-material-app/releases/download/0.8.4/lms-material-release-0.8.4.apk
        build:
          - git reset --soft 9174830e5f8d7139d01f4f247ce83ac1485e33d7
          - ./gradlew assembleRelease
          - mv lms-material/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
