---
repository: https://github.com/sun-jiao/flut-renamer.git
updates: releases
versions:
  - tag: 1.5.4
    apks:
      - apk_pattern: app-arm64-v8a-release\.apk
        apk_url: https://github.com/sun-jiao/flut-renamer/releases/download/$$TAG$$/app-arm64-v8a-release.apk
        build:
          - sed -r '/signingConfigs.release/d' -i android/app/build.gradle
          - FLUTTER_VERSION="$(sed -rn 's/flutter-version:\s*([0-9.])/\1/p' .github/workflows/main.yml | head -n 1)"
          - git clone -b $FLUTTER_VERSION https://github.com/flutter/flutter
          - export PUB_CACHE=${PWD}/.pub-cache
          - flutter/bin/flutter config --no-analytics
          - flutter/bin/flutter pub get
          - flutter/bin/flutter build apk --release --split-per-abi --target-platform=android-arm64
          - mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/runner
        build_repo_dir: /home/runner/work/flut-renamer/flut-renamer
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - curl
            - clang
            - cmake
            - ninja-build
            - pkg-config
            - libgtk-3-0
            - libgtk-3-dev
            - libblkid1
            - liblzma5
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
  - tag: v1.6.2
    apks:
      - apk_pattern: app-arm64-v8a-release\.apk
        apk_url: https://github.com/sun-jiao/flut-renamer/releases/download/$$TAG$$/app-arm64-v8a-release.apk
        build:
          - sed -ri '/org.gradle.toolchains.foojay-resolver-convention/d' android/settings.gradle.kts
          - sed -ri '/foojay/d ; /toolchainVendor/d' android/gradle/gradle-daemon-jvm.properties
          - sed -r '/signingConfigs.getByName/d ; /signingConfigs \{/,/^    \}/d' -i android/app/build.gradle.kts
          - FLUTTER_VERSION="$(sed -rn 's/^\s*FLUTTER_VERSION:\s*([0-9.])/\1/p' .github/workflows/main.yml | head -n 1)"
          - git clone -b $FLUTTER_VERSION https://github.com/flutter/flutter
          - export PUB_CACHE=${PWD}/.pub-cache
          - flutter/bin/flutter config --no-analytics
          - flutter/bin/flutter pub get
          - flutter/bin/flutter build apk --release --split-per-abi --target-platform=android-arm64
          - mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/runner
        build_repo_dir: /home/runner/work/flut-renamer/flut-renamer
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '22.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
            sha256: 4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583
          extra_packages:
            - curl
            - clang
            - cmake
            - ninja-build
            - pkg-config
            - libgtk-3-0
            - libgtk-3-dev
            - libblkid1
            - liblzma5
          image: ubuntu:jammy
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
  - tag: v1.6.3
    apks:
      - apk_pattern: app-arm64-v8a-release\.apk
        apk_url: https://github.com/sun-jiao/flut-renamer/releases/download/$$TAG$$/app-arm64-v8a-release.apk
        build:
          - sed -ri '/org.gradle.toolchains.foojay-resolver-convention/d' android/settings.gradle.kts
          - sed -ri '/foojay/d ; /toolchainVendor/d' android/gradle/gradle-daemon-jvm.properties
          - sed -r '/signingConfigs.getByName/d ; /signingConfigs \{/,/^    \}/d' -i android/app/build.gradle.kts
          - FLUTTER_VERSION="$(sed -rn 's/^\s*FLUTTER_VERSION:\s*([0-9.])/\1/p' .github/workflows/main.yml | head -n 1)"
          - git clone -b $FLUTTER_VERSION https://github.com/flutter/flutter
          - export PUB_CACHE=${PWD}/.pub-cache
          - flutter/bin/flutter config --no-analytics
          - flutter/bin/flutter pub get
          - sed -i -e 's/-Wl,/-Wl,--build-id=none,/' "${PUB_CACHE}"/hosted/*/jni-*/src/CMakeLists.txt
          - flutter/bin/flutter build apk --release --split-per-abi --target-platform=android-arm64
          - mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/runner
        build_repo_dir: /home/runner/work/flut-renamer/flut-renamer
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '22.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
            sha256: 4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583
          extra_packages:
            - curl
            - clang
            - cmake
            - ninja-build
            - pkg-config
            - libgtk-3-0
            - libgtk-3-dev
            - libblkid1
            - liblzma5
          image: ubuntu:jammy
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
