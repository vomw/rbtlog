---
repository: https://github.com/nemuTUI/nemu-droid.git
updates: releases
versions:
  - tag: v0.2.0
    apks:
      - apk_pattern: nemu-droid-.*\.apk
        apk_url: https://github.com/nemuTUI/nemu-droid/releases/download/v0.2.0/nemu-droid-0.2.0.apk
        build:
          - git checkout a9db10fa25cf41b9985cadc2e15d1ceae96beb82
          - JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64 ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - openjdk-11-jdk-headless
          image: debian:bullseye-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
