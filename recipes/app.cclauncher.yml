---
repository: https://github.com/mlm-games/CCLauncher.git
updates: releases
notes:
  - builds all ABIs but picks only one, as building just the one turns out to be not RB
versions:
  - tag: v6.1.2
    apks:
      - apk_pattern: cclauncher-.*-arm64-v8a\.apk
        apk_url: https://github.com/mlm-games/CCLauncher/releases/download/v6.1.2/cclauncher-v6.1.2-arm64-v8a.apk
        build:
          - sed -r '/signingConfigs.getByName/d' -i app/build.gradle.kts
          - sed -r '/create\("release"\) \{/,/   \}/d' -i app/build.gradle.kts
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/cclauncher-v6.1.2-arm64-v8a.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
