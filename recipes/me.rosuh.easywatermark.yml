  - tag: 3.0.0
    apks:
      - apk_pattern: .*-[0-9]+-signed\.apk
        apk_url: https://github.com/rosuH/EasyWatermark/releases/download/3.0.0/EasyWatermark-3.0.0-30000-signed.apk
        build:
          - sed -r '/signingConfigs.releaseConfig/d' -i build.gradle.kts
          - mkdir -p ${ANDROID_HOME}/ndk
          - unzip -q "${PROVISIONING_CACHE_ANDROID_NDK_PATH}" -d ${ANDROID_HOME}/ndk
          - mv ${ANDROID_HOME}/ndk/android-ndk-r${PROVISIONING_CACHE_ANDROID_NDK_VERSION:0:2}? ${ANDROID_HOME}/ndk/${PROVISIONING_CACHE_ANDROID_NDK_VERSION}
          - export ANDROID_NDK=${ANDROID_HOME}/ndk/${PROVISIONING_CACHE_ANDROID_NDK_VERSION}
          - echo "ndk.dir=${ANDROID_NDK}" >> local.properties
          - ./gradlew assembleRelease --stacktrace -PpreDexEnable=false --max-workers 2 --no-daemon
          - find . -name '*.apk'
          - mkdir reproducible-apk-tools
          - tar xf "${PROVISIONING_CACHE_REPRO_APK_PATH}" --strip-components=1 -C reproducible-apk-tools/
          - OUT="app/build/outputs/apk/release/app-release-unsigned.apk"
          - reproducible-apk-tools/inplace-fix.py --internal --zipalign fix-pg-map-id $OUT aca4d18eb22be595653a503773a11186a3bb6f7e8864ee38134e27079e8a0df2
          - reproducible-apk-tools/zipalign.py --page-size 16 --pad-like-apksigner --replace "$OUT" /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cached_tools:
            - name: android-ndk
              file_name: android-ndk.zip
              version: 28.2.13676358
              url: https://dl.google.com/android/repository/android-ndk-r28c-linux.zip
              sha256: dfb20d396df28ca02a8c708314b814a4d961dc9074f9a161932746f815aa552f
            - name: repro-apk
              file_name: repro-apk.tar.gz
              version: v0.3.2
              url: https://gitlab.com/fdroid/reproducible-apk-tools/-/archive/v0.3.2/reproducible-apk-tools-v0.3.2.tar.gz
              sha256: e71566c1d5233d9ee6f87c107c5c04aaf1afd69f0a4166b0e93c907151405c2f
          cmake:
          cmdline_tools:
            version: '22.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
            sha256: 4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583
          extra_packages:
            - python3
          image: debian:bookworm-slim
