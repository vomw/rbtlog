---
repository: https://github.com/vbresan/MindfulnessMeditation.git
updates: releases
versions:
  - tag: '5'
    apks:
      - apk_pattern: biz.binarysolutions.mindfulnessmeditation-.*-fdroid-release\.apk
        apk_url: https://github.com/vbresan/MindfulnessMeditation/releases/download/5/biz.binarysolutions.mindfulnessmeditation-2.3-fdroid-release.apk
        build:
          - wget -q -O /tmp/gradle-8.2.1-bin.zip -- https://services.gradle.org/distributions/gradle-8.2.1-bin.zip
          - sha256sum -c <<< '03ec176d388f2aa99defcadc3ac6adf8dd2bce5145a129659537c0874dea5ad1  /tmp/gradle-8.2.1-bin.zip'
          - unzip -q -d /opt /tmp/gradle-8.2.1-bin.zip
          - export PATH="${PATH}:/opt/gradle-8.2.1/bin"
          - gradle assembleRelease
          - git clone -b v0.2.8 https://github.com/obfusk/reproducible-apk-tools.git
          - OUT=app/build/outputs/apk/fdroid/release/biz.binarysolutions.mindfulnessmeditation-*-fdroid-release-unsigned.apk
          - reproducible-apk-tools/inplace-fix.py --internal --page-size 4 fix-newlines $OUT 'META-INF/services/*'
          - mv $OUT /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
  - tag: '6'
    apks:
      - apk_pattern: biz.binarysolutions.mindfulnessmeditation-.*-fdroid-release\.apk
        apk_url: https://github.com/vbresan/MindfulnessMeditation/releases/download/6/biz.binarysolutions.mindfulnessmeditation-2.3.1-fdroid-release.apk
        build:
          - git clone https://codeberg.org/IzzyOnDroid/gradlew.py.git
          - gradlew.py/gradlew.py -v assembleRelease
          - find . -name '*.apk'
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
          - OUT=app/build/outputs/apk/fdroid/release/biz.binarysolutions.mindfulnessmeditation-*-fdroid-release-unsigned.apk
          - reproducible-apk-tools/inplace-fix.py --internal --page-size 4 fix-newlines $OUT 'META-INF/services/*'
          - mv $OUT /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
