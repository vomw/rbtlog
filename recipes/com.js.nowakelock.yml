  - tag: v2.0.3/60
    apks:
      - apk_pattern: release.*\.apk
        apk_url: https://github.com/NoWakeLock/NoWakeLock/releases/download/v2.0.3%2F60/release-2.0.3.apk
        build:
          - git reset --soft 969fbd6c1590a98178d4aef92189a791b3211a0f
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/release-*.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
