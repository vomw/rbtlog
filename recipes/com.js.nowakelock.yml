---
repository: https://github.com/NoWakeLock/NoWakeLock.git
updates: releases
versions:
  - tag: v2.0.3/60
    apks:
      - apk_pattern: release.*\.apk
        apk_url: https://github.com/NoWakeLock/NoWakeLock/releases/download/v2.0.3%2F60/release-2.0.3.apk
        build:
          - git reset --soft 969fbd6c1590a98178d4aef92189a791b3211a0f
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/release-*.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
