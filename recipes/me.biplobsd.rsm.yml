---
repository: https://github.com/biplobsd/running_services_monitor.git
updates: releases
notes:
  - with v1.0.15+14, we needed to build all ABIs, as else Flutter embedded a wrong per-ABI versionCode (https://github.com/biplobsd/running_services_monitor/issues/9)
versions:
  - tag: v1.0.6+5
    apks:
      - apk_pattern: rsm_.*_arm64-v8a\.apk
        apk_url: https://github.com/biplobsd/running_services_monitor/releases/download/v1.0.6%2B5/rsm_v1.0.6+5_arm64-v8a.apk
        build:
          - FLUTTER_VERSION="$(sed -rn 's/^\s*flutter-version:\ .([0-9\.]*).*?/\1/p' .github/workflows/release.yml | head -n 1)"
          - git clone -b $FLUTTER_VERSION https://github.com/flutter/flutter
          - export PUB_CACHE=$(pwd)/.pub-cache
          - flutter/bin/flutter config --no-analytics
          - flutter/bin/flutter pub get
          - flutter/bin/flutter build apk --release --split-per-abi --target-platform=android-arm64
          - find . -name '*.apk'
          - mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/runner
        build_repo_dir: /home/runner/work/running_services_monitor/running_services_monitor
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages:
            - curl
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
