---
repository: https://github.com/FossifyOrg/Gallery.git
updates: releases
notes:
  - v1.2.0 fails to build (missing dependency)
  - v1.2.1 needs specific NDK to be RB
versions:
  - tag: 1.1.3
    apks:
      - apk_pattern: gallery-\d+-foss-release\.apk
        apk_url: https://github.com/FossifyOrg/Gallery/releases/download/1.1.3/gallery-7-foss-release.apk
        build:
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/foss/release/gallery-*-foss-release-unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
