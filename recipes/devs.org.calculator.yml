---
repository: https://github.com/Binondi/Calculator-Hide-Files.git
updates: releases
notes:
  - v1.3 fails as it was built from a dirty tree after a commit 7 steps beyond the tag, with missing resources; https://github.com/Binondi/Calculator-Hide-Files/issues/5
versions:
  - tag: '1.2'
    apks:
      - apk_pattern: app-release\.apk
        apk_url: https://github.com/Binondi/Calculator-Hide-Files/releases/download/1.2/app-release.apk
        build:
          - git checkout 48c4e04a28be2c2557723b9216fdb2b2461b107c
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
          - OUT=app/build/outputs/apk/release/app-release-unsigned.apk
          - reproducible-apk-tools/inplace-fix.py --internal --zipalign fix-newlines $OUT 'META-INF/services/*'
          - mv $OUT /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
