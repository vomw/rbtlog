---
repository: https://github.com/jaxparrow07/launchpad-search.git
updates: releases
notes:
  - 'FIXME: v1.3.0 was built from an unpublished commit, remove sed (versionCode) and inplace-fix (commit hash) again'
versions:
  - tag: v1.3.0
    apks:
      - apk_pattern: app-release\.apk
        apk_url: https://github.com/jaxparrow07/launchpad-search/releases/download/v1.3.0/app-release.apk
        build:
          - sed -r 's/versionCode = 1000/versionCode = 764/' -i app/build.gradle.kts
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
          - OUT=app/build/outputs/apk/release/app-release-unsigned.apk
          - reproducible-apk-tools/inplace-fix.py --internal --zipalign fix-files "$OUT" 'sed s/f274f9ff23826e302d44488aa29f4bc628b1e1b8/5cfd6dc84129a602103c07e6cb794b5fea3960a0/' 'META-INF/version-control-info.textproto'
          - mv "$OUT" /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
