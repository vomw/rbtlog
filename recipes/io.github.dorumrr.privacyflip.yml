---
repository: https://github.com/dorumrr/privacyFlip.git
updates: releases
versions:
  - tag: v1.2.0
    apks:
      - apk_pattern: PrivacyFlip.*release\.apk
        apk_url: https://github.com/dorumrr/privacyFlip/releases/download/v1.2.0/PrivacyFlip-v1.2.0-release.apk
        build:
          - sed -r '/signingConfigs.getByName/d' -i app/build.gradle.kts
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/PrivacyFlip-*-release.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
