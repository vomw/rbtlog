---
repository: https://github.com/Harshshah6/SaavnMp3-Android.git
updates: releases
versions:
  - tag: v1.0.4
    apks:
      - apk_pattern: app-release\.apk
        apk_url: https://github.com/Harshshah6/SaavnMp3-Android/releases/download/v1.0.4/app-release.apk
        build:
          - sed -r '/signingConfigs.release/d ; /signingConfigs \{/,/^    \}/d' -i app/build.gradle
          - chmod +x gradlew
          - ./gradlew assembleRelease --warning-mode none -x lint -x test
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/app-release.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
