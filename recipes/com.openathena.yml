---
repository: https://github.com/Theta-Limited/OpenAthenaAndroid.git
updates: releases
notes:
  - rm app/src/test for jars
versions:
  - tag: v0.22.0
    apks:
      - apk_pattern: OpenAthena_for_Android_.*\.apk
        apk_url: https://github.com/Theta-Limited/OpenAthenaAndroid/releases/download/v0.22.0/OpenAthena_for_Android_v0.22.0.apk
        build:
          - sed -r '/signingConfigs.debug/d' -i app/build.gradle
          - rm -rf app/src/test
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
