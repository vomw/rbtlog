---
repository: https://github.com/bojko108/mobile-tile-server.git
updates: releases
versions:
  - tag: v5.1
    apks:
      - apk_pattern: MobileTileServer-.*\.apk
        apk_url: https://github.com/bojko108/mobile-tile-server/releases/download/$$TAG$$/MobileTileServer-$$TAG$$.apk
        build:
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
          - OUT=app/build/outputs/apk/release/MobileTileServer-*.apk
          - reproducible-apk-tools/inplace-fix.py --internal --page-size 4 fix-newlines $OUT 'META-INF/services/*' 'res/*.html' 'res/*.txt'
          - mv $OUT /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
