---
repository: https://github.com/yume-chan/VolumeManager.git
updates: releases
notes:
  - 'FIXME: RB fails, no response from dev yet; update blocked in our repo as well due to added AccessibilityService; see https://github.com/yume-chan/VolumeManager/issues/76 '
versions:
  - tag: v0.2
    apks:
      - apk_pattern: volume-manager\.apk
        apk_url: https://github.com/yume-chan/VolumeManager/releases/download/v0.2/volume-manager.apk
        build:
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages: []
          image: ubuntu:jammy
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
