repository: https://github.com/PranavPurwar/Reef.git
updates: releases
versions:
  - tag: v1.1.1
    apks:
      - apk_pattern: Reef-release\.apk
        apk_url: https://github.com/PranavPurwar/Reef/releases/download/v1.1.1/Reef-release.apk
        build:
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv Reef/build/outputs/apk/release/Reef-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
