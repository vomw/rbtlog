---
repository: https://github.com/hash-checker/hash-checker.git
updates: releases
versions:
  - tag: 3.7.3
    apks:
      - apk_pattern: hash-checker_no-google-play_.*\.apk
        apk_url: https://github.com/hash-checker/hash-checker/releases/download/3.7.3/hash-checker_no-google-play_3.7.3.apk
        build:
          - sed -r '/signingConfigs.release/d' -i app/build.gradle
          - sed -r 's/-XX:MaxPermSize=512m//g' -i gradle.properties
          - export KEYSTORE_PATH=/dev/null KEYSTORE_PASSWORD=pass KEY_ALIAS=alias KEY_PASSWORD=pass
          - ./gradlew assembleThirdPartyStoresRelease
          - mv app/build/outputs/apk/thirdPartyStores/release/hash-checker_release.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
