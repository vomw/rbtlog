---
repository: https://github.com/NeoApplications/Neo-Store.git
updates: releases
versions:
  - tag: 1.0.5
    apks:
      - apk_pattern: Neo_Store_.*_release\.apk
        apk_url: https://github.com/NeoApplications/Neo-Store/releases/download/1.0.5/Neo_Store_105_release.apk
        build:
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - mv build/outputs/apk/release/Neo-Store-release-unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
  - tag: 1.0.6
    apks:
      - apk_pattern: Neo.*Store.*release.*\.apk
        apk_url: https://github.com/NeoApplications/Neo-Store/releases/download/1.0.6/Neo_Store_106_release.apk
        build:
          - git clone -b 2.2.2 https://github.com/zlib-ng/zlib-ng.git
          - pushd zlib-ng
          - _options=( -G Ninja -DCMAKE_BUILD_TYPE=None -DCMAKE_INSTALL_PREFIX=/opt -DCMAKE_INSTALL_LIBDIR=lib -Wno-dev -DWITH_GTEST=OFF -DWITH_UNALIGNED=OFF )
          - cmake -B build "${_options[@]}"
          - cmake --build build
          - cmake -B build-compat "${_options[@]}" -DZLIB_COMPAT=ON
          - cmake --build build-compat
          - cmake --install build
          - cmake --install build-compat
          - popd
          - export LD_LIBRARY_PATH=/opt/lib
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - mv build/outputs/apk/release/Neo_Store_*_release.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - build-essential
            - cmake
            - ninja-build
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
  - tag: 1.0.7
    apks:
      - apk_pattern: Neo.*Store.*release.*\.apk
        apk_url: https://github.com/NeoApplications/Neo-Store/releases/download/1.0.7/Neo_Store_107_release.apk
