---
repository: https://codeberg.org/epinez/Compete.git
updates: releases
versions:
  - tag: v1.0.2
    apks:
      - apk_pattern: app-arm64-v8a-release\.apk
        apk_url: https://codeberg.org/epinez/Compete/releases/download/v1.0.2/app-arm64-v8a-release.apk
        build:
          - sed -r '/signingConfigs.getByName/d ; /create\("release"\) \{/,/^        \}/d' -i app/android/app/build.gradle.kts
          - base64 -d > app/assets/.env <<< 
          - cd app
          - export PUB_CACHE=$(pwd)/.pub-cache
          - ../submodules/flutter/bin/flutter config --no-analytics
          - ../submodules/flutter/bin/flutter pub get
          - ../submodules/flutter/bin/flutter pub run build_runner build --delete-conflicting-outputs
          - ../submodules/flutter/bin/flutter build apk --split-per-abi --target-platform="android-arm64"
          - find . -name '*.apk'
          - mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/christian
        build_repo_dir: /home/christian/Development/Codeberg/Compete
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages:
            - curl
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
