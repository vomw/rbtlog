---
repository: https://github.com/nfdz/Cryptool.git
updates: releases
versions:
  - tag: 3.2.0
    apks:
      - apk_pattern: CryptoolApp-release\.apk
        apk_url: https://github.com/nfdz/Cryptool/releases/download/3.2.0/CryptoolApp-release.apk
        build:
          - chmod +x gradlew
          - sed -r '/signingConfigs.getByName/d' -i androidApp/build.gradle.kts
          - ./gradlew assembleRelease
          - mv androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
