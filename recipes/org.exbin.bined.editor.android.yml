---
repository: https://github.com/exbin/bined-android.git
updates: releases
versions:
  - tag: 0.2.2
    apks:
      - apk_pattern: bined-android-.*\.apk
        apk_url: https://github.com/exbin/bined-android/releases/download/0.2.2/bined-android-0.2.2.apk
        build:
          - git reset --soft 3722d5d28a954d85d73277531ab429bed8b4f71f
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
