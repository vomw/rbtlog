---
repository: https://codeberg.org/monocles/monocles_browser.git
updates: releases
notes:
  - 'FIXME: gradle-wrapper.jar "unknown hash" (gradle-8.6 according to gradle-wrapper.properties) for Beta-v1.9.2'
versions:
  - tag: Beta-v1.9.2
    apks:
      - apk_pattern: monocles_browser_.*\.apk
        apk_url: https://codeberg.org/monocles/monocles_browser/releases/download/Beta-v1.9.2/monocles_browser_1.9.2.apk
        build:
          - wget -q -O /tmp/gradle-8.6-bin.zip -- https://services.gradle.org/distributions/gradle-8.6-bin.zip
          - sha256sum -c <<< '9631d53cf3e74bfa726893aee1f8994fee4e060c401335946dba2156f440f24c  /tmp/gradle-8.6-bin.zip'
          - unzip -q -d /opt /tmp/gradle-8.6-bin.zip
          - export PATH="${PATH}:/opt/gradle-8.6/bin"
          - gradle assembleStandardRelease
          - mv app/build/outputs/apk/standard/release/app-standard-release-unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
