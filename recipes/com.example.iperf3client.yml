---
repository: https://github.com/CachoCh/iperf3AndroidClient.git
updates: releases
notes:
  - wrong gradle in the initial release, see https://github.com/CachoCh/iperf3AndroidClient/issues/3#issuecomment-2792015966
  - 1.2 had uncommitted changes increasing versioning, sed needs to be removed with next release
versions:
  - tag: 0.1.0
    apks:
      - apk_pattern: iperf3client_.*\.apk
        apk_url: https://github.com/CachoCh/iperf3AndroidClient/releases/download/0.1.0/iperf3client_0.1.0.apk
        build:
          - git clone https://github.com/obfusk/gradlew.py.git
          - gradlew.py/gradlew.py --version 8.11.1 -v assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
  - tag: '1.1'
    apks:
      - apk_pattern: app-release.*\.apk
        apk_url: https://github.com/CachoCh/iperf3AndroidClient/releases/download/1.1/app-release_1.1.apk
        build:
          - git clone https://github.com/obfusk/gradlew.py.git
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
  - tag: '1.2'
    apks:
      - apk_pattern: app-release.*\.apk
        apk_url: https://github.com/CachoCh/iperf3AndroidClient/releases/download/1.2/app-release_1.2.apk
        build:
          - sed -r 's/versionCode = 2/versionCode = 3/ ; s/versionName = "1.1"/versionName = "1.2"/' -i app/build.gradle.kts
          - git clone https://github.com/obfusk/gradlew.py.git
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
  - tag: '1.3'
    apks:
      - apk_pattern: (app-release|iperf3client).*\.apk
        apk_url: https://github.com/CachoCh/iperf3AndroidClient/releases/download/1.3/iperf3client_1.3.apk
        build:
          - git clone https://codeberg.org/IzzyOnDroid/gradlew.py.git
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
