---
repository: https://github.com/VishnuSanal/RemindMe.git
updates: releases
notes:
  - v1.0.0 was built from a non-existing commit. Work-around no longer needed with v1.0.1
versions:
  - tag: v1.0.0
    apks:
      - apk_pattern: remind-me-.*\.apk
        apk_url: https://github.com/VishnuSanal/RemindMe/releases/download/$$TAG$$/remind-me-$$TAG$$.apk
        build:
          - git checkout 2804300b1560e5deffc7d6bac27d5ef5954db4b9
          - ./gradlew assembleRelease
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
          - reproducible-apk-tools/inplace-fix.py --internal --zipalign --page-size 16 fix-files app/build/outputs/apk/release/app-release-unsigned.apk 'sed s/2804300b1560e5deffc7d6bac27d5ef5954db4b9/2b57b1493ff73d5692ffb215b107e4d5a82a362e/' 'META-INF/version-control-info.textproto'
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
