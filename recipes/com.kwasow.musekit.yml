---
repository: https://github.com/Kwasow/Musekit.git
updates: releases
notes:
  - up to 1.4.0 versionCode was generated based on buildtime unix timestamp, see https://github.com/Kwasow/Musekit/blob/main/app/build.gradle.kts#L7 – https://github.com/Kwasow/Musekit/issues/9
versions:
  - tag: v1.3.1
    apks:
      - apk_pattern: app-release\.apk
        apk_url: https://github.com/Kwasow/Musekit/releases/download/v1.3.1/app-release.apk
        build:
          - chmod +x gradlew
          - sed -r 's/versionCode = versionCode\(\)/versionCode = 1693417498/' -i app/build.gradle.kts
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
