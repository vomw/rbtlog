---
repository: https://github.com/LuigiVampa92/XLogger.git
updates: releases
versions:
  - tag: release-0.7.1
    apks:
      - apk_pattern: com.luigivampa92.xlogger.*\.apk
        apk_url: https://github.com/LuigiVampa92/XLogger/releases/download/release-0.7.1/com.luigivampa92.xlogger_0.7.1_release_20032023_1720.apk
        build:
          - sed -ri '/signingConfigs.(debug|release)/d ; /signingConfigs \{/,/^    \}/d' app/build.gradle
          - JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64 ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/com.luigivampa92.xlogger_*_release_*.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '22.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
            sha256: 4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583
          extra_packages:
            - openjdk-11-jdk-headless
          image: debian:bullseye-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
