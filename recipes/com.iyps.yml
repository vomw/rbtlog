---
repository: https://github.com/StellarSand/IYPS.git
updates: releases
versions:
  - tag: v1.5.4
    apks:
      - apk_pattern: IYPS.*\.apk
        apk_url: https://github.com/StellarSand/IYPS/releases/download/v1.5.4/IYPS_v1.5.4.apk
        build:
          - ./gradlew assembleRelease
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
          - OUT=app/build/outputs/apk/release/*unsigned.apk
          - reproducible-apk-tools/inplace-fix.py --internal --zipalign fix-newlines $OUT 'res/dY.txt'
          - mv $OUT /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - python3
          image: ubuntu:jammy
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
