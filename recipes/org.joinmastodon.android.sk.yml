---
repository: https://github.com/sk22/megalodon.git
updates: disabled
notes:
  - sunset; removed from repo 2025-11-15. superseded by org.joinmastodon.android.moshinda
versions:
  - tag: v2.1.6+fork.110
    apks:
      - apk_pattern: megalodon-fdroid\.apk
        apk_url: https://github.com/sk22/megalodon/releases/download/v2.1.6%2Bfork.110/megalodon-fdroid.apk
        build:
          - chmod +x gradlew
          - ./gradlew assembleFdroidRelease
          - mv mastodon/build/outputs/apk/fdroidRelease/megalodon-fdroidRelease-unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
