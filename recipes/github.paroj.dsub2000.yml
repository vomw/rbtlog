---
repository: https://github.com/paroj/DSub2000.git
updates: releases
versions:
  - tag: 5.6.2
    apks:
      - apk_pattern: DSub2000.*floss-release\.apk
        apk_url: https://github.com/paroj/DSub2000/releases/download/5.6.2/DSub2000_5.6.2-floss-release.apk
        build:
          - ./gradlew assembleFlossRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/floss/release/DSub2000_*-floss-release.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
