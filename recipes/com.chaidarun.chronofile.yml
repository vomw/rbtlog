---
repository: https://github.com/artnc/chronofile.git
updates: releases
versions:
  - tag: 1.1.1
    apks:
      - apk_pattern: chronofile.*\.apk
        apk_url: https://github.com/artnc/chronofile/releases/download/1.1.1/chronofile-1.1.1.apk
        build:
          - sed -r '/signingConfigs.getByName/d ; /signingConfigs \{/,/^  \}/d ; /keystoreProperties.load/d' -i app/build.gradle.kts
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages: []
          image: debian:trixie-slim
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
  - tag: 1.2.0
    apks:
      - apk_pattern: chronofile.*\.apk
        apk_url: https://github.com/artnc/chronofile/releases/download/1.2.0/chronofile-1.2.0.apk
        build:
          - sed -r '/signingConfigs.getByName/d ; /signingConfigs \{/,/^  \}/d ; /keystoreProperties.load/d' -i app/build.gradle.kts
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '20.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
            sha256: 04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7
          extra_packages: []
          image: debian:trixie-slim
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
