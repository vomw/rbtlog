---
repository: https://github.com/darkmoonight/Rain.git
updates: releases
versions:
  - tag: v1.3.13
    apks:
      - apk_pattern: rain-arm64-v8a-release-floss\.apk
        apk_url: https://github.com/darkmoonight/Rain/releases/download/v1.3.13/rain-arm64-v8a-release-floss.apk
        build:
          - sed -r '/signingConfigs.(debug|release)/d ; /signingConfigs \{/,/^    \}/d' -i android/app/build.gradle
          - FLUTTER_VERSION="$(sed -rn 's/^\s*flutter:\s.\^?([0-9.]+).\s*$/\1/p' pubspec.yaml)"
          - git clone -b $FLUTTER_VERSION https://github.com/flutter/flutter
          - export PUB_CACHE=$(pwd)/.pub-cache
          - flutter/bin/flutter config --no-analytics
          - cp tool/pubspec_overrides.floss.yaml pubspec_overrides.yaml
          - flutter/bin/flutter pub get
          - sed -i -e 's/-Wl,/-Wl,--build-id=none,/' ${PUB_CACHE}/hosted/*/jni-*/src/CMakeLists.txt
          - flutter/bin/dart run slang
          - flutter/bin/dart run build_runner build
          - flutter/bin/flutter build apk --release --split-per-abi --flavor floss --target-platform android-arm64
          - find . -name '*.apk'
          - mv build/app/outputs/apk/floss/release/app-floss-arm64-v8a-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/yoshi
        build_repo_dir: /home/yoshi/Documents/Flutter/Rain
        build_timeout:
        build_user: yoshi
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '20.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
            sha256: 04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7
          extra_packages:
            - curl
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
