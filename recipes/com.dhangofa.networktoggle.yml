---
repository: https://github.com/Dhangofa/NetToggle.git
updates: releases
versions:
  - tag: v1.0.31
    apks:
      - apk_pattern: NetToggle\.apk
        apk_url: https://github.com/Dhangofa/NetToggle/releases/download/v1.0.31/NetToggle.apk
        build:
          - git reset --soft 985df6ec5e4a80a844a6c3aee9f7090f598181c1
          - git clone https://codeberg.org/IzzyOnDroid/gradlew.py
          - gradlew.py/gradlew.py -v assembleRelease
          - find . -name '*.apk'
          - mkdir reproducible-apk-tools
          - tar xf "${PROVISIONING_CACHE_REPRO_APK_PATH}" --strip-components=1 -C reproducible-apk-tools/
          - reproducible-apk-tools/zipalign.py --page-align --pad-like-apksigner --replace app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cached_tools:
            - name: repro-apk
              file_name: repro-apk.tar.gz
              version: v0.3.0
              url: https://api.github.com/repos/obfusk/reproducible-apk-tools/tarball/v0.3.0
              sha256: b9b595358cae8ed0a5124d452b7902a8434c4105937ba4e5284f6a2d6160b185
          cmake:
          cmdline_tools:
            version: '22.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
            sha256: 4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
