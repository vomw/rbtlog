---
repository: https://github.com/frimtec/secure-sms-proxy.git
updates: releases
notes:
  - up to 3.2.7, build-time specific calculation were used for versionCode and some other method for versionName, requiring manual adjustments for each release – https://github.com/frimtec/secure-sms-proxy/issues/368
versions:
  - tag: 3.2.7
    apks:
      - apk_pattern: app-release\.apk
        apk_url: https://github.com/frimtec/secure-sms-proxy/releases/download/3.2.7/app-release.apk
        build:
          - chmod +x gradlew
          - sed -r 's/VERSION_NAME=\$version/VERSION_NAME=3.2.7/' -i app/version.properties
          - sed -r 's/int vcode = Integer.*/int vcode = 1873545/' -i app/build.gradle
          - ./gradlew assembleRelease
          - git clone -b v0.2.8 https://github.com/obfusk/reproducible-apk-tools.git
          - reproducible-apk-tools/zipalign.py --pad-like-apksigner --replace app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/app-release-realigned.apk
          - mv app/build/outputs/apk/release/*realigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
