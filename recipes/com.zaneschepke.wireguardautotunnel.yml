---
repository: https://github.com/wgtunnel/wgtunnel.git
updates: releases
versions:
  - tag: 4.1.4
    apks:
      - apk_pattern: wgtunnel-fdroid-.*arm64\.apk
        apk_url: https://github.com/wgtunnel/wgtunnel/releases/download/4.1.4/wgtunnel-fdroid-v4.1.4-arm64.apk
        build:
          - sed -r '/signingConfigs.getByName/d' -i app/build.gradle.kts
          - export KEY_STORE_PATH="/dev/null" SIGNING_STORE_PASSWORD="SIGNING_STORE_PASSWORD" SIGNING_KEY_ALIAS="SIGNING_KEY_ALIAS" SIGNING_KEY_PASSWORD="SIGNING_KEY_PASSWORD"
          - ./gradlew assembleFdroidRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/fdroid/release/*fdroid*arm64*.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
