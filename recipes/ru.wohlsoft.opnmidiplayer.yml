---
repository: https://github.com/Wohlstand/OPNMIDI-Player-Java.git
updates: releases
versions:
  - tag: v1.6.0
    apks:
      - apk_pattern: OPNMIDI-Player-android.*\.apk
        apk_url: https://github.com/Wohlstand/OPNMIDI-Player-Java/releases/download/v1.6.0/OPNMIDI-Player-android-v1.6.0.apk
        build:
          - export PIN_ALIAS="" DB_PASS_ALIAS=""
          - sed -r '/signingConfigs.releaseci/d' -i OPNMIDI-Player/build.gradle
          - ./gradlew assembleReleaseci
          - find . -name '*.apk'
          - mv OPNMIDI-Player/build/outputs/apk/releaseci/OPNMIDI-Player-releaseci-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages:
            - lftp
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk: 23.2.8568313
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
