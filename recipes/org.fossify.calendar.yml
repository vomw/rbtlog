---
repository: https://github.com/FossifyOrg/Calendar.git
updates: releases
notes:
  - 'FIXED: tag 1.0.3 needs manually adjusted soft-reset to embedded commit hash'
versions:
  - tag: 1.0.3
    apks:
      - apk_pattern: calendar-.*-foss-release\.apk
        apk_url: https://github.com/FossifyOrg/Calendar/releases/download/1.0.3/calendar-4-foss-release.apk
        build:
          - git reset --soft d7c25e566c907fb4a927b40c56856c24d4f4c848
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/foss/release/calendar-*-foss-release-unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
