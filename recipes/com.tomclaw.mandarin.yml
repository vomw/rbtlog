---
repository: https://github.com/solkin/mandarin-android.git
updates: disabled
notes:
  - ICQ was shut down in 6/2024, so the app does no longer work; see https://gitlab.com/IzzyOnDroid/repo/-/issues/617
versions:
  - tag: v1.30
    apks:
      - apk_pattern: mandarin-.*\.apk
        apk_url: https://github.com/solkin/mandarin-android/releases/download/v1.30/mandarin-306.apk
        build:
          - sed -r '/signingConfigs.release/d' -i app/build.gradle
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
