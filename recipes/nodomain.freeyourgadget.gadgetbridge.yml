---
repository: https://codeberg.org/Freeyourgadget/Gadgetbridge.git
updates: releases
versions:
  - tag: 0.87.0
    apks:
      - apk_pattern: gadgetbridge-.*\.apk
        apk_url: https://codeberg.org/Freeyourgadget/Gadgetbridge/releases/download/0.87.0/gadgetbridge-0.87.0.apk
        build:
          - ./gradlew assembleMainlineRelease
          - find . -name '*.apk'
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
          - reproducible-apk-tools/zipalign.py --page-align --pad-like-apksigner --replace app/build/outputs/apk/mainline/release/app-mainline-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages:
            - python3
          image: ubuntu:jammy
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
