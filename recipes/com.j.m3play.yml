---
repository: https://github.com/JAY01-CYBER/M3-Play.git
updates: releases
versions:
  - tag: v3.0.6
    apks:
      - apk_pattern: app-universal-release\.apk
        apk_url: https://github.com/JAY01-CYBER/M3-Play/releases/download/v3.0.6/app-universal-release.apk
        build:
          - sed -r '/signingConfigs \{/,/^    \}/d' -i app/build.gradle.kts
          - chmod +x gradlew
          - ./gradlew assembleUniversalRelease
          - find . -name '*.apk'
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
          - reproducible-apk-tools/zipalign.py --page-size 16 --pad-like-apksigner --replace app/build/outputs/apk/universal/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '20.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
            sha256: 04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7
          extra_packages:
            - python3
          image: debian:trixie-slim
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
