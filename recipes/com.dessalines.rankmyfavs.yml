  - tag: 0.6.5
    apks:
      - apk_pattern: app-release\.apk
        apk_url: https://github.com/dessalines/rank-my-favs/releases/download/0.6.5/app-release.apk
        build:
          - sed -r 's/signingConfigs.getByName\("(release|debug)"\)/signingConfigs.findByName("none")/' -i app/build.gradle.kts
          - chmod +x gradlew
          - PROF_FILE=app/build/intermediates/binary_art_profile/release/compileReleaseArtProfile/baseline.prof
          - PROF_SHA1=7d644a79d5523b455bea1f5782d505832f74da8f
          - for _ in {1..10}; do
          - ./gradlew clean assembleRelease --no-build-cache --no-configuration-cache --no-daemon
          - find . -name '*aseline.prof'
          - test -f "$PROF_FILE"
          - if [ "$( sha1sum "$PROF_FILE" | cut -d' ' -f1 )" = "$PROF_SHA1" ]; then
          - break
          - fi
          - done
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout: 40
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
