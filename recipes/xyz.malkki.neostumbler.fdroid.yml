---
repository: https://github.com/mjaakko/NeoStumbler.git
updates: releases
versions:
  - tag: 1.3.2
    apks:
      - apk_pattern: app-fdroid-release.apk
        apk_url: https://github.com/mjaakko/NeoStumbler/releases/download/1.3.2/app-fdroid-release.apk
        build:
          - sed -r '/signingConfig.release/d' -i app/build.gradle
          - export SIGNING_STORE_PASSWORD=dummypass SIGNING_KEY_ALIAS=dummy SIGNING_KEY_PASSWORD=dummypass
          - keytool -genkey -v -keystore keystore.jks -alias $SIGNING_KEY_ALIAS -keyalg RSA -keysize 4096 -sigalg SHA512withRSA -validity 10000 -dname "cn=dummy" -storepass $SIGNING_STORE_PASSWORD -keypass $SIGNING_KEY_PASSWORD
          - ./gradlew assembleFdroidRelease
          - mv app/build/outputs/apk/fdroid/release/app-fdroid-release.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
