---
repository: https://github.com/daisukiKaffuChino/RebootNya.git
updates: releases
versions:
  - tag: 1.7.1
    apks:
      - apk_pattern: RebootNya.*\.apk
        apk_url: https://github.com/daisukiKaffuChino/RebootNya/releases/download/1.7.1/RebootNya_1.7.1.apk
        build:
          - git checkout f9617535d2cf4795f0c488214c44edb93571c2aa
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages: []
          image: debian:trixie-slim
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
