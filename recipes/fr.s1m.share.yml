---
repository: https://codeberg.org/s1m/bubble-share.git
updates: releases
versions:
  - tag: 0.2.0
    apks:
      - apk_pattern: bubbleshare\.apk
        apk_url: https://codeberg.org/s1m/bubble-share/releases/download/0.2.0/bubbleshare.apk
        build:
          - sed -ri '/foojay/d ; /toolchainVendor/d' gradle/gradle-daemon-jvm.properties
          - ./gradlew reproduceUniversal
          - unzip -p universal.apks universal.apk > /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '22.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
            sha256: 4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583
          extra_packages: []
          image: ubuntu:noble
          jdk: openjdk-25-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
