---
repository: https://github.com/daitj/Easycontrol.git
updates: releases
versions:
  - tag: v1.0.1
    apks:
      - apk_pattern: com.daitj.easycontrolfork.*\.apk
        apk_url: https://github.com/daitj/Easycontrol/releases/download/v1.0.1/com.daitj.easycontrolfork_10001.apk
        build:
          - echo -e "MY_KEYSTORE_FILE=/dev/null\nMY_KEYSTORE_PASSWORD=MY_KEYSTORE_PASSWORD\nMY_KEY_ALIAS=MY_KEY_ALIAS\nMY_KEY_PASSWORD=MY_KEY_PASSWORD" > keystore.properties
          - cd easycontrolfork
          - sed -r '/signingConfigs.release/d' -i app/build.gradle
          - ./gradlew assembleRelease -p server
          - ./gradlew copyRelease -p server
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
