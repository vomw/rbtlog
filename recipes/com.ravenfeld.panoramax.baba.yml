---
repository: https://gitlab.com/ravenfeld/baba.git
updates: releases
notes:
  - 'FIXME: versionCode depends on build time, and thus must be updated manually for each release'
versions:
  - tag: 1.7.0
    apks:
      - apk_pattern: baba_.*-arm64-v8a-release\.apk
        apk_url: https://gitlab.com/api/v4/projects/64819359/packages/generic/my_package/1.7.0/baba_1.7.0-arm64-v8a-release.apk
        build:
          - sed -r 's/isUniversalApk = true/isUniversalApk = false/ ; s/include\(.*/include("arm64-v8a")/' -i app/build.gradle.kts
          - sed -r '/signingConfigs.findByName/d' -i app/build.gradle.kts
          - sed -r 's/versionCode \= Integer.*/versionCode = 2025030601/' -i build-gradle-plugin-configurator/src/main/kotlin/kmp/BaseApplication.kt
          - touch android-signing-keystore.jks
          - echo -e "signing_keystore_password=signing_keystore_password\nsigning_key_alias=signing_key_alias\nsigning_key_password=signing_key_password" > secrets.properties
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/*arm64-v8a-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
