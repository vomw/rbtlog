---
repository: https://github.com/CDrummond/squeezelite.git
updates: releases
versions:
  - tag: 0.5.0
    apks:
      - apk_pattern: squeezelite.*\.apk
        apk_url: https://github.com/CDrummond/squeezelite/releases/download/0.5.0/squeezelite-0.5.0.apk
        build:
          - cd android
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/craig
        build_repo_dir: /home/craig/Development/squeezelite
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages:
            - cmake
            - lbzip2
            - libtool
            - make
            - meson
            - ninja-build
            - pkg-config
            - xz-utils
            - python3
          image: ubuntu:noble
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
