---
repository: https://github.com/d4rken-org/permission-pilot.git
updates: releases
notes:
  - embedded timestamp plus 2 other diffs in dex, see https://github.com/d4rken-org/permission-pilot/issues/206
versions:
  - tag: v1.8.3-rc0
    apks:
      - apk_pattern: eu.darken.myperm-.*-FOSS-RELEASE-.*\.apk
        apk_url: https://github.com/d4rken-org/permission-pilot/releases/download/v1.8.3-rc0/eu.darken.myperm-v1.8.3-rc0-10803000-FOSS-RELEASE-e34b951.apk
        build:
          - sed -r '/    signingConfigs \{/,/^    \}/d ; s/signingConfigs\[.*\]/null/' -i app/build.gradle.kts
          - ./gradlew assembleFossRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/foss/release/eu.darken.myperm-*-FOSS-RELEASE-*apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '20.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
            sha256: 04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7
          extra_packages: []
          image: debian:bookworm
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
