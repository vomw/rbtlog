updates: releases
versions:
  - tag: v1.0.5
    apks:
      - apk_pattern: gfroerli-android-.*\.apk
        apk_url: https://github.com/gfroerli/app-android/releases/download/v1.0.5/gfroerli-android-1.0.5.apk
        build:
          - base64 -d > app/secrets.properties <<< Z2Zyb2VybGlfYXBpX2tleV9wdWJsaWM9dWFtZWxIcWJjeUxNcmxnMWlFUmZ0OVp4UkFTVEtLNkdxYkxUVjFJZzRpN0l5bEt4Z2pydVRvT0ZwUVBnM0FKUgptYXBib3hfYWNjZXNzX3Rva2VuPXBrLmV5SjFJam9pWTI5eVpXUjFiWEJqYUNJc0ltRWlPaUpqYVc5emRqRmhZell3TURJM2RubHRNalZzWXpkeFpHaHRJbjAuZU9mUFNrSnlXTXoxZEh6SlpySHVWdwo=
