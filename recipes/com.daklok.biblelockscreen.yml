---
repository: https://github.com/DaKlok/BibleLockScreen.git
updates: releases
versions:
  - tag: '1.2'
    apks:
      - apk_pattern: app-release\.apk
        apk_url: https://github.com/DaKlok/BibleLockScreen/releases/download/1.2/app-release.apk
        build:
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
          - OUT=app/build/outputs/apk/release/app-release-unsigned.apk
          - reproducible-apk-tools/inplace-fix.py --internal --page-size 16 fix-newlines "$OUT" 'assets/*json'
          - mv "$OUT" /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '20.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
            sha256: 04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
