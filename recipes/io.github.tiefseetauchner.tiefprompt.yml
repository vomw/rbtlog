---
repository: https://github.com/Tiefseetauchner/tiefprompt.git
updates: releases
versions:
  - tag: v1.0.3
    apks:
      - apk_pattern: foss_app-arm64-v8a-release\.apk
        apk_url: https://github.com/Tiefseetauchner/tiefprompt/releases/download/v1.0.3/foss_app-arm64-v8a-release.apk
        build:
          - sed -r '/signingConfigs.release/d ; /signingConfigs \{/,/^    \}/d' -i android/app/build.gradle
          - export PUB_CACHE=$(pwd)/.pub-cache
          - .flutter/bin/flutter config --no-analytics
          - .flutter/bin/flutter pub get
          - .flutter/bin/flutter build apk -t lib/main_foss.dart --release --split-per-abi
          - find . -name '*.apk'
          - mv build/app/outputs/apk/release/app-arm64-v8a-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_dirs: ['/app']
        build_home_dir: /build
        build_repo_dir: /app
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '20.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
            sha256: 04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7
          extra_packages:
            - curl
          image: ubuntu:noble
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
