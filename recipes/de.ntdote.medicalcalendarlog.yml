---
repository: https://codeberg.org/svewa/MedicalCalendarLog.git
updates: releases
versions:
  - tag: 1.0.8
    apks:
      - apk_pattern: MedicalCalendarLog.*signed\.apk
        apk_url: https://codeberg.org/svewa/MedicalCalendarLog/releases/download/1.0.8/MedicalCalendarLog-1.0.8-signed.apk
        build:
          - sed -r '/signingConfigs.getByName/d' -i app/build.gradle.kts
          - ./gradlew assemblePlaystore
          - find . -name '*.apk'
          - mv app/build/outputs/apk/playstore/app-playstore-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages: []
          image: debian:trixie-slim
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
