---
repository: https://github.com/LeanBitLab/LtvLauncher.git
updates: releases
versions:
  - tag: v3.2.1
    apks:
      - apk_pattern: LTvLauncher-arm64-v8a-release\.apk
        apk_url: https://github.com/LeanBitLab/LtvLauncher/releases/download/v3.2.1/LTvLauncher-arm64-v8a-release.apk
        build:
          - sed -r '/signingConfigs.(debug|release)/d' -i android/app/build.gradle
          - FLUTTER_VERSION="$(sed -rn 's/\s*flutter:\s\^?([0-9.]+)\s*$/\1/p' pubspec.yaml)"
          - git clone -b $FLUTTER_VERSION https://github.com/flutter/flutter
          - export PUB_CACHE=$(pwd)/.pub-cache
          - flutter/bin/flutter config --no-analytics
          - flutter/bin/flutter pub get
          - flutter/bin/flutter pub run build_runner build --delete-conflicting-outputs
          - flutter/bin/flutter build apk --release --split-per-abi --target-platform android-arm64
          - find . -name '*.apk'
          - mv build/app/outputs/apk/release/LTvLauncher-arm64-v8a-release*.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/arjun
        build_repo_dir: /home/arjun/extra/Projects/flauncher
        build_timeout:
        build_user: arjun
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages:
            - curl
          image: debian:trixie-slim
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
