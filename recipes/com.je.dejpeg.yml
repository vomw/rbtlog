---
repository: https://codeberg.org/dryerlint/dejpeg.git
updates: releases
notes:
  - ndk version set in app/build.gradle.kts
versions:
  - tag: v2.1
    apks:
      - apk_pattern: dejpeg-arm64-v8a.*\.apk
        apk_url: https://github.com/jeeneo/dejpeg/releases/download/v2.1/dejpeg-arm64-v8a_2.1.apk
        build:
          - rm -rf .git
          - sed -r 's/include ".*arm.*"\s*$/include "arm64-v8a"/ ; s/versionName "2.0"/versionName "2.1"/' -i app/build.gradle
          - sed -r 's!C:/~buildirs/\$\{project.name\}!/build/repo!i' -i build.gradle
          - git clone https://codeberg.org/IzzyOnDroid/gradlew.py.git
          - gradlew.py/gradlew.py --version 8.14 -v assembleRelease
          - find . -name '*.apk'
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
          - OUT="outputs/apk/release/dejpeg-release-arm64-v8a-*.apk"
          - reproducible-apk-tools/inplace-fix.py --internal --page-size 16 fix-newlines $OUT 'META-INF/services/*'
          - mv $OUT /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
  - tag: v2.2
    apks:
      - apk_pattern: dejpeg-arm64-v8a.*\.apk
        apk_url: https://github.com/jeeneo/dejpeg/releases/download/v2.2/dejpeg-arm64-v8a_2.2.apk
