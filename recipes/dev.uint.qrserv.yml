---
repository: https://github.com/uintdev/qrserv.git
updates: releases
versions:
  - tag: v2.7.4
    apks:
      - apk_pattern: qrserv-.*-armeabi-v7a\.apk
        apk_url: https://github.com/uintdev/qrserv/releases/download/v2.7.4/qrserv-v2_7_4-armeabi-v7a.apk
        build:
          - git config --global http.version HTTP/1.1
          - export PUB_CACHE=$(pwd)/.pub-cache
          - flutter/bin/flutter config --no-analytics
          - flutter/bin/flutter pub get
          - flutter/bin/flutter build apk --release --split-per-abi --target-platform android-arm
          - mv build/app/outputs/apk/release/app-armeabi-v7a-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/deck
        build_repo_dir: /home/deck/Development/src/qrserv
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - curl
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
