---
repository: https://github.com/richoux/les_sons_en_francais.git
updates: releases
notes:
  - 'FIXED: needed to inject gradle-8.0.2 with v1.2.2. – see https://github.com/richoux/les_sons_en_francais/issues/2'
versions:
  - tag: v1.2.2
    apks:
      - apk_pattern: les_sons_en_francais-.*\.apk
        apk_url: https://github.com/richoux/les_sons_en_francais/releases/download/v1.2.2/les_sons_en_francais-1.2.2.apk
        build:
          - sed -r '/signingConfigs.release/d' -i app/build.gradle
          - wget -q -O /tmp/gradle-8.0.2-bin.zip -- https://services.gradle.org/distributions/gradle-8.0.2-bin.zip
          - sha256sum -c <<< 'ff7bf6a86f09b9b2c40bb8f48b25fc19cf2b2664fd1d220cd7ab833ec758d0d7  /tmp/gradle-8.0.2-bin.zip'
          - unzip -q -d /opt /tmp/gradle-8.0.2-bin.zip
          - export PATH="${PATH}:/opt/gradle-8.0.2/bin"
          - gradle assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
  - tag: v1.7
    apks:
      - apk_pattern: app-release\.apk
        apk_url: https://github.com/richoux/les_sons_en_francais/releases/download/v1.7/app-release.apk
        build:
          - sed -r '/signingConfigs.release/d' -i app/build.gradle
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
