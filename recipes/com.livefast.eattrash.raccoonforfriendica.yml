---
repository: https://github.com/LiveFastEatTrashRaccoon/RaccoonForFriendica.git
updates: releases
notes:
  - starting with 1.0.0, we need ndk 28.2 for stripping, and JAVA_HOME so the build does not fail when it checks desktopApp/build.gradle.kts
versions:
  - tag: 0.1.0-beta20
    apks:
      - apk_pattern: RaccoonForFriendica-arm64-v8a-release\.apk
        apk_url: https://github.com/LiveFastEatTrashRaccoon/RaccoonForFriendica/releases/download/0.1.0-beta20/RaccoonForFriendica-arm64-v8a-release.apk
        build:
          - sed -r '/signingConfigs.getByName/d' -i composeApp/build.gradle.kts
          - sed -r 's/, "x86_64"// ; s/isUniversalApk = true/isUniversalApk = false/' -i composeApp/build.gradle.kts
          - base64 -d > core/utils/build.properties <<< c2VudHJ5X2Rzbj1odHRwczovL2Y2ZjIxMzAxM2ZhOGU4YjlkYTczNmZiMTkyNTk0YWQ4QG80NTA3OTc5NTMzNTE2ODAwLmluZ2VzdC5kZS5zZW50cnkuaW8vNDUwNzk3OTUzNTgxMDY0MAo=
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - mv composeApp/build/outputs/apk/release/RaccoonForFriendica-arm64-v8a-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
