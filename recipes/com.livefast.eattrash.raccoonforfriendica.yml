  - tag: 1.0.0
    apks:
      - apk_pattern: RaccoonForFriendica-arm64-v8a-release\.apk
        apk_url: https://github.com/LiveFastEatTrashRaccoon/RaccoonForFriendica/releases/download/1.0.0/RaccoonForFriendica-arm64-v8a-release.apk
        build:
          - export ANDROID_NDK=${ANDROID_HOME}/ndk/${PROVISIONING_NDK}
          - echo "ndk.dir=${ANDROID_NDK}" >> local.properties
          - sed -r '/signingConfigs.getByName/d ; /signingConfigs \{/,/^    \}/d' -i androidApp/build.gradle.kts
          - sed -r 's/, "x86_64"// ; s/isUniversalApk = true/isUniversalApk = false/' -i androidApp/build.gradle.kts
          - base64 -d > core/utils/build.properties <<< c2VudHJ5X2Rzbj1odHRwczovL2Y2ZjIxMzAxM2ZhOGU4YjlkYTczNmZiMTkyNTk0YWQ4QG80NTA3OTc5NTMzNTE2ODAwLmluZ2VzdC5kZS5zZW50cnkuaW8vNDUwNzk3OTUzNTgxMDY0MAo=
          - base64 -d > core/api/build.properties <<< aW5uZXJfdHJhbnNsYXRpb25fYXBpX3VybD1odHRwczovLzY1NS5tdGlzLndvcmtlcnMuZGV2L3RyYW5zbGF0ZQo=
          - chmod +x gradlew
