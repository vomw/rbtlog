---
repository: https://codeberg.org/nuclearfog/Nittterify.git
updates: releases
notes:
  - 2.1.1 has gradle checksum mismatch, temporarily worked around using gradlew.py
versions:
  - tag: 2.1.1
    apks:
      - apk_pattern: app-release\.apk
        apk_url: https://codeberg.org/nuclearfog/Nittterify/releases/download/2.1.1/app-release.apk
        build:
          - git clone https://codeberg.org/IzzyOnDroid/gradlew.py.git
          - gradlew.py/gradlew.py --version 8.11.1 -v assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
  - tag: 2.1.2
    apks:
      - apk_pattern: app-release\.apk
        apk_url: https://codeberg.org/nuclearfog/Nittterify/releases/download/2.1.2/app-release.apk
        build:
          - sed -r 's/versionCode 5/versionCode 6/ ; s/versionName "2.1.1"/versionName "2.1.2"/ ; s/targetSdkVersion 35/targetSdkVersion 36/ ; s/compileSdk 35/compileSdk 36/' -i app/build.gradle
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
