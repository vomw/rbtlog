      - apk_pattern: UPnP.Kino.*\.apk
        apk_url: https://github.com/naive-HA/UpnpKino/releases/download/2.1.0/UPnP.Kino.v2.1.0.apk
        build:
          - git reset --soft e49c0df01c21bdda1a4648394e7b87e2f21d71da
          - ./gradlew assembleRelease
          - find . -name '*.apk'
