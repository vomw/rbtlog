---
repository: https://github.com/mariinkys/OpenPillReminder.git
updates: releases
versions:
  - tag: 1.0.1
    apks:
      - apk_pattern: OpenPillReminder-.*\.apk
        apk_url: https://github.com/mariinkys/OpenPillReminder/releases/download/1.0.1/OpenPillReminder-1.0.1.apk
        build:
          - sed -r '/foojay/d' -i gradle/gradle-daemon-jvm.properties
          - export ANDROID_NDK=${ANDROID_HOME}/ndk/${PROVISIONING_NDK}
          - echo "ndk.dir=${ANDROID_NDK}" >> local.properties
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
          - reproducible-apk-tools/zipalign.py --page-size 16 --pad-like-apksigner --replace app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '20.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
            sha256: 04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7
          extra_packages:
            - python3
          image: debian:trixie-slim
          jdk: openjdk-21-jdk-headless
          ndk: 28.2.13676358
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
