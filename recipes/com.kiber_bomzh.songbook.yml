---
repository: https://github.com/KiberBomzh/songbook-gui.git
updates: releases
notes:
  - 'FIXME: 2.2.0 uses ugly android-37 work-around (double-run); 2.3.0 needed the same, see https://github.com/KiberBomzh/songbook-gui/issues/1 '
versions:
  - tag: 2.1.1
    apks:
      - apk_pattern: app-arm64-v8a-release\.apk
        apk_url: https://github.com/KiberBomzh/songbook-gui/releases/download/2.1.1/app-arm64-v8a-release.apk
        build:
          - FLUTTER_VERSION="$(sed -rn 's/^\s*flutter-version:\ .([0-9\.]*).*?/\1/p' .github/workflows/build.yml | head -n 1)"
          - git clone -b $FLUTTER_VERSION https://github.com/flutter/flutter
          - export PUB_CACHE=$(pwd)/.pub-cache
          - flutter/bin/flutter config --no-analytics
          - flutter/bin/flutter pub get
          - sed -i -e 's/-Wl,/-Wl,--build-id=none,/' ${PUB_CACHE}/hosted/*/jni-*/src/CMakeLists.txt
          - flutter/bin/flutter build apk --release --split-per-abi --target-platform=android-arm64
          - find . -name '*.apk'
          - mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/runner
        build_repo_dir: /home/runner/work/songbook-gui/songbook-gui
        build_timeout:
        build_user: runner
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '22.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
            sha256: 4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583
          extra_packages:
            - build-essential
            - curl
            - rustup
          image: ubuntu:noble
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
  - tag: 2.2.0
