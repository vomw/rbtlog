---
repository: https://github.com/fibelatti/pinboard-kotlin.git
updates: releases
notes:
  - v3.2 is flaky, adding the de-flaker
  - 'FIXME: next release after v3.5.0 will remove build flavors, so we need to adjust the build; see https://github.com/fibelatti/pinboard-kotlin/issues/396'
versions:
  - tag: v3.1
    apks:
      - apk_pattern: com.fibelatti.pinboard-.*-release\.apk
        apk_url: https://github.com/fibelatti/pinboard-kotlin/releases/download/v3.1/com.fibelatti.pinboard-v3.1-3010000-pinboardapi-release.apk
        build:
          - chmod +x gradlew
          - ./gradlew assemblePinboardapi
          - mv app/build/outputs/apk/pinboardapi/release/com.fibelatti.pinboard-*-pinboardapi-release-unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
