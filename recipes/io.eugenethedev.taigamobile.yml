---
repository: https://github.com/EugeneTheDev/TaigaMobile.git
updates: disabled
notes:
  - disabled as the repo was archived 2022-08-11
versions:
  - tag: v1.9
    apks:
      - apk_pattern: TaigaMobile-.*-release\.apk
        apk_url: https://github.com/EugeneTheDev/TaigaMobile/releases/download/v1.9/TaigaMobile-1.9-release.apk
        build:
          - sed -r '/signingConfigs.getByName/d' -i app/build.gradle.kts
          - echo -e "password=password\nalias=alias" > app/signing.properties
          - JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64 ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - openjdk-11-jdk-headless
          image: debian:bullseye-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
