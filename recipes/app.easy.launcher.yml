---
repository: https://github.com/CodeWorksCreativeHub/EasyLauncher.git
updates: releases
versions:
  - tag: 0.3.3
    apks:
      - apk_pattern: EasyLauncher-Internet.*\.apk
        apk_url: https://github.com/CodeWorksCreativeHub/EasyLauncher/releases/download/0.3.3/EasyLauncher-Internet-0.3.3-Signed.apk
        build:
          - base64 -d > weather.properties <<< V0VBVEhFUl9BUElfS0VZPWMyYTU2ZGMzYjg4NDY0MGE0OWM3ODljNmQ0MGI0MTYxCg==
          - ./gradlew assembleWithInternetRelease
          - find . -name '*.apk'
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
          - reproducible-apk-tools/zipalign.py --page-size 16 --pad-like-apksigner --replace app/build/outputs/apk/withInternet/release/app.easy.launcher_*-Release.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
