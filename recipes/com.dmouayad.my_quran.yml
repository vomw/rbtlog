---
repository: https://github.com/DMouayad/my_quran.git
updates: releases
notes:
  - starting with v1.7.5, the --dart-define is no longer needed, see https://github.com/DMouayad/my_quran/issues/56#issuecomment-4021624338
versions:
  - tag: v1.2.1
    apks:
      - apk_pattern: MyQuran-.*arm64-v8a.*-release\.apk
        apk_url: https://github.com/DMouayad/my_quran/releases/download/v1.2.1/MyQuran-v1.2.1-arm64-v8a-53-release.apk
        build:
          - sed -r '/signingConfigs.getByName/d' -i android/app/build.gradle.kts
          - FLUTTER_VERSION="$(cat .flutter-version)"
          - git clone -b $FLUTTER_VERSION https://github.com/flutter/flutter
          - export PUB_CACHE=$(pwd)/.pub-cache
          - flutter/bin/flutter config --no-analytics
          - flutter/bin/flutter pub get
          - flutter/bin/flutter build apk --release --split-per-abi --target-platform="android-arm64"
          - find . -name '*.apk'
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
          - reproducible-apk-tools/zipalign.py --page-size 16 --pad-like-apksigner --replace build/app/outputs/apk/release/MyQuran-*-arm64-v8a-*-release.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/runner
        build_repo_dir: /home/runner/work/my_quran/my_quran
        build_timeout:
        build_user: runner
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages:
            - curl
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
