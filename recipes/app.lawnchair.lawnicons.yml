---
repository: https://github.com/LawnchairLauncher/lawnicons.git
updates: releases
notes:
  - v2.13.0 + v2.14.0 fail RB, see https://github.com/LawnchairLauncher/lawnicons/issues/2552
versions:
  - tag: v2.10.1
    apks:
      - apk_pattern: Lawnicons.*\.apk
        apk_url: https://github.com/LawnchairLauncher/lawnicons/releases/download/v2.10.1/Lawnicons.2.10.1.v14_release.apk
        build:
          - sed -r '/signingConfig . releaseSigning/d' -i app/build.gradle.kts
          - sed -r 's/(val versionDisplayName = "\$version )\$\{if.*/\1"/' -i app/build.gradle.kts
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/app/release/Lawnicons*.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: ubuntu:jammy
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
