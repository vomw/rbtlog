---
repository: https://github.com/sverrejb/bru.git
updates: releases
versions:
  - tag: v1.1.1
    apks:
      - apk_pattern: works.bru-arm64-v8a\.apk
        apk_url: https://github.com/sverrejb/bru/releases/download/v1.1.1/works.bru-arm64-v8a.apk
        build:
          - cd android
          - sed -ri '/signingConfigs.findBy/d' app/build.gradle.kts
          - ./gradlew assembleArm64Release
          - find . -name '*.apk'
          - mv app/build/outputs/apk/arm64/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '22.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
            sha256: 4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
