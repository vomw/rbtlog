---
repository: https://github.com/Erbzur/Orange.git
updates: releases
versions:
  - tag: v1.1.0
    apks:
      - apk_pattern: lsposed.orange-.*-release\.apk
        apk_url: https://github.com/Erbzur/Orange/releases/download/v1.1.0/lsposed.orange-v1.1.0-release.apk
        build:
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - git clone -b v0.2.7 https://github.com/obfusk/reproducible-apk-tools.git
          - OUT=app/build/outputs/apk/release/lsposed.orange-*-release-unsigned.apk
          - reproducible-apk-tools/inplace-fix.py --internal --page-size 16 fix-newlines $OUT 'META-INF/services/*'
          - mv $OUT /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
