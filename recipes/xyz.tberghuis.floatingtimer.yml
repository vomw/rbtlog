---
repository: https://github.com/tberghuis/FloatingCountdownTimer.git
updates: releases
versions:
  - tag: v1.50.0
    apks:
      - apk_pattern: app-release\.apk
        apk_url: https://github.com/tberghuis/FloatingCountdownTimer/releases/download/v1.50.0/app-release.apk
        build:
          - sed -r '/(foojay|toolchainVendor)/d' -i gradle/gradle-daemon-jvm.properties
          - sed -r '/org.gradle.toolchains.foojay-resolver-convention/d' -i settings.gradle.kts
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '20.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
            sha256: 04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
  - tag: v1.51.0
    apks:
      - apk_pattern: app-release\.apk
        apk_url: https://github.com/tberghuis/FloatingCountdownTimer/releases/download/v1.51.0/app-release.apk
        build:
          - sed -r '/(foojay|toolchainVendor)/d' -i gradle/gradle-daemon-jvm.properties
          - sed -r '/org.gradle.toolchains.foojay-resolver-convention/d' -i settings.gradle.kts
          - mkdir -p ${ANDROID_HOME}/ndk
          - unzip -q "${PROVISIONING_CACHE_ANDROID_NDK_PATH}" -d ${ANDROID_HOME}/ndk
          - mv ${ANDROID_HOME}/ndk/android-ndk-r${PROVISIONING_CACHE_ANDROID_NDK_VERSION:0:2}? ${ANDROID_HOME}/ndk/${PROVISIONING_CACHE_ANDROID_NDK_VERSION}
          - export ANDROID_NDK=${ANDROID_HOME}/ndk/${PROVISIONING_CACHE_ANDROID_NDK_VERSION}
          - echo "ndk.dir=${ANDROID_NDK}" >> local.properties
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cached_tools:
            - name: android-ndk
              file_name: android-ndk.zip
              version: 28.2.13676358
              url: https://dl.google.com/android/repository/android-ndk-r28c-linux.zip
              sha256: dfb20d396df28ca02a8c708314b814a4d961dc9074f9a161932746f815aa552f
          cmake:
          cmdline_tools:
            version: '20.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
            sha256: 04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
