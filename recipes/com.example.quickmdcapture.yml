---
repository: https://github.com/Fertion/QuickMDCapture.git
updates: releases
notes:
  - v1.1.1 needed manual adjustments, see https://github.com/Fertion/QuickMDCapture/issues/1
versions:
  - tag: 1.1.1
    apks:
      - apk_pattern: app-release\.apk
        apk_url: https://github.com/Fertion/QuickMDCapture/releases/download/1.1.1/app-release.apk
        build:
          - git checkout 633fd0b87d39a876be2ca9f95fd7eb3c929e9ab5
          - git reset --soft 88ad0aa4264061952cbbe9f767d8fd0b328672cf
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - git clone -b v0.2.8 https://github.com/obfusk/reproducible-apk-tools.git
          - OUT=app/build/outputs/apk/release/app-release-unsigned.apk
          - reproducible-apk-tools/inplace-fix.py --internal --page-size 16 fix-newlines "$OUT" 'META-INF/services/*'
          - mv "$OUT" /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
  - tag: 1.2.0
    apks:
      - apk_pattern: QuickMDCapture.*-release\.apk
        apk_url: https://github.com/Fertion/QuickMDCapture/releases/download/1.2.0/QuickMDCapture.1.2.0-release.apk
        build:
          - git reset --soft cac30cb805f9ae994b44048e787e2ccccc9aa4b1
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
          - OUT="app/build/outputs/apk/release/QuickMDCapture ${APP_TAG}-release-unsigned.apk"
          - reproducible-apk-tools/inplace-fix.py --internal --page-size 16 fix-newlines "$OUT" 'META-INF/services/*'
          - mv "$OUT" /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
