---
repository: https://github.com/maxrave-dev/SimpMusic.git
updates: releases
notes:
  - flaky build (up to 0.2.7 at least, 0.2.8 succeeded on the first round again)
  - per-ABI builds since v0.2.11
  - JARs MediaServiceCore/SharedModules/appupdatechecker[2]/libs/melautils.jar ffmpeg-kit/ffmpeg-kit-release.aar
  - RB broken since v0.2.20, see https://github.com/maxrave-dev/SimpMusic/issues/1094#issuecomment-3241623465
  - v1.0.1 had its FOSS APKs withdrawn due to crash-at-start, see https://github.com/maxrave-dev/SimpMusic/issues/1539
versions:
  - tag: v0.2.3-hf2
    apks:
      - apk_pattern: SimpMusic_.*\.apk
        apk_url: https://github.com/maxrave-dev/SimpMusic/releases/download/v0.2.3-hf2/SimpMusic_v0.2.3-hf2.apk
        build:
          - chmod +x gradlew
          - DEX_FILE=app/build/intermediates/dex/release/minifyReleaseWithR8/classes2.dex
          - DEX_SHA1=4a11cf70412fa3961727d13d503cd8b9b4f34399
          - for _ in {1..10}; do
          - ./gradlew clean assembleRelease --no-build-cache --no-configuration-cache --no-daemon
          - if [ "$( sha1sum "$DEX_FILE" | cut -d' ' -f1 )" = "$DEX_SHA1" ]; then
          - break
          - fi
          - done
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
