---
repository: https://github.com/mkckr0/audio-share.git
updates: releases
versions:
  - tag: v0.3.4
    apks:
      - apk_pattern: audio-share-app-.*-release\.apk
        apk_url: https://github.com/mkckr0/audio-share/releases/download/v0.3.4/audio-share-app-0.3.4-release.apk
        build:
          - cd android-app
          - echo -e "storeFile=/dev/null\nkeyAlias=keyAlias\nstorePassword=storePassword\nkeyPassword=keyPassword" > keystore.properties
          - sed -r '/signingConfigs\[/d' -i app/build.gradle.kts
          - chmod +x gradlew
          - PROF_FILE=app/build/intermediates/binary_art_profile/release/compileReleaseArtProfile/baseline.prof
          - PROF_SHA1=b2c53f90b3338b5e5f2d7ddb018aaaf18d3f870c
          - for _ in {1..10}; do
          - ./gradlew clean assembleRelease --no-build-cache --no-configuration-cache --no-daemon
          - test -f "$PROF_FILE"
          - if [ "$( sha1sum "$PROF_FILE" | cut -d' ' -f1 )" = "$PROF_SHA1" ]; then
          - break
          - fi
          - done
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus: 6
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
