---
repository: https://github.com/atomofiron/android-wifi-seeker.git
updates: releases
notes:
  - 'FIXME: 2.2.0 & 2.2.1 were built from non-existing commit, see https://github.com/atomofiron/android-wifi-seeker/issues/4 (rbtlog can handle that automatically, but when fixed we need to clean up)'
versions:
  - tag: release-2.2.0
    apks:
      - apk_pattern: wifi-seeker.*\.apk
        apk_url: https://github.com/atomofiron/android-wifi-seeker/releases/download/release-2.2.0/wifi-seeker-v2.2.0.apk
        build:
          - git clone https://codeberg.org/IzzyOnDroid/gradlew.py
          - gradlew.py/gradlew.py -v assembleRelease
          - find . -name '*.apk'
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
          - OUT=app/build/outputs/apk/release/app-release-unsigned.apk
          - reproducible-apk-tools/inplace-fix.py --internal --zipalign fix-files $OUT 'sed s/eb223beb3066e38e6a1c6dfb490422ca45d63ae7/02ab1679b40706fecbefbd1e9bd20e0f68733326/' 'META-INF/version-control-info.textproto'
          - mv $OUT /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
  - tag: v2.2.1
    apks:
      - apk_pattern: wifi-seeker.*\.apk
        apk_url: https://github.com/atomofiron/android-wifi-seeker/releases/download/v2.2.1/wifi-seeker-v2.2.1.apk
        build:
          - git clone https://codeberg.org/IzzyOnDroid/gradlew.py
          - gradlew.py/gradlew.py -v assembleRelease
          - find . -name '*.apk'
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
          - OUT=app/build/outputs/apk/release/app-release-unsigned.apk
          - reproducible-apk-tools/inplace-fix.py --internal --zipalign fix-files $OUT 'sed s/f54920f898db49c5056217fb9ee85fb7410b2b7f/6c043c772adf2d6b80530b0d0a8d03befd5d87db/' 'META-INF/version-control-info.textproto'
          - mv $OUT /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
  - tag: v2.3.0
    apks:
      - apk_pattern: wifi.seeker.*\.apk
        apk_url: https://github.com/atomofiron/android-wifi-seeker/releases/download/v2.3.0/wifi_seeker_v2.3.0.apk
        build:
          - sed -ri '/foojay/d ; /toolchainVendor/d' gradle/gradle-daemon-jvm.properties
          - git clone https://codeberg.org/IzzyOnDroid/gradlew.py
          - gradlew.py/gradlew.py --version 9.8.0 -v assembleRelease
          - find . -name '*.apk'
          - mkdir reproducible-apk-tools
          - tar xf "${PROVISIONING_CACHE_REPRO_APK_PATH}" --strip-components=1 -C reproducible-apk-tools/
          - OUT=app/build/outputs/apk/release/app-release-unsigned.apk
          - mv $OUT /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cached_tools:
            - name: repro-apk
              file_name: repro-apk.tar.gz
              version: v0.3.2
              url: https://gitlab.com/fdroid/reproducible-apk-tools/-/archive/v0.3.2/reproducible-apk-tools-v0.3.2.tar.gz
              sha256: e71566c1d5233d9ee6f87c107c5c04aaf1afd69f0a4166b0e93c907151405c2f
          cmake:
          cmdline_tools:
            version: '22.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
            sha256: 4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583
          extra_packages:
            - python3
          image: ubuntu:noble
          jdk: openjdk-25-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
