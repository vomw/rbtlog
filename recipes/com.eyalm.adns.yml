        build:
          - chmod +x gradlew
          - ./gradlew assembleFossRelease
          - find . -name '*.apk'
          - mkdir reproducible-apk-tools
          - tar xf "${PROVISIONING_CACHE_REPRO_APK_PATH}" --strip-components=1 -C reproducible-apk-tools/
          - OUT="app/build/outputs/apk/foss/release/app-foss-release-unsigned.apk"
          - reproducible-apk-tools/inplace-fix.py --internal --page-size 16 fix-newlines "$OUT" 'assets/locales/nextdns/ar.json' 'assets/locales/nextdns/bg.json' 'assets/locales/nextdns/cs.json' 'assets/locales/nextdns/d*.json' 'assets/locales/nextdns/el.json' 'assets/locales/nextdns/es.json' 'assets/locales/nextdns/et.json' 'assets/locales/nextdns/f*.json' 'assets/locales/nextdns/hi.json' 'assets/locales/nextdns/hu.json' 'assets/locales/nextdns/i*.json' 'assets/locales/nextdns/ja.json' 'assets/locales/nextdns/ko.json' 'assets/locales/nextdns/n*.json' 'assets/locales/nextdns/p*.json' 'assets/locales/nextdns/ru.json' 'assets/locales/nextdns/sv.json' 'assets/locales/nextdns/th.json' 'assets/locales/nextdns/uk.json' 'assets/locales/nextdns/vi.json' 'assets/locales/nextdns/z*.json'
          - mv "$OUT" /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
