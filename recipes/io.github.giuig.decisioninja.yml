---
repository: https://github.com/Giuig/decisioninja.git
updates: releases
versions:
  - tag: 1.6.3
    apks:
      - apk_pattern: decisioninja-.*-arm64-v8a\.apk
        apk_url: https://github.com/Giuig/decisioninja/releases/download/1.6.3/decisioninja-1.6.3-arm64-v8a.apk
        build:
          - FLUTTER_VERSION="$(cat flutter-version)"
          - git clone -b $FLUTTER_VERSION https://github.com/flutter/flutter
          - export PUB_CACHE=$(pwd)/.pub-cache
          - flutter/bin/flutter config --no-analytics
          - flutter/bin/flutter pub get
          - flutter/bin/flutter build apk --release --split-per-abi --no-tree-shake-icons --split-debug-info=build/debug-info --target-platform="android-arm64"
          - find . -name '*.apk'
          - mv build/app/outputs/flutter-apk/*arm64-v8a*.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/runner
        build_repo_dir: /home/runner/work/decisioninja/decisioninja
        build_timeout:
        build_user: runner
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '20.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
            sha256: 04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7
          extra_packages:
            - curl
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
  - tag: 1.6.4
    apks:
      - apk_pattern: decisioninja-.*-arm64-v8a\.apk
        apk_url: https://github.com/Giuig/decisioninja/releases/download/1.6.4/decisioninja-1.6.4-arm64-v8a.apk
        build:
          - FLUTTER_VERSION="$(cat flutter-version)"
          - git clone -b $FLUTTER_VERSION https://github.com/flutter/flutter
          - export PUB_CACHE=$(pwd)/.pub-cache
          - flutter/bin/flutter config --no-analytics
          - flutter/bin/flutter pub get
          - flutter/bin/flutter build apk --release --split-per-abi --no-tree-shake-icons --split-debug-info=build/debug-info --target-platform="android-arm64"
          - find . -name '*.apk'
          - mv build/app/outputs/flutter-apk/*arm64-v8a*.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/runner
        build_repo_dir: /home/runner/work/decisioninja/decisioninja
        build_timeout:
        build_user: runner
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '22.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
            sha256: 4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583
          extra_packages:
            - curl
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
