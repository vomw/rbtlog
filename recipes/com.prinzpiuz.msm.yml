---
repository: https://github.com/prinzpiuz/MSM.git
updates: releases
versions:
  - tag: 1.9.0
    apks:
      - apk_pattern: app-armeabi-v7a-release\.apk
        apk_url: https://github.com/prinzpiuz/MSM/releases/download/1.9.0/app-armeabi-v7a-release.apk
        build:
          - sed -r '/signingConfigs.release/d' -i android/app/build.gradle
          - FLUTTER_VERSION="$(sed -rn 's/\s*\bflutter:\s\^?([0-9.]+)\s*$/\1/p' pubspec.yaml)"
          - git clone -b $FLUTTER_VERSION https://github.com/flutter/flutter
          - export PUB_CACHE=$(pwd)/.pub-cache
          - flutter/bin/flutter config --no-analytics
          - flutter/bin/flutter pub get
          - flutter/bin/flutter build apk --split-per-abi --no-shrink --no-tree-shake-icons --build-name="${APP_TAG}" --release --target-platform android-arm
          - mv build/app/outputs/apk/release/app-armeabi-v7a-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/runner
        build_repo_dir: /home/runner/work/MSM/MSM
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - curl
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
