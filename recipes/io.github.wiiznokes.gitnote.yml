---
repository: https://github.com/wiiznokes/gitnote.git
updates: releases
notes:
  - jniLibs can probably be built from source, the corresoponding git submodule is in app/libgit2-android
versions:
  - tag: 25.05.5
    apks:
      - apk_pattern: gitnote-release.*\.apk
        apk_url: https://github.com/wiiznokes/gitnote/releases/download/25.05.5/gitnote-release-25.05.5.apk
        build:
          - sed -r '/signingConfigs.getByName/d' -i app/build.gradle.kts
          - sed -r '/create\("release"\) \{/,/        \}/d' -i app/build.gradle.kts
          - git clone https://codeberg.org/IzzyOnDroid/gradlew.py.git
          - gradlew.py/gradlew.py -v assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - python3
            - git-lfs
          image: ubuntu:jammy
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
