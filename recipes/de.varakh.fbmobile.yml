---
repository: https://git.myservermanager.com/varakh/fbmobile.git
forge_type: forgejo
updates: releases
notes:
  - https://gitlab.com/IzzyOnDroid/repo/-/issues/417#note_2611414692
  - https://git.myservermanager.com/varakh/fbmobile/src/branch/master/android/fastlane/buildAndroidProductionFdroid.sh
  - have to build all ABIs due to binary-manifest-messed-up gradle bug
versions:
  - tag: 1.6.8+26
    apks:
      - apk_pattern: app-arm64-v8a-release\.apk
        apk_url: https://git.myservermanager.com/varakh/fbmobile/releases/download/1.6.8+26/app-arm64-v8a-release.apk
        build:
          - sed -r '/signingConfigs.(release|debug)/d' -i android/app/build.gradle
          - FLUTTER_VERSION="$(sed -rn 's/^\s*flutter:\s\^?([0-9.]+)\s*$/\1/p' pubspec.yaml)"
          - git clone -b $FLUTTER_VERSION https://github.com/flutter/flutter
          - export PUB_CACHE=$(pwd)/.pub-cache
          - flutter/bin/flutter config --no-analytics
          - flutter/bin/flutter pub get
          - flutter/bin/flutter packages pub run build_runner build --delete-conflicting-outputs
          - flutter/bin/flutter build apk --dart-define=FDROID_BUILD=true --release --split-per-abi
          - find . -name '*.apk'
          - mv build/app/outputs/apk/release/app-arm64-v8a-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/alexander
        build_repo_dir: /home/alexander/Workspaces/varakh/fbmobile
        build_timeout: 30
        build_user: alexander
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages:
            - curl
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
