---
repository: https://gitlab.com/toz12/PublicArtExplorer.git
updates: releases
versions:
  - tag: v1.0.0
    apks:
      - apk_pattern: app-foss-release\.apk
        apk_url: https://gitlab.com/-/project/69658398/uploads/f38ee77e29df7e12ab392e5129eaba19/app-foss-release.apk
        build:
          - git checkout aaebde120b3d78c64e60e101e3247b1bac39e831
          - chmod +x gradlew
          - ./gradlew assembleFossRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/foss/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
