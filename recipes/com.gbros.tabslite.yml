---
repository: https://github.com/More-Than-Solitaire/Tabs-Lite.git
updates: releases
notes:
  - v3.6.5 broke RB by switching to JDK 23 (non-LTS), see https://github.com/More-Than-Solitaire/Tabs-Lite/issues/142
versions:
  - tag: v3.5.2
    apks:
      - apk_pattern: TabsLite\..*\.apk
        apk_url: https://github.com/More-Than-Solitaire/Tabs-Lite/releases/download/v3.5.2/TabsLite.v3.5.2.apk
        build:
          - git reset --soft a10b12da5d056b06a09d1574621c0c1c5ecef0af
          - sed -r '/signingConfigs.getByName/d' -i app/build.gradle.kts
          - sed -r '/gbrosLLC-keystore.jks/d' -i app/build.gradle.kts
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - git clone -b v0.2.7 https://github.com/obfusk/reproducible-apk-tools.git
          - OUT=app/build/outputs/apk/release/app-release-unsigned.apk
          - reproducible-apk-tools/inplace-fix.py --internal --page-size 16 fix-newlines "$OUT" 'assets/*.json'
          - reproducible-apk-tools/inplace-fix.py --internal --page-size 16 fix-newlines "$OUT" 'META-INF/services/*'
          - mv "$OUT" /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
