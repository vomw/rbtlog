---
repository: https://github.com/niendo1/ImapNotes3.git
updates: releases
versions:
  - tag: v1.4-04
    apks:
      - apk_pattern: ImapNotes3-.*-release\.apk
        apk_url: https://github.com/niendo1/ImapNotes3/releases/download/v1.4-04/ImapNotes3-v1.4-04-release.apk
        build:
          - sed -r '/signingConfigs.release/d' -i ImapNotes3/build.gradle
          - ./gradlew assembleRelease
          - mv ImapNotes3/build/outputs/apk/release/ImapNotes3-*-release.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: ubuntu:jammy
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
