---
repository: https://github.com/marlboro-advance/mpvEx.git
updates: releases
versions:
  - tag: v1.0.0
    apks:
      - apk_pattern: mpvEx-arm64-v8a.*\.apk
        apk_url: https://github.com/marlboro-advance/mpvEx/releases/download/v1.0.0/mpvEx-arm64-v8a-v1.0.0.apk
        build:
          - sed -r 's/include\(.*/include("arm64-v8a")/' -i app/build.gradle.kts
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
