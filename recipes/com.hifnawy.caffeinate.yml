---
repository: https://github.com/abdalmoniem/Caffeinate.git
updates: releases
versions:
  - tag: v1.4.5
    apks:
      - apk_pattern: com.hifnawy.caffeinate_release.*\.apk
        apk_url: https://github.com/abdalmoniem/Caffeinate/releases/download/v1.4.5/com.hifnawy.caffeinate_release_v1.4.5.apk
        build:
          - sed -r '/signingConfigs.findByName/d' -i app/build.gradle.kts
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/com.hifnawy.caffeinate_release_*.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
