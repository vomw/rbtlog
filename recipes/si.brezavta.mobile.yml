---
repository: https://gitlab.com/derp-si/slovenijaRT.git
updates: releases
versions:
  - tag: 1.3.8
    apks:
      - apk_pattern: brezavta.*\.apk
        apk_url: https://gitlab.com/api/v4/projects/55942970/packages/generic/android/1.3.8/brezavta-1.3.8.apk
        build:
          - sed -ri '/signingConfigs.release/d ; /signingConfigs \{/,/^    \}/d' android/app/build.gradle
          - tar xf "${PROVISIONING_CACHE_NODEJS_LTS_PATH}" -C /opt
          - export PATH="${PATH}:/opt/node-${PROVISIONING_CACHE_NODEJS_LTS_VERSION}-linux-x64/bin:${HOME}/.node/bin"
          - export GRADLE_USER_HOME=/opt/gradle
          - npm install
          - npm run generate
          - npm run build
          - ./node_modules/.bin/cap sync android
          - cd android
          - ./gradlew :app:assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cached_tools:
            - name: nodejs-lts
              file_name: nodejs-lts.tar.xz
              version: v24.21.0
              url: https://nodejs.org/dist/v24.21.0/node-v24.21.0-linux-x64.tar.xz
              sha256: fd8e59d5a511510f6a298afb548f18c7d2b1be404d8b4a27d94fbe49f56cb2d6
          cmake:
          cmdline_tools:
            version: '22.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
            sha256: 4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583
          extra_packages:
            - xz-utils
          image: ubuntu:noble
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
