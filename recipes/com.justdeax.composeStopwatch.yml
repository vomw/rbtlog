---
repository: https://github.com/JustDeax/ComposeStopwatch.git
updates: releases
notes:
  - 'FIXED: 1.1.6 needs soft-reset to embedded commithash'
versions:
  - tag: 1.1.6_RELEASE
    apks:
      - apk_pattern: compose-stopwatch-.*\.apk
        apk_url: https://github.com/JustDeax/ComposeStopwatch/releases/download/1.1.6_RELEASE/compose-stopwatch-1.1.6-release.apk
        build:
          - git reset --soft 746a1da867d7b874559c2bcb5ddd4c17a38d9597
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
