---
repository: https://github.com/maelchiotti/LocalMaterialNotes.git
updates: releases
versions:
  - tag: v1.7.2
    apks:
      - apk_pattern: localmaterialnotes_arm64-v8a_.*\.apk
        apk_url: https://github.com/maelchiotti/LocalMaterialNotes/releases/download/v1.7.2/localmaterialnotes_arm64-v8a_v1.7.2.apk
        build:
          - sed -r '/signingConfigs.release/d' -i android/app/build.gradle
          - flutter_version=$(sed -rn 's/^\s*flutter\:\s*([0-9.]+)$/\1/p' pubspec.yaml)
          - git clone -b $flutter_version https://github.com/flutter/flutter
          - export PUB_CACHE=$(pwd)/.pub-cache
          - flutter/bin/flutter config --no-analytics
          - flutter/bin/flutter pub get
          - flutter/bin/flutter build apk --release --split-per-abi --target-platform="android-arm64"
          - mv build/app/outputs/apk/release/app-arm64-v8a-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/runner
        build_repo_dir: /home/runner/work/LocalMaterialNotes/LocalMaterialNotes
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - curl
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
  - tag: v1.8.0
