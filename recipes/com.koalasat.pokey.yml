---
repository: https://github.com/KoalaSat/pokey.git
updates: releases
versions:
  - tag: v0.2.1-beta
    apks:
      - apk_pattern: pokey-universal-.*\.apk
        apk_url: https://github.com/KoalaSat/pokey/releases/download/v0.2.1-beta/pokey-universal-v0.2.1-beta.apk
        build:
          - sed -r 's/include\(.+\)/include("arm64-v8a")/' -i app/build.gradle.kts
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/app-universal-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
