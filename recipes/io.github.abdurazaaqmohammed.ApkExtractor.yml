---
repository: https://github.com/AbdurazaaqMohammed/APKExtractor.git
updates: releases
notes:
  - release 1.1 needed manual adjutment of the commit as a file was missing to be checked in
  - removal of .git in 1.1 was necessary as author built release 1.1 outside the git repo, see https://github.com/AbdurazaaqMohammed/APKExtractor/issues/1
versions:
  - tag: '1.1'
    apks:
      - apk_pattern: app-release\.apk
        apk_url: https://github.com/AbdurazaaqMohammed/APKExtractor/releases/download/1.1/app-release.apk
        build:
          - git checkout d0b1cf811c01a57ba0bae471f24a109135915c49
          - rm -rf .git
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
