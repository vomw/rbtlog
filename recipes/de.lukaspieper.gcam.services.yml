---
repository: https://github.com/lukaspieper/Gcam-Services-Provider.git
updates: releases
notes:
  - 'FIXME: v1.5.1 was build from the commit next to the one of the tag, to adjust versioning'
versions:
  - tag: v1.5.1
    apks:
      - apk_pattern: app-basic-release\.apk
        apk_url: https://github.com/lukaspieper/Gcam-Services-Provider/releases/download/v1.5.1/app-basic-release.apk
        build:
          - sed -r 's/versionCode 6/versionCode 7/;s/versionName "1.5"/versionName "1.5.1"/' -i app/build.gradle
          - ./gradlew assembleBasicRelease -x lint -x lintVitalBasicRelease
          - mv app/build/outputs/apk/basic/release/app-basic-release-unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
