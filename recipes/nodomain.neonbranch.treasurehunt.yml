---
repository: https://codeberg.org/neonbranch/treasurehunt.git
updates: releases
notes:
  - 'FIXME: 0.6.1 was built from a different commit at a dirty tree; remove the versionName adjustment before building the next one'
versions:
  - tag: v0.5.8
    apks:
      - apk_pattern: treasurehunt.*\.apk
        apk_url: https://gitlab.com/api/v4/projects/75805043/packages/generic/schatzsuche/1.0.0/treasurehunt-0.5.8.apk
        build:
          - sed -r '/signingConfigs.release/d ; /signingConfigs \{/,/^    \}/d' -i android/app/build.gradle
          - FLUTTER_VERSION="$(sed -rn 's/\s*\bflutter:\s\^?([0-9.]+)\s*$/\1/p' pubspec.yaml)"
          - git clone -b $FLUTTER_VERSION https://github.com/flutter/flutter
          - export PUB_CACHE=$(pwd)/.pub-cache
          - flutter/bin/flutter config --no-analytics
          - flutter/bin/flutter pub get
          - flutter/bin/flutter build apk --release --target-platform android-arm64
          - find . -name '*.apk'
          - mv build/app/outputs/apk/release/app-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/daniel
        build_repo_dir: /home/daniel/AndroidStudioProjects/schatzsuche
        build_timeout:
        build_user: daniel
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages:
            - curl
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
  - tag: v0.6.1
    apks:
      - apk_pattern: treasurehunt.*\.apk
        apk_url: https://codeberg.org/neonbranch/treasurehunt/releases/download/v0.6.1/treasurehunt-0.6.1.apk
        build:
          - git checkout 56d1938382a86a2f8d6cc87521d194e4515cdd2b
          - sed -r 's/(version:\ 0).5.9/\1.6.0/' -i pubspec.yaml
          - sed -r '/signingConfigs.release/d ; /signingConfigs \{/,/^    \}/d' -i android/app/build.gradle
          - FLUTTER_VERSION="$(sed -rn 's/\s*\bflutter:\s\^?([0-9.]+)\s*$/\1/p' pubspec.yaml)"
          - git clone -b $FLUTTER_VERSION https://github.com/flutter/flutter
          - export PUB_CACHE=$(pwd)/.pub-cache
          - flutter/bin/flutter config --no-analytics
          - flutter/bin/flutter pub get
          - flutter/bin/flutter build apk --release --target-platform android-arm64
          - find . -name '*.apk'
          - mv build/app/outputs/apk/release/app-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/daniel
        build_repo_dir: /home/daniel/AndroidStudioProjects/schatzsuche
        build_timeout:
        build_user: daniel
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '20.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
            sha256: 04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7
          extra_packages:
            - curl
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
