---
repository: https://github.com/jingcjie/WDCable_flutter.git
updates: releases
versions:
  - tag: v2.0.1
    apks:
      - apk_pattern: app-arm64-v8a-release\.apk
        apk_url: https://github.com/jingcjie/WDCable_flutter/releases/download/v2.0.1/app-arm64-v8a-release.apk
        build:
          - git checkout 5ad29543042c801a7d7dc55280e2d3b7b4c04aa5
          - FLUTTER_VERSION="$(yq -r '.env.FLUTTER_VERSION' .github/workflows/android-release.yml)"
          - ANDROID_API_LEVEL="$(yq -r '.env.ANDROID_API_LEVEL' .github/workflows/android-release.yml)"
          - ANDROID_BUILD_TOOLS_VERSION="$(yq -r '.env.ANDROID_BUILD_TOOLS_VERSION' .github/workflows/android-release.yml)"
          - ANDROID_NDK_VERSION="$(yq -r '.env.ANDROID_NDK_VERSION' .github/workflows/android-release.yml)"
          - ANDROID_CMAKE_VERSION="$(yq -r '.env.ANDROID_CMAKE_VERSION' .github/workflows/android-release.yml)"
          - git clone  --depth 1 -b $FLUTTER_VERSION https://github.com/flutter/flutter
          - export PUB_CACHE=$(pwd)/.pub-cache NO_SIGNING=true
          - sdkmanager --sdk_root="${ANDROID_HOME}" "platforms;android-$ANDROID_API_LEVEL" "build-tools;$ANDROID_BUILD_TOOLS_VERSION" "ndk;$ANDROID_NDK_VERSION" "cmake;$ANDROID_CMAKE_VERSION"
          - flutter/bin/flutter config --no-analytics
          - flutter/bin/flutter pub get
          - flutter/bin/flutter build apk --release --split-per-abi --target-platform="android-arm64"
          - mv build/app/outputs/apk/release/app-arm64-v8a-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/runner
        build_repo_dir: /home/runner/work/WDCable_flutter/WDCable_flutter
        build_timeout:
        build_user: runner
        provisioning:
          android_home: /usr/local/lib/android/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '20.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
            sha256: 04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7
          extra_packages:
            - curl
            - yq
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
