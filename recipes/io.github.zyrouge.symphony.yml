---
repository: https://github.com/zyrouge/symphony.git
updates: releases
notes:
  - do not run "npm postbuild" as that only tries to rename the *signed* APK/AAB and of course fails as there are no such
versions:
  - tag: v2024.11.113
    apks:
      - apk_pattern: symphony-.*\.apk
        apk_url: https://github.com/zyrouge/symphony/releases/download/v2024.11.113/symphony-v2024.11.113.apk
        build:
          - sed -r '/signingConfigs.findByName/d' -i app/build.gradle.kts
          - wget -q -O /tmp/nodejs-lts.zip -- https://nodejs.org/dist/v20.16.0/node-v20.16.0-linux-x64.tar.xz
          - sha256sum -c <<< 'c30af7dfea46de7d8b9b370fa33b8b15440bc93f0a686af8601bbb48b82f16c0  /tmp/nodejs-lts.zip'
          - tar xf /tmp/nodejs-lts.zip -C /opt
          - export PATH="${PATH}:/opt/node-v20.16.0-linux-x64/bin:${HOME}/.node/bin"
          - npm config set prefix "${HOME}/.node"
          - npm ci
          - export APP_VERSION_NAME="$(npm run --silent version:print)"
          - npm run prebuild
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - xz-utils
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
