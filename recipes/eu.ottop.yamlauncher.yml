---
repository: https://codeberg.org/ottoptj/yamlauncher.git
updates: releases
notes:
  - v0.5 needed manual adjustment to the embedded commit
versions:
  - tag: v0.5-test
    apks:
      - apk_pattern: yamlauncher\.apk
        apk_url: https://codeberg.org/ottoptj/yamlauncher/releases/download/v0.5-test/yamlauncher.apk
        build:
          - git reset --soft 56c57b66a90cac0e1a5ac96b5b9edd4e47199986
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
