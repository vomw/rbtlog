---
repository: https://github.com/knighthat/Kreate.git
updates: releases
versions:
  - tag: v1.2.0
    apks:
      - apk_pattern: Kreate-izzy\.apk
        apk_url: https://github.com/knighthat/Kreate/releases/download/v1.2.0/Kreate-izzy.apk
        build:
          - VERCODE="$(sed -rn 's/\s*versionCode = (\d)*\s*/\1/p' composeApp/build.gradle.kts)"
          - cp "fastlane/metadata/android/en-US/changelogs/${VERCODE}.txt" "composeApp/src/androidMain/res/raw/release_notes.txt"
          - ./gradlew assembleIzzy
          - mv composeApp/build/outputs/apk/izzy/Kreate-izzy.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: ubuntu:jammy
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
