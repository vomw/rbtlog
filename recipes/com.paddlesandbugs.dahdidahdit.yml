---
repository: https://github.com/matthiasjordan/dahdidahdit.git
updates: releases
versions:
  - tag: release-1.11.3
    apks:
      - apk_pattern: dahdidahdit-.*\.apk
        apk_url: https://github.com/matthiasjordan/dahdidahdit/releases/download/release-1.11.3/dahdidahdit-1.11.3.apk
        build:
          - sdkmanager 'cmake;3.30.5'
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_timeout:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
