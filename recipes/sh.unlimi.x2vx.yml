---
repository: https://github.com/unlimish/x2vx-android.git
updates: releases
notes:
  - 'FIXME: embedded commit hash mismatch for v1.1.0 (manually adjusted)'
versions:
  - tag: v1.1.0
    apks:
      - apk_pattern: sh.unlimi.x2vx_.*release\.apk
        apk_url: https://github.com/unlimish/x2vx-android/releases/download/v1.1.0/sh.unlimi.x2vx_1.1.0.10100._release.apk
        build:
          - git reset --soft 90dbbb1e6158425f6b3b764656c4a6f9ccd041cc
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/sh.unlimi.x2vx_*_release.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
