---
repository: https://github.com/yasinkacmaz/jetflix.git
updates: disabled
notes:
  - 'FIXME: 3.0.0 was built from a squashed commit, remove inplace-fix with next release'
  - disabled as it was unlisted, see https://github.com/yasinkacmaz/jetflix/issues/344#issuecomment-2900740518
versions:
  - tag: 2.0.0
    apks:
      - apk_pattern: Jetflix-.*\.apk
        apk_url: https://github.com/yasinkacmaz/jetflix/releases/download/$$TAG$$/Jetflix-$$TAG$$-release.apk
        build:
          - sed -r '/signingConfigs.getByName/d' -i app/build.gradle.kts
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/app-release-unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
  - tag: 3.0.0
    apks:
      - apk_pattern: Jetflix.*\.apk
        apk_url: https://github.com/yasinkacmaz/jetflix/releases/download/3.0.0/Jetflix.3.0.0.apk
        build:
          - sed -r '/signingConfigs.getByName/d' -i composeApp/build.gradle.kts
          - ./gradlew assembleRelease
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
          - OUT=composeApp/build/outputs/apk/release/composeApp-release-unsigned.apk
          - reproducible-apk-tools/inplace-fix.py --internal --page-size 16 fix-files "$OUT" 'sed s/0ff5050b3d5c7be053418bd174f111429e97a098/45bd91541afc44470eeb50c454ebc769c69b2e19/' 'META-INF/version-control-info.textproto'
          - mv "$OUT" /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - python3
          image: ubuntu:jammy
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
