---
repository: https://github.com/Kasumicic/vpn-inspector.git
updates: disabled
notes:
  - Github repo and account disappeared on 2026-09-24
versions:
  - tag: v1.6.2
    apks:
      - apk_pattern: VPN-[Ii]nspector.*\.apk
        apk_url: https://github.com/Kasumicic/vpn-inspector/releases/download/v1.6.2/VPN-Inspector-1.6.2.apk
        build:
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '20.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
            sha256: 04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
