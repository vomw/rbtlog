---
repository: https://github.com/acszo/Redomi.git
updates: releases
versions:
  - tag: 1.3.0
    apks:
      - apk_pattern: redomi-release-no-updater\.apk
        apk_url: https://github.com/acszo/Redomi/releases/download/$$TAG$$/redomi-release-no-updater.apk
        build:
          - sed -r '/signingConfigs.release/d' -i app/build.gradle
          - echo -e "storeFile=/dev/null\nstorePassword=storePass\nkeyAlias=alias\nkeyPassword=keypass" >> keystore.properties
          - chmod +x gradlew
          - ./gradlew assembleRepoRelease
          - OUT=app/build/outputs/apk/repo/release/redomi-release-no-updater.apk
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
          - reproducible-apk-tools/inplace-fix.py --internal --page-size 16 fix-newlines "$OUT" 'META-INF/services/*'
          - mv "$OUT" /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
