---
repository: https://github.com/Darkempire78/OpenCalc.git
updates: disabled
notes:
  - 'FIXME: we had to fake buildConfig settings for v3.2.0, remove that "sed" again with the next build; see https://github.com/Darkempire78/OpenCalc/issues/551 '
  - repo and Github account gone 2026-06-30
versions:
  - tag: v3.1.4
    apks:
      - apk_pattern: OpenCalc.*\.apk
        apk_url: https://github.com/Darkempire78/OpenCalc/releases/download/v3.1.4/OpenCalc.v3.1.4.apk
        build:
          - sed -r '/signingConfigs.getByName/d' -i app/build.gradle.kts
          - ./gradlew assembleRelease
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
          - OUT=app/build/outputs/apk/release/app-release-unsigned.apk
          - reproducible-apk-tools/inplace-fix.py --internal --zipalign fix-newlines "$OUT" 'META-INF/services/*'
          - mv "$OUT" /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
  - tag: v3.2.0
    apks:
      - apk_pattern: OpenCalc.*\.apk
        apk_url: https://github.com/Darkempire78/OpenCalc/releases/download/v3.2.0/OpenCalc.v3.2.0.apk
        build:
          - sed -r '/signingConfigs.getByName/d' -i app/build.gradle.kts
          - sed -r 's/versionName = "3.2.0"/versionName = "3.2.0"\n        buildConfigField("String", "VERSION_NAME", "\\"3.1.4\\"")\n      buildConfigField("String", "VERSION_CODE", "\\"52\\"")\n/' -i app/build.gradle.kts
          - ./gradlew assembleRelease
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
          - OUT=app/build/outputs/apk/release/app-release-unsigned.apk
          - reproducible-apk-tools/inplace-fix.py --internal --zipalign fix-newlines "$OUT" 'META-INF/services/*'
          - mv "$OUT" /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
  - tag: v3.2.1
    apks:
      - apk_pattern: OpenCalc.*\.apk
        apk_url: https://github.com/clementwzk/OpenCalc/releases/download/v3.2.1/OpenCalc.v3.2.1.apk
        build:
          - sed -r '/signingConfigs.getByName/d' -i app/build.gradle.kts
          - sed -r 's/versionCode = 53/versionCode = 54/ ; s/versionName = "3.2.0"/versionName = "3.2.1"\n        buildConfigField("String", "VERSION_NAME", "\\"3.2.1\\"")\n      buildConfigField("String", "VERSION_CODE", "\\"54\\"")\n/' -i app/build.gradle.kts
          - ./gradlew assembleRelease
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
          - OUT=app/build/outputs/apk/release/app-release-unsigned.apk
          - reproducible-apk-tools/inplace-fix.py --internal --zipalign fix-newlines "$OUT" 'META-INF/services/*'
          - mv "$OUT" /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
