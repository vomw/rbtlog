---
repository: https://github.com/floccusaddon/floccus.git
updates: releases
versions:
  - tag: v5.3.1
    apks:
      - apk_pattern: floccus-build-.*\.apk
        apk_url: https://github.com/floccusaddon/floccus/releases/download/$$TAG$$/floccus-build-$$TAG$$.apk
        build:
          - wget -q -O /tmp/nodejs-lts.zip -- https://nodejs.org/dist/v20.18.0/node-v20.18.0-linux-x64.tar.xz
          - sha256sum -c <<< '4543670b589593f8fa5f106111fd5139081da42bb165a9239f05195e405f240a  /tmp/nodejs-lts.zip'
          - tar xf /tmp/nodejs-lts.zip -C /opt
          - export PATH="${PATH}:/opt/node-v20.18.0-linux-x64/bin"
          - npm install
          - npx gulp
          - npx cap sync
          - cd android
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/app-release-unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - xz-utils
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
