---
repository: https://github.com/trinadhthatakula/Thor.git
updates: releases
versions:
  - tag: Thor_v1600
    apks:
      - apk_pattern: .hor_.*\.apk
        apk_url: https://github.com/trinadhthatakula/Thor/releases/download/Thor_v1600/Thor_v1600.apk
        build:
          - chmod +x gradlew
          - base64 -d > local.properties <<< QVBJX1VSTD1odHRwczovL3BsYXktaW50ZWdyaXR5LWNoZWNrZXItc2VydmVyLXRyaW5hZGgtdGhhdGFrdWxhcy1wcm9qZWN0cy52ZXJjZWwuYXBwL2FwaS9jaGVjaz90b2tlbj0K
          - ./gradlew assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/app-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: ubuntu:jammy
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
