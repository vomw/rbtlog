---
repository: https://github.com/vbresan/MindfulAttentionAwarenessScale.git
updates: releases
versions:
  - tag: '4'
    apks:
      - apk_pattern: biz.binarysolutions.mindfulscale-.*-withoutAds-release\.apk
        apk_url: https://github.com/vbresan/MindfulAttentionAwarenessScale/releases/download/4/biz.binarysolutions.mindfulscale-1.0.3-withoutAds-release.apk
        build:
          - git clone https://github.com/obfusk/gradlew.py.git
          - gradlew.py/gradlew.py -v assembleWithoutAdsRelease
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
          - OUT=app/build/outputs/apk/withoutAds/release/biz.binarysolutions.mindfulscale-*-withoutAds-release-unsigned.apk
          - reproducible-apk-tools/inplace-fix.py --internal --page-size 4 fix-newlines $OUT 'META-INF/services/*'
          - mv $OUT /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
