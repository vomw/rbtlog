---
repository: https://github.com/ssalggnikool/Navic.git
updates: releases
versions:
  - tag: v1.0.0-alpha51
    apks:
      - apk_pattern: Navic\.apk
        apk_url: https://github.com/ssalggnikool/Navic/releases/download/v1.0.0-alpha51/Navic.apk
        build:
          - sed -ri '/org.gradle.toolchains.foojay-resolver-convention/d' settings.gradle.kts
          - sed -ri '/foojay/d ; /toolchainVendor/d' gradle/gradle-daemon-jvm.properties
          - ./gradlew :androidApp:packageRelease --stacktrace
          - find . -name '*.apk'
          - mv androidApp/build/outputs/apk/release/Navic.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '22.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
            sha256: 4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583
          extra_packages: []
          image: ubuntu:noble
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
