---
repository: https://github.com/DmitryTsyvtsyn/AlgoSortingAnimations.git
updates: releases
notes:
  - 'FIXME: release_v1.0 was built from different commit'
versions:
  - tag: release_v1.0
    apks:
      - apk_pattern: app-release\.apk
        apk_url: https://github.com/DmitryTsyvtsyn/AlgoSortingAnimations/releases/download/release_v1.0/app-release.apk
        build:
          - git checkout de47d67e713bb5d561f29b2d13bcac0029cd35af
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
