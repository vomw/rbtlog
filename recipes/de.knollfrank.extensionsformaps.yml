---
repository: https://github.com/KnollFrank/ExtensionsForMaps.git
updates: releases
notes:
  - 'FIXME: v1.1.2 has a broken gradle-wrapper.properties, which should be fixed with the next release, so we can remove our explicit version setting – https://github.com/KnollFrank/ExtensionsForMaps/issues/1 '
versions:
  - tag: v1.1.2
    apks:
      - apk_pattern: app-release\.apk
        apk_url: https://github.com/KnollFrank/ExtensionsForMaps/releases/download/v1.1.2/app-release.apk
        build:
          - git checkout 9635143ba2e9b63d211d8cf87ae4b0054b353b14
          - git clone https://codeberg.org/IzzyOnDroid/gradlew.py
          - gradlew.py/gradlew.py --version 9.8.2 -v assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '22.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
            sha256: 4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583
          extra_packages:
            - python3
          image: ubuntu:noble
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
  - tag: v1.1.3
    apks:
      - apk_pattern: app-release\.apk
        apk_url: https://github.com/KnollFrank/ExtensionsForMaps/releases/download/v1.1.3/app-release.apk
        build:
          - git clone https://codeberg.org/IzzyOnDroid/gradlew.py
          - gradlew.py/gradlew.py --version 9.8.2 -v assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '22.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
            sha256: 4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583
          extra_packages:
            - python3
          image: ubuntu:noble
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
