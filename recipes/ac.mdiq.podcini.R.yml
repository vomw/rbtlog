---
repository: https://github.com/XilinJia/Podcini.git
updates: disabled
notes:
  - 'FIXED: 6.16.1 + 7.0.3 failed, see https://github.com/XilinJia/Podcini/issues/129#issuecomment-2564827016'
  - 7.1.1 seems to be flaky; failed on the first run, succeeded on the second without changes
  - 2024-01-15 app is discontinued, see https://github.com/XilinJia/Podcini/issues/82#issuecomment-2591087730
versions:
  - tag: 6.13.7
    apks:
      - apk_pattern: Podcini.R_release_free_.*_arm64-v8a\.apk
        apk_url: https://github.com/XilinJia/Podcini/releases/download/6.13.7/Podcini.R_release_free_6.13.7_arm64-v8a.apk
        build:
          - sed -r '/signingConfigs.releaseConfig/d ; /wearable/d' -i app/build.gradle
          - chmod +x gradlew
          - ./gradlew assembleFreeRelease
          - mv app/build/outputs/apk/free/release/Podcini.R_release_free_*_arm64-v8a.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
