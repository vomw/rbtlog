---
repository: https://github.com/vbresan/PerceivedStressScale.git
updates: releases
versions:
  - tag: '5'
    apks:
      - apk_pattern: biz.binarysolutions.stress.*withoutAds-release\.apk
        apk_url: https://github.com/vbresan/PerceivedStressScale/releases/download/5/biz.binarysolutions.stress-1.1.2-withoutAds-release.apk
        build:
          - git clone https://github.com/obfusk/gradlew.py.git
          - gradlew.py/gradlew.py -v assembleWithoutAdsRelease
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
          - OUT=app/build/outputs/apk/withoutAds/release/biz.binarysolutions.stress-*-withoutAds-release-unsigned.apk
          - reproducible-apk-tools/inplace-fix.py --internal --zipalign fix-newlines $OUT 'META-INF/services/*'
          - mv $OUT /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
  - tag: '6'
    apks:
      - apk_pattern: biz.binarysolutions.stress.*withoutAds-release\.apk
        apk_url: https://github.com/vbresan/PerceivedStressScale/releases/download/6/biz.binarysolutions.stress-1.1.3-withoutAds-release.apk
        build:
          - git clone https://github.com/obfusk/gradlew.py.git
          - gradlew.py/gradlew.py -v assembleWithoutAdsRelease
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
          - OUT=app/build/outputs/apk/withoutAds/release/biz.binarysolutions.stress-*-withoutAds-release-unsigned.apk
          - reproducible-apk-tools/inplace-fix.py --internal --zipalign fix-newlines $OUT 'META-INF/services/*'
          - mv $OUT /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
