---
repository: https://github.com/sunilpaulmathew/sNotz.git
updates: releases
notes:
  - 'FIXME: v0.35 needed several manual adjustments which should be removed for later builds, see https://github.com/sunilpaulmathew/sNotz/issues/58 '
versions:
  - tag: v0.33
    apks:
      - apk_pattern: app-fdroid-release\.apk
        apk_url: https://github.com/sunilpaulmathew/sNotz/releases/download/$$TAG$$/app-fdroid-release.apk
        build:
          - chmod +x gradlew
          - ./gradlew assembleFdroidRelease
          - mv app/build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
  - tag: v0.34
    apks:
      - apk_pattern: app-fdroid-release\.apk
        apk_url: https://github.com/sunilpaulmathew/sNotz/releases/download/$$TAG$$/app-fdroid-release.apk
        build:
          - chmod +x gradlew
          - ./gradlew assembleFdroidRelease
          - mv app/build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
  - tag: v0.35
    apks:
      - apk_pattern: app-fdroid-release\.apk
        apk_url: https://github.com/sunilpaulmathew/sNotz/releases/download/$$TAG$$/app-fdroid-release.apk
        build:
          - sed -ri 's/d532608ca4/d532608ca4b15c4935ca33b66d7770f632febed4/' gradle/libs.versions.toml
          - chmod +x gradlew
          - ./gradlew assembleFdroidRelease
          - find . -name '*.apk'
          - mkdir reproducible-apk-tools
          - tar xf "${PROVISIONING_CACHE_REPRO_APK_PATH}" --strip-components=1 -C reproducible-apk-tools/
          - OUT="app/build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk"
          - reproducible-apk-tools/inplace-fix.py --internal --page-size 16 fix-files "$OUT" 'sed s/156b6715bac84c986629ad2eea627a0cee2dbf90/b4f318748e73c341610d5a3f90dee70a74a2b621/' 'META-INF/version-control-info.textproto'
          - mv "$OUT" /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cached_tools:
            - name: repro-apk
              file_name: repro-apk.tar.gz
              version: v0.3.0
              url: https://api.github.com/repos/obfusk/reproducible-apk-tools/tarball/v0.3.0
              sha256: b9b595358cae8ed0a5124d452b7902a8434c4105937ba4e5284f6a2d6160b185
          cmake:
          cmdline_tools:
            version: '20.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
            sha256: 04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
