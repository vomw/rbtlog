---
repository: https://github.com/Leonidius20/BeatInspector.git
updates: releases
versions:
  - tag: 0.0.8
    apks:
      - apk_pattern: app-release\.apk
        apk_url: https://github.com/Leonidius20/BeatInspector/releases/download/0.0.8/app-release.apk
        build:
          - sed -r '/signingConfigs.getByName/d' -i app/build.gradle.kts
          - touch local.properties
          - base64 -d > secrets.properties <<< U1BPVElGWV9DTElFTlRfSUQ9MTViM2M0NGNiZjMxNGM5Nzg1ZWViOGUwYTdkMGUzMTcK
          - sed -r 's/2025-02-16T19:11:53.666Z/2024-06-17T15:38:17.319Z/'
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - git clone -b v0.3.0 https://github.com/obfusk/reproducible-apk-tools.git
          - reproducible-apk-tools/inplace-fix.py --internal --zipalign fix-files app/build/outputs/apk/release/app-release-unsigned.apk 'sed s/"generated":"[^"]*"/"generated":"2024-06-17T15:38:17.319Z"/' 'res/M7.json'
          - mv app/build/outputs/apk/release/app-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
