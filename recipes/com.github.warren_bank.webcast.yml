---
repository: https://github.com/warren-bank/Android-WebCast.git
updates: releases
versions:
  - tag: v05.02.00
    apks:
      - apk_pattern: WebCast-.*withAllLanguageTranslations-withAdBlock-release\.apk
        apk_url: https://github.com/warren-bank/Android-WebCast/releases/download/v05.02.00/WebCast-005.02.00-16API-withAllLanguageTranslations-withAdBlock-release.apk
        build:
          - cd android-studio-project
          - git clone https://github.com/obfusk/gradlew.py.git
          - JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64 gradlew.py/gradlew.py --version 7.6.4 -v assembleWithAllLanguageTranslationsWithAdblockRelease
          - mv WebCast/build/outputs/apk/withAllLanguageTranslationsWithAdBlock/release/WebCast*.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - openjdk-11-jdk-headless
            - python3
          image: debian:bullseye-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
