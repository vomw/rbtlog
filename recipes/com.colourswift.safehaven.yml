---
repository: https://github.com/phsycologicalFudge/SafeHaven-Store.git
updates: releases
notes:
  - 'FIXME: after v2.1.1, cargo ndk and ndk can be taken from engine/Cargo.toml (steps already prepared), so remove the explicit versions. sdkmanager call to install NDK can be skipped then entirely, as NDKs will be aligned'
versions:
  - tag: v2.0.5
    apks:
      - apk_pattern: safehaven-store\.apk
        apk_url: https://github.com/phsycologicalFudge/SafeHaven-Store/releases/download/v2.0.5/safehaven-store.apk
        build:
          - FLUTTER_VERSION="$(sed -rn 's/^\s*flutter:\s\^?([0-9.]+)\s*$/\1/p' pubspec.yaml)"
          - git clone -b $FLUTTER_VERSION https://github.com/flutter/flutter
          - export PUB_CACHE=$(pwd)/.pub-cache
          - flutter/bin/flutter config --no-analytics
          - flutter/bin/flutter pub get
          - sed -i -e 's/-Wl,/-Wl,--build-id=none,/' ${PUB_CACHE}/hosted/*/jni-*/src/CMakeLists.txt
          - flutter/bin/flutter build apk --release --split-per-abi
          - find . -name '*.apk'
          - mv build/app/outputs/flutter-apk/app-arm64-v8a-release*.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/runner
        build_repo_dir: /home/runner/work/SafeHaven-Store/SafeHaven-Store
        build_timeout:
        build_user: runner
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '22.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
            sha256: 4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583
          extra_packages:
            - curl
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
