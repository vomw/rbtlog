          - sed -ri "s/(val appVersionName =) releaseVersionName\(\)/\1 \"${APP_TAG#v}\"/" app/build.gradle.kts
          - chmod +x gradlew
          - ./gradlew assembleFossRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/foss/release/Minus-v*.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '22.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
            sha256: 4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583
          extra_packages:
            - openjdk-17-jdk-headless
          image: ubuntu:jammy
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
