---
repository: https://github.com/cuadratico/NowiChat.git
updates: disabled
notes:
  - disabled updates as they are disabled in our repo due to lost signing key
  - stays disabled as there will be no more updates, app is going to be superseded by a successor, see https://github.com/cuadratico/NowiChat/issues/2#issuecomment-3415920461
versions:
  - tag: V0.0.2
    apks:
      - apk_pattern: NowiChat\.apk
        apk_url: https://github.com/cuadratico/NowiChat/releases/download/V0.0.2/NowiChat.apk
        build:
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
