---
repository: https://github.com/mark99i/AppSearcher.git
updates: releases
notes:
  - 'FIXME: versionCode + versionName are calculated based on build time, see https://github.com/mark99i/AppSearcher/blob/master/app/build.gradle#L14'
  - 'FIXME: latest tag is always (?) named "release-next"?'
versions:
  - tag: release-next
    apks:
      - apk_pattern: AppSearcher.*-release\.apk
        apk_url: https://github.com/mark99i/AppSearcher/releases/download/release-next/AppSearcher.v24.01.13.03-release.apk
        build:
          - chmod +x gradlew
          - sed -r 's/versionCode getVersionCode\(\)/versionCode 24011303/' -i app/build.gradle
          - sed -r 's/versionName getVersionName\(\)/versionName "24.01.13.03"/' -i app/build.gradle
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
