---
repository: https://github.com/DennisBauer/RecurringExpenseTracker.git
updates: releases
notes:
  - 'FIXED: v0.12.0 has one recource file updated from some local, uncommitted change and thus is not RB'
  - 'FIXED: v0.12.1 has one recource file updated from some local, uncommitted change and thus is not RB; https://github.com/DennisBauer/RecurringExpenseTracker/issues/296'
versions:
  - tag: v0.7.2
    apks:
      - apk_pattern: RecurringExpenseTracker_.*\.apk
        apk_url: https://github.com/DennisBauer/RecurringExpenseTracker/releases/download/v0.7.2/RecurringExpenseTracker_0.7.2.apk
        build:
          - sed -r '/signingConfigs.getByName/d' -i app/build.gradle.kts
          - chmod +x gradlew
          - ./gradlew assembleRelease
          - mv app/build/outputs/apk/release/RecurringExpenseTracker*.apk /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages: []
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: true
