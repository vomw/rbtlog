---
repository: https://github.com/mattipunkt/schmackofatz.git
updates: releases
versions:
  - tag: v2.0.4
    apks:
      - apk_pattern: schmackofatz-app-arm64-v8a-release\.apk
        apk_url: https://github.com/mattipunkt/schmackofatz/releases/download/v2.0.4/schmackofatz-app-arm64-v8a-release.apk
        build:
          - sed -r '/signingConfigs.release/d' -i android/app/build.gradle
          - echo -e "keyAlias=keyAlias\nkeyPassword=keyPassword\nstorePassword=storePassword" > key.properties
          - FLUTTER_VERSION="$(sed -rn 's/^\s*flutter-version:\ ([0-9\.]*)/\1/p' .github/workflows/build-and-release.yml | head -n 1)"
          - git clone -b $FLUTTER_VERSION https://github.com/flutter/flutter
          - export PUB_CACHE=$(pwd)/.pub-cache
          - flutter/bin/flutter config --no-analytics
          - flutter/bin/flutter pub get
          - flutter/bin/flutter build apk --build-name="${APP_TAG}" --release --split-per-abi --target-platform=android-arm64
          - find . -name '*.apk'
          - mv build/app/outputs/apk/release/app-arm64-v8a-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /home/runner
        build_repo_dir: /home/runner/work/schmackofatz/schmackofatz
        build_timeout:
        build_user: runner
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages:
            - curl
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
