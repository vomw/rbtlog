---
repository: https://github.com/steel101/Wear-Sync-for-Breezy.git
updates: releases
versions:
  - tag: v1.0.34
    apks:
      - apk_pattern: app-release.*\.apk
        apk_url: https://github.com/steel101/Wear-Sync-for-Breezy/releases/download/v1.0.34/app-release-unsigned-signed.apk
        build:
          - git checkout 968afc8f48944781bc7ea550754636a96ad4d6a2
          - sed -ri '/org.gradle.toolchains.foojay-resolver-convention/d' settings.gradle.kts
          - sed -ri '/foojay/d' gradle/gradle-daemon-jvm.properties
          - chmod +x gradlew
          - ./gradlew :app:assembleRelease
          - find . -name '*.apk'
          - mv app/build/outputs/apk/release/*unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools: 35.0.0
          cmake:
          cmdline_tools:
            version: '20.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
            sha256: 04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7
          extra_packages: []
          image: ubuntu:jammy
          jdk: openjdk-21-jdk-headless
          ndk:
          platform: android-35
          platform_tools:
          tools:
          verify_gradle_wrapper: true
