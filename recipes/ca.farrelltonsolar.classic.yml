---
repository: https://github.com/ClassicDIY/ClassicMonitor.git
updates: releases
notes:
  - 'FIXME: V2.7.5 requires manual soft-reset to embedded commit hash plus gradle injection as their gradle wrapper is broken and outaged – https://github.com/ClassicDIY/ClassicMonitor/issues/30'
versions:
  - tag: V2.7.5
    apks:
      - apk_pattern: app-release\.apk
        apk_url: https://github.com/ClassicDIY/ClassicMonitor/releases/download/V2.7.5/app-release.apk
        build:
          - git reset --soft 8947a8aade6dda0e1320fbe4055ee6908c9399b6
          - wget -q -O /tmp/gradle-8.9-bin.zip -- https://services.gradle.org/distributions/gradle-8.9-bin.zip
          - sha256sum -c <<< 'd725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab  /tmp/gradle-8.9-bin.zip'
          - unzip -q -d /opt /tmp/gradle-8.9-bin.zip
          - export PATH="${PATH}:/opt/gradle-8.9/bin"
          - sed -r '/signingConfigs.release/d' -i app/build.gradle
          - export KEYSTORE=/dev/null KEYSTORE_PASSWORD=pass KEY_ALIAS=alias KEY_PASSWORD=pass
          - gradle assembleRelease
          - git clone -b v0.2.8 https://github.com/obfusk/reproducible-apk-tools.git
          - OUT=app/build/outputs/apk/release/app-release-unsigned.apk
          - reproducible-apk-tools/inplace-fix.py --internal --page-size 16 fix-newlines "$OUT" 'assets/*.html'
          - mv "$OUT" /outputs/unsigned.apk
        build_home_dir: /build
        build_repo_dir: /build/repo
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '12.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sha256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
          extra_packages:
            - python3
          image: debian:bookworm-slim
          jdk: openjdk-17-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
