---
repository: https://github.com/RoBoT095/printnotes.git
updates: releases
versions:
  - tag: v0.10.5
    apks:
      - apk_pattern: app-arm64-v8a-release\.apk
        apk_url: https://github.com/RoBoT095/printnotes/releases/download/v0.10.5/app-arm64-v8a-release.apk
        build:
          - git checkout ae42988c399161157632be0a27e667c059b1b2fc
          - sed -r '/signingConfigs.release/d' -i android/app/build.gradle
          - FLUTTER_VERSION="$(sed -rn 's/^\s*flutter:\s*\^?([0-9.]+)$/\1/p' pubspec.yaml)"
          - git clone -b $FLUTTER_VERSION https://github.com/flutter/flutter
          - export PUB_CACHE=$(pwd)/.pub-cache
          - flutter/bin/flutter config --no-analytics
          - flutter/bin/flutter pub get
          - flutter/bin/dart run pdfrx:remove_wasm_modules
          - flutter/bin/flutter build apk --release --target-platform="android-arm64" --split-per-abi
          - find . -name '*.apk'
          - mv build/app/outputs/apk/release/app-arm64-v8a-release-unsigned.apk /outputs/unsigned.apk
        build_cpus:
        build_home_dir: /app/rpg
        build_repo_dir: /app/rpg/Programming/Github
        build_timeout:
        build_user: build
        provisioning:
          android_home: /opt/sdk
          build_tools:
          cmake:
          cmdline_tools:
            version: '19.0'
            url: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            sha256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
          extra_packages:
            - curl
            - ninja-build
            - clang
            - pkg-config
          image: debian:trixie-slim
          jdk: openjdk-21-jdk-headless
          ndk:
          platform:
          platform_tools:
          tools:
          verify_gradle_wrapper: false
